<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — Calendrier Famille</title>
<link rel="stylesheet" href="style.css">
<style>
.boite{max-width:400px;margin:0 auto;padding:12vh 16px 0}
.carte{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:30px;box-shadow:var(--shadow)}
.discret{color:var(--ink-2);font-size:.88rem}
.msg{display:none;padding:11px 14px;border-radius:var(--radius-s);margin-top:12px;font-size:.88rem}
.msg.erreur{display:block;background:#fbeeea;color:#b03a2e}
</style>
</head>
<body>
<div class="boite">
  <div class="carte">
    <div style="font-size:2rem;margin-bottom:6px">🗓️</div>
    <h1 style="font-size:1.35rem;letter-spacing:-.02em;margin-bottom:4px">Calendrier Famille</h1>
    <p class="discret">Connexion réservée à la famille.</p>
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="prenom@exemple.fr" autocomplete="username">
    <label for="mdp">Mot de passe</label>
    <input type="password" id="mdp" autocomplete="current-password">
    <button class="btn primaire" id="btn-connexion" style="width:100%;margin-top:16px">Se connecter</button>
    <div id="message" class="msg"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const msg=document.getElementById('message');
function afficher(texte){msg.textContent=texte;msg.className='msg erreur'}

async function redirigerSiConnecte(){
  const {session,role}=await getSessionEtRole();
  if(!session)return;
  if(role){window.location.replace('calendrier.html')}
  else{
    afficher("Votre email ("+session.user.email+") n'est pas autorisé.");
    await sb.auth.signOut();
  }
}
redirigerSiConnecte();

document.getElementById('btn-connexion').addEventListener('click',async()=>{
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('mdp').value;
  if(!email.includes('@')||!password){afficher('Email et mot de passe requis.');return}
  const btn=document.getElementById('btn-connexion');
  btn.disabled=true;
  const {error}=await sb.auth.signInWithPassword({email,password});
  btn.disabled=false;
  if(error){
    afficher(error.message.includes('Invalid login')?'Email ou mot de passe incorrect.':'Erreur : '+error.message);
    return;
  }
  redirigerSiConnecte();
});
['email','mdp'].forEach(id=>document.getElementById(id).addEventListener('keydown',e=>{
  if(e.key==='Enter')document.getElementById('btn-connexion').click();
}));
</script>
</body>
</html>
