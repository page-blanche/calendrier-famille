/* ================== 🏠 MAISON ================== */
/*  Ce qui s'entretient, ce qui se prélève.
    La règle de l'onglet : pour un contrat, la date qui compte n'est pas
    celle du renouvellement mais celle AVANT LAQUELLE il faut agir.      */
let vueMaison='entretien';    // 'entretien' | 'abonnements'
let maisonOuvert=null;        // la fiche ouverte : {genre,id}

function moisPlus(sDate,n){
  if(!sDate||!n)return null;
  const d=deIso(sDate);
  const j=d.getDate();
  d.setDate(1);d.setMonth(d.getMonth()+n);
  const dernier=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
  d.setDate(Math.min(j,dernier));
  return iso(d);
}
function joursAvant(sDate){
  if(!sDate)return null;
  return Math.round((deIso(sDate)-deIso(iso(new Date())))/86400000);
}
function delaiFr(n){
  if(n===null)return '';
  if(n<0){const j=-n;
    return j<31?`en retard de ${j} jour${j>1?'s':''}`
      :`dépassé de ${Math.round(j/30)} mois`;}
  if(n===0)return "aujourd'hui";
  if(n===1)return 'demain';
  if(n<31)return `dans ${n} jours`;
  if(n<365)return `dans ${Math.round(n/30)} mois`;
  return `dans ${Math.round(n/365)} an${n>=730?'s':''}`;
}
/* L'échéance d'un entretien, et la date où l'on veut être prévenu */
function echeanceEntretien(e){
  const du=moisPlus(e.derniere_fois,e.tous_les_mois);
  return {du,prevenir:du?iso(new Date(deIso(du).getTime()-(e.prevenir_avant_jours||30)*86400000)):null};
}
/* Pour un abonnement : la date limite de résiliation, celle qui compte */
function limiteAbo(a){
  if(!a.echeance||!a.reconduction_tacite)return null;
  return iso(new Date(deIso(a.echeance).getTime()-(a.resilier_avant_jours||30)*86400000));
}
/* Ce que la maison réclame : sert ici et sur le planning */
function maisonReclame(){
  const out=[];
  (CACHE.entretiens||[]).forEach(e=>{
    const {du,prevenir}=echeanceEntretien(e);
    if(!du||!prevenir)return;
    const j=joursAvant(prevenir);
    if(j<=0)out.push({genre:'entretien',id:e.id,nom:e.nom,emoji:e.emoji||'🔧',
      quand:du,jours:joursAvant(du),tel:e.contact_tel,montant:null});
  });
  (CACHE.abonnements||[]).forEach(a=>{
    const lim=limiteAbo(a);
    if(!lim)return;
    const j=joursAvant(lim);
    if(j<=45)out.push({genre:'abonnement',id:a.id,nom:a.nom,emoji:a.emoji||'💳',
      quand:lim,jours:j,tel:a.contact_tel,montant:a.montant_mois});
  });
  return out.sort((x,y)=>x.jours-y.jours);
}
function totalAbos(){
  return (CACHE.abonnements||[]).reduce((t,a)=>t+(Number(a.montant_mois)||0),0);
}
function euros(n){
  return (Math.round(n*100)/100).toLocaleString('fr-FR',{minimumFractionDigits:0,maximumFractionDigits:0})+' €';
}
function setVueMaison(v){vueMaison=v;maisonOuvert=null;render()}

function renderMaison(){
  const zone=document.getElementById('vueMaison');
  if(maisonOuvert)return renderMaisonFiche(zone);
  if(vueMaison==='abonnements')return renderAbonnements(zone);
  return renderEntretiens(zone);
}

function renderEntretiens(zone){
  const tout=(CACHE.entretiens||[]).map(e=>({e,...echeanceEntretien(e)}))
    .sort((a,b)=>(a.du||'9999')<(b.du||'9999')?-1:1);
  const urgent=tout.filter(x=>x.prevenir&&joursAvant(x.prevenir)<=0);
  const calme =tout.filter(x=>!urgent.includes(x));
  let h=`<h2 class="ps-titre">🔧 L'entretien</h2>
    <p class="discret2">Tu notes la dernière fois, je calcule la prochaine.</p>`;
  const ligne=(x)=>{
    const j=x.du?joursAvant(x.du):null;
    const tard=j!==null&&j<0;
    const bouts=[];
    if(x.du)bouts.push(`<span style="${tard?'color:var(--alert);font-weight:700':''}">${echap(delaiFr(j))}</span>`);
    if(x.e.derniere_fois)bouts.push('fait le '+deIso(x.e.derniere_fois).getDate()+' '+MFR[deIso(x.e.derniere_fois).getMonth()].toLowerCase()+' '+deIso(x.e.derniere_fois).getFullYear());
    if(x.e.tous_les_mois)bouts.push(x.e.tous_les_mois===12?'annuel':`tous les ${x.e.tous_les_mois} mois`);
    return `<div class="todo-item" data-mai="entretien|${x.e.id}" style="cursor:pointer">
      <div style="flex-shrink:0;font-size:1.15rem">${x.e.emoji||'🔧'}</div>
      <div class="todo-corps"><div class="todo-text">${echap(x.e.nom)}</div>
        <div class="todo-date">${bouts.join(' · ')}</div></div>
      ${x.e.contact_tel?`<a class="todo-act" href="tel:${attr(x.e.contact_tel)}" title="Appeler ${echap(x.e.contact_nom||'')}" onclick="event.stopPropagation()">☎️</a>`:''}
      <div style="color:var(--ink-3)">›</div></div>`;
  };
  if(urgent.length){
    h+=`<div class="td-sect" style="color:var(--alert)">Ça approche<span class="n">${urgent.length}</span></div>`;
    h+=urgent.map(ligne).join('');
  }
  if(calme.length){
    h+=`<div class="td-sect">Le reste<span class="n">${calme.length}</span></div>`;
    h+=calme.map(ligne).join('');
  }
  if(!tout.length)h+=`<div class="todo-empty" style="text-align:center;padding:22px 0">
    Rien à entretenir pour l'instant.<br>Commence par la chaudière ou la voiture 🙂</div>`;
  h+=`<button class="btn primaire" id="ma-new" style="width:100%;margin-top:14px">＋ Quelque chose à entretenir</button>`;
  zone.innerHTML=h;
  brancherVues(zone,setVueMaison);
  brancherMaison(zone);
  document.getElementById('ma-new').onclick=()=>formEntretien(null);
}

function renderAbonnements(zone){
  const tout=(CACHE.abonnements||[]).slice()
    .sort((a,b)=>(limiteAbo(a)||'9999')<(limiteAbo(b)||'9999')?-1:1);
  const total=totalAbos();
  const aDecider=tout.filter(a=>{const l=limiteAbo(a);return l&&joursAvant(l)<=45});
  const reste=tout.filter(a=>!aDecider.includes(a));
  let h=`<h2 class="ps-titre">💳 Les abonnements</h2>`;
  h+=`<div class="carte-solo" style="background:var(--ink);color:#fff;border-color:var(--ink)">
    <div style="font-size:.62rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;opacity:.6">
      Ce qui part chaque mois</div>
    <div style="font-size:1.65rem;font-weight:700;letter-spacing:-.02em;line-height:1.2">${euros(total)}</div>
    <div style="font-size:.74rem;opacity:.62">soit ${euros(total*12)} par an · ${tout.length} abonnement${tout.length>1?'s':''}</div>
  </div>`;
  const ligne=(a)=>{
    const lim=limiteAbo(a),j=lim?joursAvant(lim):null;
    const presse=j!==null&&j<=45;
    const bouts=[];
    if(lim)bouts.push(`<span style="${presse?'color:var(--alert);font-weight:700':''}">résiliable ${echap(delaiFr(j))}</span>`);
    if(a.montant_mois)bouts.push(euros(a.montant_mois)+'/mois');
    if(a.fournisseur)bouts.push(echap(a.fournisseur));
    return `<div class="todo-item" data-mai="abonnement|${a.id}" style="cursor:pointer">
      <div style="flex-shrink:0;font-size:1.15rem">${a.emoji||'💳'}</div>
      <div class="todo-corps"><div class="todo-text">${echap(a.nom)}</div>
        <div class="todo-date">${bouts.join(' · ')}</div></div>
      <div style="color:var(--ink-3)">›</div></div>`;
  };
  if(aDecider.length){
    h+=`<div class="td-sect" style="color:var(--alert)">À décider avant<span class="n">${aDecider.length}</span></div>`;
    h+=aDecider.map(ligne).join('');
  }
  if(reste.length){
    h+=`<div class="td-sect">Tout le reste<span class="n">${reste.length}</span></div>`;
    h+=reste.map(ligne).join('');
  }
  if(!tout.length)h+=`<div class="todo-empty" style="text-align:center;padding:22px 0">
    Aucun abonnement noté.<br>Commence par les assurances : c'est là qu'on perd le plus 🙂</div>`;
  h+=`<button class="btn primaire" id="ab-new" style="width:100%;margin-top:14px">＋ Un abonnement</button>`;
  zone.innerHTML=h;
  brancherVues(zone,setVueMaison);
  brancherMaison(zone);
  document.getElementById('ab-new').onclick=()=>formAbonnement(null);
}
function brancherMaison(zone){
  zone.querySelectorAll('[data-mai]').forEach(el=>{
    el.onclick=()=>{const [g,id]=el.dataset.mai.split('|');maisonOuvert={genre:g,id};render()};
  });
}


/* La fiche d'une ligne de la maison. Pour un contrat, la fenêtre de
   résiliation est ce qu'on vient y chercher : elle est en haut, en rouge. */
function renderMaisonFiche(zone){
  const {genre,id}=maisonOuvert;
  if(genre==='entretien'){
    const e=(CACHE.entretiens||[]).find(x=>x.id===id);
    if(!e){maisonOuvert=null;return render()}
    const {du}=echeanceEntretien(e);
    const j=du?joursAvant(du):null;
    let h=`<button class="btn mini" id="ma-retour" style="margin-bottom:12px">‹ L'entretien</button>
      <h2 class="ps-titre">${e.emoji||'🔧'} ${echap(e.nom)}</h2>`;
    if(du){
      const tard=j<0;
      h+=`<div class="carte-solo" ${tard?'style="border-color:#f3c9c9;background:#fdf5f5"':''}>
        <div style="font-size:.62rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
          color:${tard?'var(--alert)':'var(--ink-3)'}">À refaire ${echap(delaiFr(j))}</div>
        <div style="font-size:.86rem;color:var(--ink-2);margin-top:3px">
          Échéance le ${deIso(du).getDate()} ${MFR[deIso(du).getMonth()].toLowerCase()} ${deIso(du).getFullYear()}.</div>
        <button class="btn primaire mini" id="ma-fait" style="width:100%;margin-top:9px">✅ Je viens de le faire</button>
      </div>`;
    }
    h+=`<div class="carte-solo">
      <div class="td-sect" style="margin-top:0">Le suivi</div>
      ${e.derniere_fois?`<div class="todo-item"><div class="todo-corps"><div class="todo-text">Dernière fois</div>
        <div class="todo-date">${deIso(e.derniere_fois).getDate()} ${MFR[deIso(e.derniere_fois).getMonth()].toLowerCase()} ${deIso(e.derniere_fois).getFullYear()}</div></div></div>`:''}
      ${e.tous_les_mois?`<div class="todo-item"><div class="todo-corps"><div class="todo-text">Tous les</div>
        <div class="todo-date">${e.tous_les_mois===12?'12 mois (annuel)':e.tous_les_mois+' mois'}</div></div></div>`:''}
      <div class="todo-item"><div class="todo-corps"><div class="todo-text">Prévenu</div>
        <div class="todo-date">${e.prevenir_avant_jours||30} jours avant</div></div></div>
    </div>`;
    if(e.contact_nom||e.contact_tel){
      h+=`<div class="carte-solo"><div class="td-sect" style="margin-top:0">Qui appeler</div>
        <div class="todo-item"><div class="todo-corps"><div class="todo-text">${echap(e.contact_nom||'Le pro')}</div>
        <div class="todo-date">${echap(e.contact_tel||'')}</div></div>
        ${e.contact_tel?`<a class="todo-act" href="tel:${attr(e.contact_tel)}">☎️</a>`:''}</div></div>`;
    }
    if(e.note)h+=`<p class="discret2">${echap(e.note)}</p>`;
    h+=`<button class="btn" id="ma-edit" style="width:100%;margin-top:12px">✏️ Modifier</button>`;
    zone.innerHTML=h;
    document.getElementById('ma-retour').onclick=()=>{maisonOuvert=null;render()};
    document.getElementById('ma-edit').onclick=()=>formEntretien(e.id);
    const f=document.getElementById('ma-fait');
    if(f)f.onclick=()=>{
      enregistrerObjet(e.id,'entretiens',{derniere_fois:iso(new Date())});
      toast('C\'est noté — prochaine fois dans '+(e.tous_les_mois||12)+' mois ✔');
      render();
    };
    return;
  }
  const a=(CACHE.abonnements||[]).find(x=>x.id===id);
  if(!a){maisonOuvert=null;return render()}
  const lim=limiteAbo(a),j=lim?joursAvant(lim):null;
  let h=`<button class="btn mini" id="ma-retour" style="margin-bottom:12px">‹ Les abonnements</button>
    <h2 class="ps-titre">${a.emoji||'💳'} ${echap(a.nom)}</h2>
    <p class="discret2" style="margin:-2px 0 10px">${[a.fournisseur,a.reference].filter(Boolean).map(echap).join(' · ')}</p>`;
  if(lim){
    const presse=j<=45;
    h+=`<div class="carte-solo" ${presse?'style="border-color:#f3c9c9;background:#fdf5f5"':''}>
      <div style="font-size:.62rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
        color:${presse?'var(--alert)':'var(--ink-3)'}">À faire avant le ${deIso(lim).getDate()} ${MFR[deIso(lim).getMonth()].toLowerCase()}</div>
      <div style="font-size:.86rem;color:var(--ink-2);margin-top:3px">
        Passé cette date, le contrat se reconduit tout seul.
        ${j>=0?`Il reste <b style="color:${presse?'var(--alert)':'var(--ink)'}">${j} jour${j>1?'s':''}</b> pour renégocier ou partir.`
              :`C'est passé — la reconduction a eu lieu.`}</div>
      <button class="btn primaire mini" id="ab-tache" style="width:100%;margin-top:9px">✅ En faire une tâche</button>
    </div>`;
  }
  h+=`<div class="carte-solo"><div class="td-sect" style="margin-top:0">Le contrat</div>
    ${a.montant_mois?`<div class="todo-item"><div class="todo-corps"><div class="todo-text">${euros(a.montant_mois)} par mois</div>
      <div class="todo-date">${euros(a.montant_mois*12)} par an</div></div></div>`:''}
    ${a.depuis?`<div class="todo-item"><div class="todo-corps"><div class="todo-text">Depuis ${MFR[deIso(a.depuis).getMonth()].toLowerCase()} ${deIso(a.depuis).getFullYear()}</div>
      <div class="todo-date">${Math.max(1,new Date().getFullYear()-deIso(a.depuis).getFullYear())} an(s)</div></div></div>`:''}
    ${a.echeance?`<div class="todo-item"><div class="todo-corps"><div class="todo-text">Échéance</div>
      <div class="todo-date">${deIso(a.echeance).getDate()} ${MFR[deIso(a.echeance).getMonth()].toLowerCase()}, chaque année</div></div></div>`:''}
  </div>`;
  if(a.contact_nom||a.contact_tel){
    h+=`<div class="carte-solo"><div class="td-sect" style="margin-top:0">Qui appeler</div>
      <div class="todo-item"><div class="todo-corps"><div class="todo-text">${echap(a.contact_nom||'Le service client')}</div>
      <div class="todo-date">${echap(a.contact_tel||'')}</div></div>
      ${a.contact_tel?`<a class="todo-act" href="tel:${attr(a.contact_tel)}">☎️</a>`:''}</div></div>`;
  }
  if(a.note)h+=`<p class="discret2">${echap(a.note)}</p>`;
  h+=`<button class="btn" id="ma-edit" style="width:100%;margin-top:12px">✏️ Modifier</button>`;
  zone.innerHTML=h;
  document.getElementById('ma-retour').onclick=()=>{maisonOuvert=null;render()};
  document.getElementById('ma-edit').onclick=()=>formAbonnement(a.id);
  const bt=document.getElementById('ab-tache');
  if(bt)bt.onclick=()=>{
    const base=deIso(lim);
    enregistrerObjet(null,'taches',{texte:'Décider pour '+a.nom+(a.montant_mois?' ('+euros(a.montant_mois)+'/mois)':''),
      cat:'admin',qui:'',ech:lim,
      dateTexte:'Avant le '+base.getDate()+' '+MFR[base.getMonth()].toLowerCase(),
      persistante:false,lien:'',y:base.getFullYear(),m:base.getMonth()+1});
    toast('Dans la to do ✔');
    render();
  };
}

const EMOJIS_ENTRETIEN=['🔧','🔥','🧹','🔔','💧','🚗','🛢️','🪟','🌿','🧯','🔌','🚿'];
function formEntretien(id){
  const e=id?(CACHE.entretiens||[]).find(x=>x.id===id):null;
  ouvrirTiroirBrut(e?echap(e.nom):'Quelque chose à entretenir');
  let emoji=e&&e.emoji?e.emoji:'🔧';
  document.getElementById('dbd').innerHTML=`
    <label class="lbl">Quoi</label>
    <input type="text" id="en-nom" value="${e?attr(e.nom):''}" placeholder="Entretien de la chaudière">
    <label class="lbl">Son icône</label>
    <div class="mg-chips" id="en-emos">${EMOJIS_ENTRETIEN.map(x=>`<button type="button" class="mg-chip ${emoji===x?'actif':''}" data-e="${x}" style="font-size:1.1rem">${x}</button>`).join('')}</div>
    <label class="lbl">La dernière fois</label>
    <input type="date" id="en-der" value="${e&&e.derniere_fois?e.derniere_fois:''}">
    <label class="lbl">À refaire tous les combien</label>
    <select id="en-freq">
      ${[[3,'3 mois'],[6,'6 mois'],[12,'un an'],[24,'deux ans'],[60,'cinq ans']].map(([v,l])=>
        `<option value="${v}" ${e&&e.tous_les_mois===v?'selected':''}>${l}</option>`).join('')}
    </select>
    <label class="lbl">Préviens-moi <span class="discret2">combien de jours avant</span></label>
    <input type="number" id="en-prev" value="${e?(e.prevenir_avant_jours||30):30}" min="1" max="365">
    <label class="lbl">Le pro <span class="discret2">(facultatif)</span></label>
    <input type="text" id="en-cn" value="${e?attr(e.contact_nom||''):''}" placeholder="Son nom">
    <input type="tel" id="en-ct" value="${e?attr(e.contact_tel||''):''}" placeholder="Son téléphone" style="margin-top:8px">
    <label class="lbl">Une note <span class="discret2">(facultatif)</span></label>
    <textarea id="en-note" style="min-height:60px">${e?echap(e.note||''):''}</textarea>
    <button class="btn primaire" id="en-ok" style="width:100%;margin-top:14px">${e?'Enregistrer':'Ajouter'}</button>
    ${e?`<button class="btn danger" id="en-suppr" style="width:100%;margin-top:8px">Supprimer</button>`:''}`;
  document.querySelectorAll('#en-emos [data-e]').forEach(b=>{b.onclick=()=>{
    emoji=b.dataset.e;
    document.querySelectorAll('#en-emos .mg-chip').forEach(x=>x.classList.toggle('actif',x===b));
  }});
  document.getElementById('en-ok').onclick=()=>{
    const nom=document.getElementById('en-nom').value.trim();
    if(!nom){toast('Il faut un nom');return}
    const l={nom,emoji,categorie:'maison',
      derniere_fois:document.getElementById('en-der').value||null,
      tous_les_mois:Number(document.getElementById('en-freq').value)||12,
      prevenir_avant_jours:Number(document.getElementById('en-prev').value)||30,
      contact_nom:document.getElementById('en-cn').value.trim()||null,
      contact_tel:document.getElementById('en-ct').value.trim()||null,
      note:document.getElementById('en-note').value.trim()||null};
    if(!e)l.id=genId();
    enregistrerObjet(id,'entretiens',l);
    fermerTiroir();toast(e?'C\'est noté ✔':'Ajouté 🔧');render();
  };
  const sup=document.getElementById('en-suppr');
  if(sup)sup.onclick=()=>{
    if(!confirm('Supprimer « '+e.nom+' » ?'))return;
    supprimerObjet(e.id);maisonOuvert=null;fermerTiroir();render();
  };
}

const EMOJIS_ABO=['💳','🚗','🏠','⚡','📶','📱','📺','🎵','🛡️','💧','🏥','🎮'];
function formAbonnement(id){
  const a=id?(CACHE.abonnements||[]).find(x=>x.id===id):null;
  ouvrirTiroirBrut(a?echap(a.nom):'Un abonnement');
  let emoji=a&&a.emoji?a.emoji:'💳';
  document.getElementById('dbd').innerHTML=`
    <label class="lbl">Quoi</label>
    <input type="text" id="ab-nom" value="${a?attr(a.nom):''}" placeholder="Assurance auto">
    <label class="lbl">Son icône</label>
    <div class="mg-chips" id="ab-emos">${EMOJIS_ABO.map(x=>`<button type="button" class="mg-chip ${emoji===x?'actif':''}" data-e="${x}" style="font-size:1.1rem">${x}</button>`).join('')}</div>
    <label class="lbl">Chez qui <span class="discret2">(facultatif)</span></label>
    <input type="text" id="ab-four" value="${a?attr(a.fournisseur||''):''}" placeholder="AXA">
    <label class="lbl">Combien par mois</label>
    <input type="number" id="ab-mnt" value="${a&&a.montant_mois!=null?a.montant_mois:''}" step="0.01" placeholder="68">
    <p class="discret2" style="margin-top:4px">Si c'est annuel, divise par douze : le total du haut n'a de sens que ramené au mois.</p>
    <label class="lbl">Quand ça se renouvelle</label>
    <input type="date" id="ab-ech" value="${a&&a.echeance?a.echeance:''}">
    <label class="lbl">Reconduction tacite</label>
    <div class="mg-chips" id="ab-tac">
      <button type="button" class="mg-chip ${!a||a.reconduction_tacite?'actif':''}" data-t="1">Oui — surveille-la</button>
      <button type="button" class="mg-chip ${a&&!a.reconduction_tacite?'actif':''}" data-t="0">Non — résiliable quand je veux</button>
    </div>
    <label class="lbl">À résilier <span class="discret2">combien de jours avant l'échéance</span></label>

/* ================== L'ASSISTANT SUR TELEGRAM ==================
   On ne peut pas écrire à quelqu'un sur Telegram tant qu'il ne nous a
   pas parlé. D'où le lien d'invitation : il contient un code à usage
   unique, la personne appuie sur « Démarrer », et le bot sait qui elle
   est. Une fois fait, plus jamais rien à faire.                       */
const BOT_TG=(typeof BOT_TELEGRAM!=='undefined'&&BOT_TELEGRAM)?BOT_TELEGRAM:'';
/* Le prénom de l'assistant — le même des deux côtés, app et Telegram. */
const PIA='Pia';

function lienTg(personne){return (CACHE.tgliens||[]).find(x=>
  String(x.personne||'').toLowerCase()===String(personne||'').toLowerCase())||null}

/* Un code court, sans lettres qui se confondent — on le lit parfois à voix haute. */
function codeTg(){
  const abc='abcdefghjkmnpqrstuvwxyz23456789';
  let c='';for(let i=0;i<8;i++)c+=abc[Math.floor(Math.random()*abc.length)];
  return c;
}

async function inviterSurTelegram(personne,nom){
  if(!BOT_TG){
    toast('Il manque le nom du bot dans config.js');
    return;
  }
  const code=codeTg();
  const {error}=await sb.from('telegram_invitations')
    .insert({code,personne,cree_par:EMAIL_CONNECTE});
  if(error){toast('⚠️ '+error.message);return}
  const lien=`https://t.me/${BOT_TG}?start=${code}`;
  const txt=`${nom||'Coucou'} ! Ouvre ce lien et appuie sur « Démarrer » : `
    +`${PIA} te dira ta journée chaque matin, et tu pourras lui répondre `
    +`directement — sans jamais ouvrir l'app.\n\n${lien}`;
  partager(txt,'Inviter sur Telegram');
}

function majReglagesTelegram(){
  const zone=document.getElementById('p-tg');
  if(!zone)return;
  if(!BOT_TG){
    zone.innerHTML=`<p class="discret2" style="margin:0">Pas encore configuré.
      Il faut ajouter le nom du bot dans <code>config.js</code> :
      <code>const BOT_TELEGRAM='mon_bot';</code></p>`;
    return;
  }
  // L'app ne connaît pas l'adresse email des autres membres (elle ne stocke
  // que leur prénom). On propose donc soi-même, plus tous ceux déjà branchés,
  // et « inviter quelqu'un d'autre » pour le reste.
  // Tous les comptes de la maison, branchés ou non. Avant, seuls les gens
  // déjà branchés apparaissaient : pour inviter Didier il fallait connaître
  // et retaper son adresse dans une boîte de dialogue, ce que personne ne
  // fait. Celui qu'on veut inviter est justement celui qui manque.
  const vus=new Set();
  const tous=[];
  const pousserQqun=(nom,personne)=>{
    const k=String(personne||'').toLowerCase();
    if(!k||vus.has(k))return;
    vus.add(k);tous.push({nom:nom||personne,personne:k});
  };
  pousserQqun(UTILISATEUR||'Toi',EMAIL_CONNECTE);
  (CACHE.utilisateurs||[]).forEach(u=>pousserQqun(u.nom,u.email));
  (CACHE.tgliens||[]).forEach(l=>pousserQqun(l.nom,l.personne));
  zone.innerHTML=tous.map(x=>{
    const l=lienTg(x.personne);
    const etat=l&&l.actif?`<span style="color:#2f9e44;font-weight:700;font-size:.76rem">✓ branché</span>`
      :l?`<span class="discret2" style="font-size:.76rem">en pause</span>`
      :`<button class="btn mini" data-tginv="${attr(x.personne)}" data-tgnom="${attr(x.nom)}">Inviter →</button>`;
    return `<div class="todo-item"><div class="todo-corps">
      <div class="todo-text">${echap(x.nom)}</div>
      <div class="todo-date">${l?(l.vu_le?'a parlé à Pia '+dateNoteFr(l.vu_le):'reçoit les messages de Pia'):'pas encore branché'}</div></div>
      ${etat}</div>`;
  }).join('')
  +`<button class="btn mini" id="p-tg-autre" style="width:100%;margin-top:8px">＋ Brancher quelqu'un d'autre</button>`
  +`<p class="discret2" style="margin:8px 0 0">Le lien met la personne en relation avec Pia : elle appuie une
     fois sur « Démarrer », et n'a plus jamais rien à faire.</p>`;
  zone.querySelectorAll('[data-tginv]').forEach(b=>{
    b.onclick=()=>inviterSurTelegram(b.dataset.tginv,b.dataset.tgnom);
  });
  document.getElementById('p-tg-autre').onclick=()=>{
    const email=prompt("Son adresse de connexion à l'app :");
    if(!email||!email.includes('@'))return;
    inviterSurTelegram(email.trim().toLowerCase(),'');
  };
}

/* ================== NAVIGATION & VUES ================== */
/*  Cinq onglets en bas. Chacun porte ses vues, et chaque vue garde sa
    propre présentation — c'est la règle qui court partout :
      Planning : aujourd'hui · le mois · les repas
      To do    : toi · les autres · les courses
      Mémoire  : les gens · envies · cadeaux · recettes
      Santé    : les fiches, inchangées
      Maison   : entretien · abonnements                                  */
let section='planning';
let vuePlanning='jour';       // 'jour' | 'mois' | 'repas'
let UTILISATEUR=null;let EMAIL_CONNECTE='';
/* Les réglages de la personne connectée. Les valeurs par défaut sont celles
   qui étaient écrites en dur avant : rien ne change tant qu'on n'y touche pas. */
let REGLAGES={cadeau_avant_jours:7,valises_avant_jours:2,maison_avant_jours:7,
  rappels_insistance:'normal',heure_briefing:8};
async function chargerReglages(){
  if(!EMAIL_CONNECTE)return;
  const {data}=await sb.from('app_users')
    .select('cadeau_avant_jours,valises_avant_jours,maison_avant_jours,rappels_insistance,heure_briefing')
    .ilike('email',EMAIL_CONNECTE).maybeSingle();
  if(data)REGLAGES={...REGLAGES,...Object.fromEntries(Object.entries(data).filter(([,v])=>v!=null))};
}
function poserReglage(champ,valeur){
  REGLAGES[champ]=valeur;
  pousser(sb.from('app_users').update({[champ]:valeur}).ilike('email',EMAIL_CONNECTE));
}

const ONGLETS=['planning','todo','memoire','sante','maison'];

function fabAction(){
  if(section==='todo')return formTache(null);
  if(section==='memoire')return formPersonne(null);
  if(section==='sante')return formTraitement(null);
  ouvrirAjout(null);
}

/* Les pastilles de vues d'un onglet : `defs` = [[clé, libellé, compteur], …] */
function barreVues(defs,actuelle,attr){
  return `<div class="vues" data-vues="${attr}">`+defs.map(([k,l,n])=>
    `<button class="${k===actuelle?'actif':''}" data-v="${k}">${l}${n?`<span class="n">${n}</span>`:''}</button>`
  ).join('')+`</div>`;
}
/* La barre de période. Elle était à trois niveaux : le mois dans l'en-tête
   de l'app, la semaine des repas à l'intérieur de la page, et la journée
   nulle part — elle était figée sur aujourd'hui. Une seule barre, toujours
   sous les onglets, donc sous ce qu'elle commande. */
function majNavPeriode(){
  const z=document.getElementById('navPeriode');
  if(!z)return;
  if(section!=='planning'){z.innerHTML='';return}
  let quoi='',ici=false;
  if(vuePlanning==='mois'){
    quoi=MFR[cur.getMonth()]+' '+cur.getFullYear();
    const n=new Date();ici=cur.getFullYear()===n.getFullYear()&&cur.getMonth()===n.getMonth();
  }else if(vuePlanning==='repas'){
    const l=lundiDe(new Date());l.setDate(l.getDate()+semaineRepas*7);
    quoi=semaineRepas===0?'Cette semaine':semaineRepas===1?'La semaine prochaine'
        :'Semaine du '+l.getDate()+' '+MFR[l.getMonth()].toLowerCase();
    ici=semaineRepas===0;
  }else{
    const d=deIso(jourVu);
    quoi=DFR[jSem(d)-1]+' '+d.getDate()+' '+MFR[d.getMonth()].toLowerCase();
    ici=jourVu===iso(new Date());
  }
  z.innerHTML=`<div class="nav-periode">
    <button class="np-f" data-np="-1" title="Précédent">‹</button>
    <span class="np-q">${echap(quoi.charAt(0).toUpperCase()+quoi.slice(1))}</span>
    <button class="np-f" data-np="1" title="Suivant">›</button>
    ${ici?'':`<button class="np-auj" data-np="0">${vuePlanning==='repas'?'Cette semaine':"Aujourd'hui"}</button>`}
  </div>`;
  z.querySelectorAll('[data-np]').forEach(b=>{b.onclick=()=>navPeriode(Number(b.dataset.np))});
}
function navPeriode(dir){
  if(vuePlanning==='mois'){
    if(dir===0)cur=new Date();else cur=new Date(cur.getFullYear(),cur.getMonth()+dir,1);
  }else if(vuePlanning==='repas'){
    semaineRepas=dir===0?0:semaineRepas+dir;
  }else{
    if(dir===0)jourVu=iso(new Date());
    else{const d=deIso(jourVu);d.setDate(d.getDate()+dir);jourVu=iso(d)}
  }
  render();majNavPeriode();
}

function brancherVues(zone,poser){
  const b=zone.querySelector('[data-vues]');
  if(!b)return;
  b.querySelectorAll('[data-v]').forEach(el=>{el.onclick=()=>poser(el.dataset.v)});
}

function setVuePlanning(v){
  vuePlanning=v;
  if(v==='mois')vue='mois';
  // Passer d'une vue à l'autre change de conteneur : « Aujourd'hui » et
  // « Repas » vivent dans une page, le mois dans la zone calendrier.
  // C'est setSection qui sait lequel montrer — sinon on redessine dans
  // un élément resté caché.
  setSection('planning');
}

/* Les pastilles de la barre : un point rouge quand quelque chose presse. */
function majBarreBas(){
  const b=document.getElementById('barreBas');if(!b)return;
  const marques={todo:(typeof tachesEnRetard==='function'?tachesEnRetard().length:0),
                 maison:maisonReclame().filter(x=>x.jours<=30).length};
  b.querySelectorAll('[data-sec]').forEach(el=>{
    el.querySelectorAll('.bb-pt,.bb-nb').forEach(x=>x.remove());
    const n=marques[el.dataset.sec]||0;
    if(!n)return;
    const p=document.createElement('span');
    p.className=n>1?'bb-nb':'bb-pt';
    if(n>1)p.textContent=n>9?'9+':n;
    el.appendChild(p);
  });
}
function setSection(s){
  if(!ONGLETS.includes(s))s='planning';
  section=s;
  document.querySelectorAll('#barreBas [data-sec]').forEach(b=>b.classList.toggle('actif',b.dataset.sec===s));

  const surCal=(s==='planning'&&vuePlanning==='mois');
  const layout=document.querySelector('.main-layout');
  layout.classList.toggle('mode-todo',s==='todo');
  layout.classList.toggle('mode-cal',surCal);
  document.querySelector('.cal-area').style.display=surCal?'':'none';
  document.getElementById('todoPanel').style.display=(s==='todo'||surCal)?'block':'none';
  document.getElementById('vueCourses').style.display=(s==='planning'&&vuePlanning!=='mois')?'block':'none';
  document.getElementById('vueMemoire').style.display=s==='memoire'?'block':'none';
  document.getElementById('vueSante').style.display=s==='sante'?'block':'none';
  document.getElementById('vueMaison').style.display=s==='maison'?'block':'none';
  document.getElementById('vueAccueil').style.display='none';
  document.getElementById('navBar').style.visibility=surCal?'visible':'hidden';
  document.getElementById('navOutils').style.visibility=surCal?'visible':'hidden';
  document.querySelector('.fab').style.display=(s==='maison')?'none':'';
  /* Les sous-vues vivent toutes ici, au-dessus des conteneurs. Avant, il y
     avait trois traitements : Planning au-dessus, To do et Maison à
     l'intérieur de leur panneau, Mémoire dans un composant différent posé
     sous le titre de la carte. Trois réponses à la même question. */
  const bv=document.getElementById('barreVues');
  const SOUS_VUES={
    planning:{defs:()=>[['jour','Ma journée'],['mois','Mois'],['repas','🍽️ Repas']],
              val:()=>vuePlanning,poser:setVuePlanning},
    todo:{defs:()=>[['taches','✅ À faire'],
                    ['courses','🛒 Courses',CACHE.courses.filter(c=>!c.achete_le&&!c.coche).length]],
          val:()=>vueTodo,poser:setVueTodo},
    memoire:{defs:()=>[['gens','🧑 Les gens'],['envies','✨ Les envies'],
                       ['cadeaux','🎁 Les cadeaux'],['recettes','📖 Recettes']],
             val:()=>ongletMem,poser:setOngletMem},
    maison:{defs:()=>[['entretien','🔧 Entretien'],
                      ['abonnements','💳 Abonnements',maisonReclame().length||'']],
            val:()=>vueMaison,poser:setVueMaison},
  };
  const sv=SOUS_VUES[s];
  if(sv){
    bv.innerHTML=barreVues(sv.defs(),sv.val(),s)+'<div id="navPeriode"></div>';
    brancherVues(bv,sv.poser);
  }else{bv.innerHTML=''}
  majNavPeriode();
  majCloche();
  majBarreBas();
  render();
}
function navMois(dir){
  if(vue==='semaine')cur.setDate(cur.getDate()+dir*7);
  else cur.setMonth(cur.getMonth()+dir);
  render();
}
function allerAujourdhui(){cur=new Date();render()}
function setVue(v){
  vue=v;
  document.getElementById('navOutils').style.visibility=(v==='annee')?'hidden':'visible';
  document.getElementById('monthView').style.display=v==='mois'?'block':'none';
  document.getElementById('weekView').style.display=v==='semaine'?'block':'none';
  document.getElementById('agendaView').style.display=v==='agenda'?'flex':'none';
  document.getElementById('yearLayout').style.display=v==='annee'?'flex':'none';
  document.getElementById('yearView').style.display=v==='annee'?'block':'none';
  document.getElementById('yearSidebar').style.display=v==='annee'?'block':'none';
  document.getElementById('todoPanel').style.display=v==='annee'?'none':'block';
  render();
}
function render(){
  if(typeof montrerPriseSiBesoin==='function')montrerPriseSiBesoin();
  if(section==='memoire'){renderMemoire();return}
  if(section==='sante'){renderSante();return}
  if(section==='maison'){renderMaison();return}
  if(section==='todo'){projetOuvert?renderProjet():renderTodo();return}
  // ---- Planning ----
  if(vuePlanning==='mois'){
    if(vue==='annee')renderAnnee();else renderMois();
    renderTodo();
    return;
  }
  if(vuePlanning==='repas'){renderRepas(document.getElementById('vueCourses'));return}
  renderAujourdhui();
}

/* ☀️ Aujourd'hui — la chronologie du jour, en pleine page.
   Même corps que le tiroir : on n'entretient qu'une seule version. */
function renderAujourdhui(){
  const zone=document.getElementById('vueCourses');
  const auj=deIso(jourVu);
  // Le contexte (férié, vacances) est déjà écrit par corpsJournee : le
  // répéter ici donnait deux lignes presque identiques l'une sous l'autre.
  const rec=maisonReclame().filter(x=>x.jours<=30);
  let bas='';
  if(rec.length){
    bas=`<div class="tj-sect" style="color:var(--alert)">🏠 La maison réclame<span class="tj-n">${rec.length}</span></div>`
      +rec.map(x=>`<div class="todo-item" data-recl="${x.genre}|${x.id}" style="cursor:pointer">
        <div style="flex-shrink:0;font-size:1.1rem">${x.emoji}</div>
        <div class="todo-corps"><div class="todo-text">${echap(x.nom)}</div>
        <div class="todo-date"><span style="color:var(--alert);font-weight:700">${echap(delaiFr(x.jours))}</span>${x.montant?' · '+euros(x.montant)+'/mois':''}</div></div>
        <div style="color:var(--ink-3)">›</div></div>`).join('');
  }
  // La date est déjà écrite dans la barre de période, juste au-dessus.
  zone.innerHTML=`<h2 class="ps-titre">${jourVu===iso(new Date())?'Ma journée':'Cette journée'}</h2>`
    +corpsJournee(auj,true)+bas;
  brancherJournee2(zone,auj,()=>{render()});
  zone.querySelectorAll('[data-recl]').forEach(el=>{
    el.onclick=()=>{const [g,id]=el.dataset.recl.split('|');
      maisonOuvert={genre:g,id};setSection('maison')};
  });
}


/* ================== POPOVER (sélecteur de mois) ================== */
function fermerPopovers(){
  document.getElementById('popMois').classList.remove('ouvert');
}
function togglePopover(pop,ancre){
  const dejaOuvert=pop.classList.contains('ouvert');
  fermerPopovers();
  if(dejaOuvert)return;
  const r=ancre.getBoundingClientRect();
  pop.classList.add('ouvert');
  const largeur=pop.offsetWidth;
  let gauche=r.left+r.width/2-largeur/2;
  gauche=Math.max(8,Math.min(gauche,window.innerWidth-largeur-8));
  pop.style.left=gauche+'px';
  pop.style.top=(r.bottom+8)+'px';
}
document.getElementById('navTitleBtn').onclick=(e)=>{
  e.stopPropagation();
  renderPopMois();
  togglePopover(document.getElementById('popMois'),document.getElementById('navTitleBtn'));
};
document.addEventListener('click',(e)=>{
  if(!e.target.closest('.popover')&&!e.target.closest('#navTitleBtn'))fermerPopovers();
});

/* ================== INIT ================== */
document.querySelectorAll('#barreBas [data-sec]').forEach(b=>{b.onclick=()=>setSection(b.dataset.sec)});
document.querySelectorAll('#modesBar [data-mode]').forEach(b=>{b.onclick=()=>setMode(b.dataset.mode)});
document.getElementById('mg-envoyer').onclick=mgEnvoyer;
document.getElementById('mg-coller').onclick=()=>collerDansChat(document.getElementById('mg-texte'));
document.getElementById('mg-texte').addEventListener('keydown',e=>{if(e.key==='Enter')mgEnvoyer()});
document.getElementById('titreAccueil').onclick=()=>{vuePlanning='jour';setSection('planning')};
document.getElementById('btnParams').onclick=formParams;
document.body.classList.add('a-barre');
document.addEventListener('keydown',e=>{if(e.key==='Escape'){fermerTiroir();fermerPopovers()}});
let _rT=null;
window.addEventListener('resize',()=>{clearTimeout(_rT);_rT=setTimeout(()=>{majHautChat();render()},200)});
// Recharge les données quand on revient sur l'onglet (si >60 s)
let derniereSync=Date.now();
document.addEventListener('visibilitychange',async()=>{
  if(document.visibilityState==='visible'&&Date.now()-derniereSync>60000){
    derniereSync=Date.now();
    if(await chargerTout())render();
  }
});
// Démarrage : connexion obligatoire, puis chargement des données
(async()=>{
  const s=await getSessionEtRole();
  if(!s.session||!s.role){window.location.replace('index.html');return}
  UTILISATEUR=s.nom||s.session.user.email;
  EMAIL_CONNECTE=(s.session.user.email||'').toLowerCase();
  await chargerReglages();
  if(await chargerTout()){setVue('mois');setSection('planning');majHautChat();montrerPriseSiBesoin()}
})();
