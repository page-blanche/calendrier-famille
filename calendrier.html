<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Calendrier Famille</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#fafaf9">
<link rel="icon" href="icon-192.png?v=2">
<link rel="apple-touch-icon" href="icon-192.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Famille">

<link rel="stylesheet" href="style.css">
<style>
/* Vue semaine v2 : blocs proportionnels à la durée */
.wk2-entetes{display:grid;grid-template-columns:55px repeat(7,1fr);gap:1px;margin-bottom:1px}
.wk2-h{background:#f2f1ee;text-align:center;padding:8px 2px;font-size:.74rem;font-weight:700;border-radius:4px}
.wk2-h.auj{background:var(--ink);color:#fff}
.wk2-corps{display:grid;grid-template-columns:55px repeat(7,1fr);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.wk2-heures div{font-size:.62rem;color:var(--ink-3);font-weight:600;text-align:right;padding-right:6px;box-sizing:border-box}
.wk2-col{position:relative;border-left:1px solid #f1efe9;cursor:pointer}
.wk2-col:hover{background:#fdfcfa}
.wk2-ligne{position:absolute;left:0;right:0;border-top:1px solid #f4f3f0;pointer-events:none}
.wk2-ev{position:absolute;border-radius:6px;color:#fff;font-size:.6rem;font-weight:600;padding:2px 5px;overflow:hidden;line-height:1.3;box-shadow:0 1px 2px rgba(28,27,24,.18);box-sizing:border-box}
.wk2-ev .wk2-hr{opacity:.8;font-weight:500;font-size:.55rem}
/* Pages To-do / Courses / Cadeaux */
.page-solo{flex:1;max-width:620px;margin:0 auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px 26px}
.mem-note{border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin-bottom:10px;background:var(--surface)}
.mem-encart{border:1px solid #f3e5c8;border-radius:12px;padding:10px 14px;margin-top:10px;background:#fdf8ef}
.mem-note-tete{display:flex;gap:10px;align-items:center;font-size:.76rem;color:var(--ink-3);margin-bottom:5px}
.mem-note-texte{font-size:.92rem;line-height:1.45;white-space:normal}
.mem-partage{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:.86rem;cursor:pointer;text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink)}
.mem-partage input{width:auto}
.journee{grid-column:1/-1;background:linear-gradient(135deg,#fdf6e3,#f6ecfe);border:1.5px solid #e7d9f5;border-radius:18px;padding:12px 15px;box-shadow:0 3px 10px rgba(120,80,180,.08)}
.jr-haut{cursor:pointer}
.jr-chev{font-size:.7rem;color:var(--ink-3);margin-left:2px}
.jr-plus{font-size:.73rem;font-weight:600;color:var(--ink-2);padding:7px 0 2px;cursor:pointer}
.jr-tete{display:flex;align-items:baseline;gap:8px}
.jr-t{font-weight:800;font-size:1.02rem;letter-spacing:-.02em}
.jr-d{font-size:.72rem;color:var(--ink-2);margin-left:auto}
.jr-sous{font-size:.76rem;color:var(--ink-2);margin-top:2px}
.jr-sect{font-size:.62rem;font-weight:800;letter-spacing:.06em;color:var(--ink-3);text-transform:uppercase;margin:9px 0 0}
.jr-li{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-top:1px solid rgba(28,27,24,.07);cursor:pointer}
.jr-li:hover{opacity:.75}
.jr-ic{flex-shrink:0;font-size:.95rem;width:20px;text-align:center}
.jr-co{flex:1;min-width:0}
.jr-ti{font-size:.87rem;font-weight:600;line-height:1.35}
.jr-de{font-size:.71rem;color:var(--ink-2);margin-top:1px}
.jr-fl{color:var(--ink-3);font-size:.85rem;align-self:center}
.jr-cb{width:19px;height:19px;border:2px solid var(--ink-3);border-radius:6px;flex-shrink:0;margin-top:2px;cursor:pointer}
.jr-cb.on{background:var(--vert,#2f9e44);border-color:var(--vert,#2f9e44);position:relative}
.jr-cb.on::after{content:'✓';color:#fff;font-size:.68rem;position:absolute;top:-2px;left:2.5px;font-weight:800}
.jr-faite .jr-ti{text-decoration:line-through;opacity:.45}
.jr-aussi{font-size:.72rem;color:var(--ink-2);margin-top:8px;padding-top:7px;border-top:1px solid rgba(28,27,24,.07);cursor:pointer}
.jr-retard{background:#fdecea;border:1px solid #f5b8ae;border-radius:11px;padding:6px 10px;font-size:.74rem;color:#8e2f22;margin-top:8px;cursor:pointer}
.jr-plier{text-align:center;font-size:.7rem;font-weight:700;color:var(--ink-3);padding:7px 0 0;margin-top:4px;border-top:1px solid rgba(28,27,24,.07);cursor:pointer}
.journee.compacte{cursor:pointer;padding:11px 14px}
.jc-h{display:flex;align-items:baseline;gap:7px;font-size:.72rem;color:var(--ink-2)}
.jc-h b{font-size:.95rem;color:var(--ink);font-weight:800;letter-spacing:-.02em}
.jc-d{margin-left:auto}
.jc-next{display:flex;gap:9px;align-items:baseline;margin-top:7px}
.jc-heure{font-weight:800;font-size:.82rem;color:var(--event);white-space:nowrap}
.jc-ti{font-size:.88rem;font-weight:600;line-height:1.3;flex:1;min-width:0}
.jc-bas{display:flex;gap:8px;align-items:center;margin-top:9px;padding-top:8px;border-top:1px solid rgba(28,27,24,.08);font-size:.73rem;color:var(--ink-2);
  white-space:nowrap;overflow:hidden}
.jc-bas>span:first-child,.jc-bas{min-width:0}
.jc-lien{margin-left:auto;font-weight:700;color:var(--ink-2);white-space:nowrap}
.jc-retard{background:#fdecea;color:#8e2f22;border:1px solid #f5b8ae;border-radius:999px;padding:1px 8px;font-size:.68rem;font-weight:700;white-space:nowrap}
.magie{grid-column:1/-1;background:linear-gradient(135deg,#fdf6e3,#f6ecfe);border:1.5px solid #e7d9f5;border-radius:18px;padding:12px 14px;box-shadow:0 3px 10px rgba(120,80,180,.08)}
.magie-titre{font-size:.7rem;font-weight:800;letter-spacing:.06em;color:#8a5fc0;margin-bottom:8px;text-transform:uppercase}
.magie-aide{font-size:.72rem;color:var(--ink-3);margin-top:7px}
.mg-prop{display:flex;gap:10px;align-items:flex-start;border:1.5px solid #b7dfc2;background:#f4fbf6;border-radius:14px;padding:10px 12px;margin-bottom:8px}
.mg-prop input[type=checkbox]{width:auto;margin-top:4px}
.mg-type{font-size:.64rem;font-weight:800;color:var(--ink-3);letter-spacing:.05em}
.mg-titre{font-weight:600;font-size:.9rem;margin-top:1px}
#mg-fil{display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.mg-b{max-width:86%;border-radius:16px;padding:9px 13px;font-size:.88rem;line-height:1.45}
.mg-ia{align-self:flex-start;background:linear-gradient(135deg,#fdf6e3,#f6ecfe);border:1.5px solid #e7d9f5;border-bottom-left-radius:6px}
.mg-moi{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:6px}
.mg-pense{align-self:flex-start;color:var(--ink-3);font-size:.8rem;padding:2px 6px}
.mg-chips{display:flex;flex-wrap:wrap;gap:6px;align-self:flex-start;max-width:95%}
.mg-chip{border:1.5px solid var(--ink);border-radius:99px;padding:7px 14px;font-size:.82rem;font-weight:700;background:var(--surface);color:var(--ink);cursor:pointer;font-family:inherit}
.mg-chip.actif{background:var(--ink);color:#fff}
.mg-chip:active{background:var(--ink);color:#fff}
.mg-cartes{align-self:stretch;background:#f4fbf6;border:1.5px solid #b7dfc2;border-radius:16px;padding:10px 12px}
.mg-cartes-titre{font-size:.74rem;font-weight:800;color:var(--ink-2);margin-bottom:8px}
.mg-cartes.mg-fige{opacity:.55}
.mg-prop-btns{display:flex;gap:6px;margin-top:8px}
.mg-prop-btns .btn.mini{padding:7px 12px;font-size:.74rem}
.cloche{position:fixed;bottom:18px;right:16px;z-index:40;display:none;align-items:center;gap:5px;
  background:rgba(255,255,255,.92);border:1px solid var(--border);border-radius:99px;
  padding:6px 12px;font-size:.7rem;font-weight:600;color:var(--ink-2);font-family:inherit;cursor:pointer;
  box-shadow:0 2px 8px rgba(28,27,24,.08)}
.acc-carte.bientot{opacity:.55;cursor:default}
.acc-carte.bientot:hover{transform:none;box-shadow:none;border-color:var(--border)}
.badge-bientot{font-size:.6rem;font-weight:800;letter-spacing:.05em;color:var(--ink-3);background:#f2f1ee;border-radius:99px;padding:2px 8px;margin-left:6px;text-transform:uppercase}
.ps-titre{font-size:1.25rem;letter-spacing:-.02em;margin:2px 0 4px}
.discret2{color:var(--ink-2);font-size:.85rem;margin-bottom:12px}
.ps-ajout{display:flex;gap:8px;margin:12px 0 18px}
.ps-ajout input{flex:1}
.carte-solo{border:1px solid var(--border);border-radius:var(--radius-s);padding:14px 16px;margin:12px 0 20px;background:#fdfcfa}
.main-layout.mode-todo .todo-panel{width:100%;max-width:620px;margin:0 auto;position:static;max-height:none}
@media(max-width:820px){#mainNav .view-btn{padding:5px 8px;font-size:.76rem}}
.pill-cont{height:5px;border-radius:3px;margin:3px 0;opacity:.45}
.day-cell.sel{border-color:var(--ink);box-shadow:var(--shadow)}
@media(max-width:700px){
  .main-layout.mode-cal .todo-panel{display:none!important}
  #viewBar [data-vue="semaine"]{display:none}
}
@media(max-width:1000px){.year-sidebar{max-height:none;overflow:visible}}
@media(max-width:1230px){.h-centre{order:3;flex:0 0 100%;justify-content:center}}
/* ---------- 🩺 Santé ---------- */
.mem-groupe{font-size:.63rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);margin:16px 0 6px}
.mem-groupe:first-of-type{margin-top:6px}
.mg-n{margin-left:6px;font-weight:700;color:var(--ink-3);opacity:.75}
/* Qui emmène : bleu = comme d'habitude, ambre = exception, pointillé = personne */
.acc{border:1.3px solid #cbd9e8;background:#f2f7fc;color:#1c5d99;border-radius:99px;
  padding:2px 9px;font-size:.72rem;font-weight:650;cursor:pointer;white-space:nowrap;
  font-family:inherit;line-height:1.5;display:inline-block;margin-top:3px}
.acc.exception{border-color:#f0d9a8;background:#fdf6e6;color:#8a6d10}
.acc.vide{border-style:dashed;border-color:var(--border);background:transparent;color:var(--ink-3)}
.acc:active{opacity:.6}
.st-h-tete{font-size:.73rem;font-weight:800;color:var(--ink-2);margin:12px 0 6px}
.st-h{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.st-h span{flex:1;font-size:.88rem}
.st-h input{width:120px}
/* Un médicament en retard barre la route : ce n'est pas une pastille de plus */
.prise-plein{position:fixed;inset:0;z-index:9000;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:28px 24px;text-align:center;overflow-y:auto}
.pp-pil{font-size:3.2rem;line-height:1;margin-bottom:14px}
.pp-titre{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;line-height:1.2;margin-bottom:6px}
.pp-quand{font-size:1rem;color:var(--ink-2);margin-bottom:2px}
.pp-retard{font-size:.85rem;font-weight:700;color:var(--alert);margin-top:8px}
.pp-btns{display:flex;flex-direction:column;gap:10px;width:100%;max-width:330px;margin-top:26px}
.pp-btns .btn{width:100%;padding:15px;font-size:1rem}
.pp-reste{font-size:.78rem;color:var(--ink-3);margin-top:18px}
.td-ong{display:flex;background:var(--surface-2,#f2f0ec);border-radius:99px;padding:3px;margin-bottom:14px;gap:2px}
.td-ong button{flex:1;border:none;background:none;font:inherit;font-size:.85rem;font-weight:700;
  padding:7px 4px;border-radius:99px;color:var(--ink-3);cursor:pointer}
.td-ong button.on{background:var(--surface,#fff);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.td-ong .n{font-weight:800;opacity:.55;margin-left:3px;font-size:.78rem}
.td-sect{font-size:.62rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);
  margin:18px 0 4px;display:flex;align-items:center;gap:7px}
.td-sect:first-of-type{margin-top:2px}
.td-sect.rouge{color:var(--alert)}
.td-sect .n{margin-left:auto;font-weight:700;opacity:.8}
.td-tard{color:var(--alert);font-weight:700}
.td-prendre{border:1.3px dashed var(--border);border-radius:99px;padding:3px 10px;font-size:.72rem;
  font-weight:700;color:var(--ink-3);background:none;font-family:inherit;cursor:pointer;flex-shrink:0;
  align-self:flex-start;margin-top:1px}
.td-prendre:active{background:var(--ink);color:#fff;border-style:solid}
.td-plier{font-size:.62rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);
  margin:18px 0 2px;cursor:pointer;user-select:none}
.pj-l{display:flex;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--border);cursor:pointer}
.td-sect + .pj-l{border-top:none}
.pj-l:active{opacity:.65}
.pj-l .ic{font-size:1.2rem;flex-shrink:0}
.pj-l .co{flex:1;min-width:0}
.pj-l .tx{font-weight:700;font-size:.92rem}
.pj-l .barre{height:4px;background:var(--border);border-radius:99px;margin-top:5px;overflow:hidden}
.pj-l .barre i{display:block;height:100%;background:var(--ink-3);border-radius:99px;transition:width .2s}
.pj-l .su{font-size:.73rem;color:var(--ink-3);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pj-l .ch{color:var(--ink-3);font-size:.8rem;flex-shrink:0}
.pj-tete{display:flex;align-items:center;gap:11px;margin:4px 0 10px}
.pj-tete .ic{font-size:1.6rem}
.pj-tete .nom{font-size:1.28rem;font-weight:800;line-height:1.15}
.pj-tete .sous{font-size:.79rem;color:var(--ink-3)}
.rp-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 12px}
.rp-nav span{font-weight:700;font-size:.9rem}
.rp-j{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--border);cursor:pointer}
.rp-j:first-of-type{border-top:none}
.rp-j:active{opacity:.65}
.rp-j.passe{opacity:.5}
.rp-j.auj .rp-d b{color:var(--alert)}
.rp-d{width:52px;flex-shrink:0;display:flex;flex-direction:column;line-height:1.15}
.rp-d b{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3)}
.rp-d span{font-size:1.05rem;font-weight:700}
.rp-q{flex:1;font-size:.95rem;min-width:0;overflow:hidden;text-overflow:ellipsis}
.rp-q.vide{color:var(--ink-3);font-style:italic}
.rp-ch{color:var(--ink-3)}
.fp-echo{font-size:.78rem;color:var(--ink-2);margin:7px 0 2px;padding-left:2px}
.fp-echo b{color:var(--ink)}
.fp-changer{background:none;border:none;padding:0;font:inherit;font-size:.76rem;
  color:var(--ink-3);text-decoration:underline;cursor:pointer}
.pf-ligne{display:flex;align-items:center;gap:9px;padding:8px 0;border-top:1px solid var(--border)}
.pf-ligne:first-child{border-top:none}
.pf-ligne .n{font-weight:650;font-size:.9rem}
.pf-ligne .r{margin-left:auto;font-size:.71rem;color:var(--ink-3)}
.pf-seg{margin-left:auto;display:flex;border:1.3px solid var(--border);border-radius:99px;overflow:hidden;flex-shrink:0}
.pf-seg span{font-size:.68rem;font-weight:700;padding:3px 9px;color:var(--ink-3);cursor:pointer}
.pf-seg span.on{background:var(--ink);color:#fff}
.mem-plier{font-size:.63rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);margin:16px 0 6px;cursor:pointer;user-select:none}
.mem-plier:active{color:var(--ink)}
/* --- Dire qui est qui --- */
.qq-carte{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:9px 12px;margin-bottom:7px;box-shadow:var(--shadow)}
.qq-nom{font-weight:700;font-size:.95rem;display:flex;align-items:center;gap:8px}
.qq-ind{font-size:.76rem;color:var(--ink-3);margin-top:1px}
.qq-libre{width:100%;margin-top:8px}
.qq-barre{position:sticky;bottom:0;background:var(--bg);padding:10px 0 4px;
  border-top:1px solid var(--border);display:flex;gap:8px;align-items:center}
/* --- La page d'une personne --- */
.pp-tete{display:flex;align-items:center;gap:12px;margin:4px 0 2px}
.pp-av{width:46px;height:46px;border-radius:999px;display:flex;align-items:center;justify-content:center;
  font-size:1.4rem;background:var(--surface-2,#f1efe9);flex-shrink:0}
.pp-nom{font-size:1.28rem;font-weight:800;line-height:1.15}
.pp-sous{font-size:.8rem;color:var(--ink-3);margin-top:1px}
.pp-faits{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}
.pp-fait{border:1px solid var(--border);border-radius:99px;padding:5px 11px;font-size:.78rem;
  background:var(--surface);color:var(--ink-2,var(--ink))}
.pp-fait.vide{border-style:dashed;color:var(--ink-3);cursor:pointer}
.pp-dit{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:11px 13px;margin-bottom:8px;box-shadow:var(--shadow)}
.pp-dit-txt{font-size:.93rem;line-height:1.45}
.pp-dit-bas{display:flex;align-items:center;gap:8px;margin-top:6px}
.pp-quand{font-size:.7rem;color:var(--ink-3)}
.pp-pied{margin-top:22px;display:flex;flex-direction:column;gap:8px}
.sa-tete{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.sa-fiche{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:12px 14px;
  margin-bottom:9px;box-shadow:var(--shadow);cursor:pointer;display:flex;align-items:center;gap:12px}
.sa-fiche:hover{border-color:var(--border-strong)}
.sa-av{width:38px;height:38px;border-radius:999px;display:flex;align-items:center;justify-content:center;
  font-size:1.25rem;flex-shrink:0;background:#f2f0ec}
.sa-nom{font-weight:800;font-size:.95rem;letter-spacing:-.02em}
.sa-etat{font-size:.75rem;color:var(--ink-2);margin-top:1px;line-height:1.35}
.sa-badge{margin-left:auto;flex-shrink:0;font-size:.68rem;font-weight:800;border-radius:999px;padding:3px 9px;white-space:nowrap}
.sa-ok{background:#e6f4ea;color:#1e7b34}
.sa-warn{background:#fdf2e0;color:#9a5b00}
.sa-late{background:#fdecea;color:#b02a1c}
.sa-bloc{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:12px 14px;
  margin-bottom:10px;box-shadow:var(--shadow)}
.sa-bloc.alerte{border-color:#f5c6bd;background:#fffafa}
.sa-bt{font-weight:800;font-size:.88rem;display:flex;align-items:center;gap:7px;margin-bottom:3px}
.sa-bt .n{margin-left:auto;font-size:.7rem;font-weight:700;color:var(--ink-3)}
.sa-s{font-size:.76rem;color:var(--ink-2);line-height:1.45}
.sa-doses{display:flex;gap:6px;margin-top:9px}
.sa-dose{flex:1;text-align:center;border-radius:11px;padding:7px 2px;font-size:.7rem;
  border:1.5px dashed var(--border);cursor:pointer;background:var(--surface)}
.sa-dose b{display:block;font-size:.72rem;margin-top:2px;color:var(--ink-3);font-weight:700}
.sa-dose.on{background:#e6f4ea;border:1.5px solid #b7dfc2}
.sa-dose.on b{color:#1e7b34}
.sa-barre{height:6px;background:#eceae5;border-radius:99px;margin-top:8px;overflow:hidden}
.sa-barre div{height:100%;background:var(--ink);border-radius:99px}
.sa-l{display:flex;gap:10px;align-items:center;padding:7px 0;border-top:1px solid #f2f0ec;font-size:.83rem}
.sa-bt + .sa-l{border-top:none}
.sa-l .cb{width:17px;height:17px;border:1.7px solid var(--ink-3);border-radius:5px;flex-shrink:0}
.sa-l .cb.on{background:#2f9e44;border-color:#2f9e44;position:relative}
.sa-l .cb.on::after{content:'✓';color:#fff;font-size:.62rem;font-weight:800;position:absolute;left:3px;top:-3px}
.sa-l .txt{flex:1;min-width:0}
.sa-l .quand{font-size:.72rem;color:var(--ink-3);flex-shrink:0}
.sa-l.retard .txt{color:#b02a1c;font-weight:650}

.av-ti{font-size:.87rem;font-weight:600;line-height:1.3}

.av-rout .av-rail{align-self:stretch;min-height:18px}
.av-rout .av-rail::before{background:repeating-linear-gradient(to bottom,#e2ded7 0 3px,transparent 3px 7px)}
.av-rout .lb{font-size:.74rem;color:var(--ink-3)}

.av-vide{text-align:center;color:var(--ink-3);padding:40px 10px;font-size:.9rem}
/* Le mois sur mobile : un emoji vaut mieux qu'un point de couleur */

/* --- les tuiles : une icône, un mot --- */

</style>
</head>

/* ================== CONSTANTES ================== */

const DFR=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];

'2026-01-01':'Jour de l\'An','2026-04-06':'Lundi de Pâques','2026-05-01':'Fête du Travail',

/* ================== DONNÉES : CACHE + SUPABASE ==================
   Toutes les données vivent dans Supabase. On les charge en mémoire,
   chaque modification est appliquée immédiatement à l'écran puis
   envoyée à la base (avec rechargement en cas d'erreur). */
let CACHE={evts:[],vac:[],bdays:[],acts:[],taches:[],courses:[],cadeaux:[],personnes:[],notes:[],envies:[],membres:[],etatsAuto:{},
  medecins:[],traitements:[],prises:[],suivis:[],accomp:[],projets:[],recettes:[],menus:[],
  entretiens:[],abonnements:[],tgliens:[]};
const TABLES={evts:'evenements',vac:'vacances',bdays:'anniversaires',acts:'activites',taches:'taches',courses:'courses',cadeaux:'cadeaux',personnes:'personnes',notes:'notes_personnes',envies:'envies',
  medecins:'sante_medecins',traitements:'sante_traitements',prises:'sante_prises',suivis:'sante_suivis',
  accomp:'accompagnements',projets:'projets',recettes:'recettes',menus:'menus',
  entretiens:'entretiens',abonnements:'abonnements',tgliens:'telegram_liens'};

async function chargerTout(){
  const [e,v,b,a,t,s,co,ca,pe,no,en,us,pr,tr,pri,su,ac,pj,re,me,ent,abo,tgl]=await Promise.all([
    sb.from('evenements').select('*'),
    sb.from('vacances').select('*'),
    sb.from('anniversaires').select('*'),
    sb.from('activites').select('*'),
    sb.from('taches').select('*'),
    sb.from('etats_auto').select('*'),
    sb.from('courses').select('*'),
    sb.from('cadeaux').select('*'),
    sb.from('personnes').select('*'),
    sb.from('notes_personnes').select('*'),
    sb.from('envies').select('*'),
    sb.from('app_users').select('nom,email'),
    sb.from('sante_medecins').select('*'),
    sb.from('sante_traitements').select('*'),
    sb.from('sante_prises').select('*'),
    sb.from('sante_suivis').select('*'),
    sb.from('accompagnements').select('*'),
    sb.from('projets').select('*'),
    sb.from('recettes').select('*'),
    sb.from('menus').select('*'),
    sb.from('entretiens').select('*'),
    sb.from('abonnements').select('*'),
    sb.from('telegram_liens').select('*'),
  ]);
  const err=[e,v,b,a,t,s].find(r=>r.error);
  if(err){toast('⚠️ Erreur de chargement : '+err.error.message);return false}
  CACHE.evts=e.data;CACHE.vac=v.data;CACHE.bdays=b.data;
  CACHE.acts=a.data;CACHE.taches=t.data;
  CACHE.etatsAuto={};
  s.data.forEach(x=>CACHE.etatsAuto[x.id]=x);
  CACHE.courses=co.error?[]:co.data;
  CACHE.cadeaux=ca.error?[]:ca.data;
  CACHE.personnes=pe.error?[]:pe.data;
  CACHE.notes=no.error?[]:no.data;
  CACHE.envies=en.error?[]:en.data;
  const comptes=us.error?[]:us.data.map(x=>x.nom).filter(Boolean);
  // On garde aussi les adresses : sans elles, inviter quelqu'un obligeait à
  // taper son e-mail de mémoire dans une boîte de dialogue.
  CACHE.utilisateurs=us.error?[]:us.data;
  // Le foyer, c'est le registre. Tant qu'il est vide (avant migration), on
  // retombe sur les comptes pour ne rien casser.
  CACHE.comptes=comptes;
  recalculerMembres();
  // La Santé : si la migration n'a pas encore été passée, on continue sans planter
  CACHE.medecins=pr.error?[]:pr.data;
  CACHE.traitements=tr.error?[]:tr.data;
  CACHE.prises=pri.error?[]:pri.data;
  CACHE.suivis=su.error?[]:su.data;
  CACHE.accomp=ac.error?[]:ac.data;
  CACHE.projets=pj.error?[]:pj.data;
  CACHE.recettes=re.error?[]:re.data;
  CACHE.menus=me.error?[]:me.data;
  CACHE.entretiens=ent.error?[]:ent.data;
  CACHE.abonnements=abo.error?[]:abo.data;
  CACHE.tgliens=tgl.error?[]:tgl.data;
  return true;
}

const lesVacances=()=>CACHE.vac;
/* Les anniversaires ne sont plus une liste à part : ce sont les personnes
   du registre qui ont une date. La table « anniversaires » ne garde que ce
   qui n'est pas quelqu'un (l'anniversaire de mariage). */
function lesBdays(){
  const gens=CACHE.personnes.filter(p=>p.naiss_jour&&p.naiss_mois).map(p=>({
    id:p.id,nom:p.nom,jour:p.naiss_jour,mois:p.naiss_mois,annee:p.naiss_annee||null,
    cadeau:!!p.cadeau,type:'anniversaire',detail:p.detail||null,icone:p.emoji||null,
    estPersonne:true}));
  return gens.concat(CACHE.bdays||[]);
}
const estUnePersonne=(id)=>CACHE.personnes.some(p=>p.id===id);
const lesActs=()=>CACHE.acts;
const lesTaches=()=>CACHE.taches;

function genId(){return 'u-'+Date.now().toString(36)+'-'+Math.floor(Math.random()*46656).toString(36)}
function nettoyer(o){const r={};for(const k in o){if(k==='annuleeCeJour'||k==='auto')continue;r[k]=o[k]===''?null:o[k]}return r}
function pousser(promesse){
  promesse.then(({error})=>{
    if(error){toast('⚠️ Non enregistré : '+error.message);chargerTout().then(()=>render())}
  });
}

function estFaite(id){
  if(id.startsWith('auto-'))return !!(CACHE.etatsAuto[id]&&CACHE.etatsAuto[id].faite);
  const t=CACHE.taches.find(x=>x.id===id);
  return !!(t&&t.faite);
}
function basculerFaite(id){
  if(id.startsWith('auto-')){
    const e=CACHE.etatsAuto[id]||{id,faite:false,supprimee:false};
    e.faite=!e.faite;CACHE.etatsAuto[id]=e;
    pousser(sb.from('etats_auto').upsert(e));
  }else{
    const t=CACHE.taches.find(x=>x.id===id);
    if(!t)return;
    t.faite=!t.faite;
    // Qui a coché : c'est ce qui permet d'écrire « Didier vient de réserver
    // le poney ». Sans ça la base sait que c'est fait, jamais par qui.
    t.faite_par=t.faite?EMAIL_CONNECTE:null;
    pousser(sb.from('taches').update({faite:t.faite,faite_par:t.faite_par}).eq('id',id));
  }
}
function enregistrerObjet(id,coll,donnees){
  // Modifier une action auto (souhaiter, valises…) → on la transforme en vraie tâche
  if(id&&id.startsWith('auto-')){
    const t=trouverParId(id)||{};
    const copie={id:genId(),ajoute_par:(typeof UTILISATEUR!=='undefined'&&UTILISATEUR)?UTILISATEUR:null,texte:t.texte||'',cat:t.cat||'other',dateTexte:t.dateTexte||null,
      qui:t.qui||null,y:t.y||null,m:t.m||null,ech:t.ech||null,lien:t.lien||null,
      persistante:false,faite:estFaite(id),...donnees};
    CACHE.taches.push(copie);
    pousser(sb.from('taches').insert(nettoyer(copie)));
    supprimerObjet(id);
    return;
  }
  if(id){
    const liste=CACHE[coll];
    const i=liste.findIndex(x=>x.id===id);
    if(i>=0)liste[i]={...liste[i],...donnees};
    pousser(sb.from(TABLES[coll]).update(nettoyer(donnees)).eq('id',id));
  }else{
    const obj={id:genId(),ajoute_par:(typeof UTILISATEUR!=='undefined'&&UTILISATEUR)?UTILISATEUR:null,...donnees};
    CACHE[coll].push(obj);
    pousser(sb.from(TABLES[coll]).insert(nettoyer(obj)));
  }
}
function supprimerObjet(id){
  if(id.startsWith('auto-')){
    const e=CACHE.etatsAuto[id]||{id,faite:false,supprimee:false};
    e.supprimee=true;CACHE.etatsAuto[id]=e;
    pousser(sb.from('etats_auto').upsert(e));
    return;
  }
  if(CACHE.personnes.some(x=>x.id===id)){
    // la base efface en cascade : on fait pareil côté écran
    CACHE.notes=CACHE.notes.filter(n=>n.personne_id!==id);
    CACHE.traitements=CACHE.traitements.filter(t=>t.personne_id!==id);
    CACHE.suivis=CACHE.suivis.filter(x=>x.personne_id!==id);
    CACHE.medecins=CACHE.medecins.filter(m=>m.personne_id!==id&&m.medecin_id!==id);
  }
  for(const coll of ['evts','vac','bdays','acts','taches','courses','cadeaux','notes','envies','personnes',
                     'medecins','traitements','prises','suivis','accomp','projets','recettes','menus']){
    const i=CACHE[coll].findIndex(x=>x.id===id);
    if(i>=0){
      CACHE[coll].splice(i,1);
      pousser(sb.from(TABLES[coll]).delete().eq('id',id));
      return;
    }
  }
}

/* ================== HELPERS DATES ================== */
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function deIso(s){return new Date(s+'T00:00:00')}
function jSem(d){return ((d.getDay()+6)%7)+1}
function minutes(h){if(!h)return -1;const m=String(h).match(/(\d{1,2})[:h](\d{2})/);return m?parseInt(m[1])*60+parseInt(m[2]):-1}
function echap(t){const d=document.createElement('div');d.textContent=t??'';return d.innerHTML}
function enVacances(d){const s=iso(d);return lesVacances().find(v=>s>=v.debut&&s<=v.fin)}
function ferie(d){return FER[iso(d)]}

/* ================== REQUÊTES PAR JOUR ================== */
function evtsDuJour(d){const s=iso(d);return lesEvts().filter(e=>s>=e.debut&&s<=(e.fin||e.debut))}
function bdaysDuJour(d){
  return lesBdays().filter(a=>a.jour===d.getDate()&&a.mois===d.getMonth()+1).map(a=>{
    const age=a.annee?d.getFullYear()-a.annee:null;
    const titre=(a.type==='evenement')
      ?`${a.icone||'💍'} ${a.nom}${age?' ('+age+' ans)':''}`
      :`🎂 Anniv ${a.nom}${age?' ('+age+' ans)':''}`;
    return {...a,titre};
  });
}
function actsDuJour(d){
  const js=jSem(d),s=iso(d);
  return lesActs()
    .filter(a=>a.jours.includes(js)&&!enVacances(d)&&(a.feriesAussi||!ferie(d)))
    .filter(a=>!(a.pauses||[]).some(p=>s>=p.debut&&s<=p.fin))
    .map(a=>(a.annulations||[]).includes(s)?{...a,annuleeCeJour:true}:a);
}
/* ================== ACTIONS GÉNÉRÉES AUTOMATIQUEMENT ================== */
const p2=(n)=>String(n).padStart(2,'0');
function tachesAuto(){
  const out=[];
  lesBdays().forEach(b=>{
    if(b.type==='evenement')return;
    // Les années étaient écrites en dur : en janvier 2028, plus aucun
    // anniversaire n'aurait été rappelé, sans le moindre message. On les
    // calcule maintenant autour d'aujourd'hui.
    const anCourant=new Date().getFullYear();
    [anCourant,anCourant+1].forEach(y=>{
      const ech=y+'-'+p2(b.mois)+'-'+p2(b.jour);
      const bas=iso(new Date(Date.now()-120*864e5));
      if(ech<bas||ech>(anCourant+1)+'-12-31')return;
      const age=b.annee?y-b.annee:null;
      out.push({id:'auto-souhait-'+b.id+'-'+y,auto:true,lien:b.id,cat:'family',
        texte:'🎂 Souhaiter l\'anniversaire de '+b.nom+(age?' ('+age+' ans)':''),
        dateTexte:'le '+b.jour+' '+MFR[b.mois-1].toLowerCase(),ech,y,m:b.mois});
      if(b.cadeau){
        const av=Number(REGLAGES.cadeau_avant_jours)||7;
        const d=deIso(ech);d.setDate(d.getDate()-av);
        out.push({id:'auto-cadeau-'+b.id+'-'+y,auto:true,lien:b.id,cat:'family',
          texte:'🎁 Acheter le cadeau de '+b.nom,
          dateTexte:av+' jours avant ('+d.getDate()+' '+MFR[d.getMonth()].toLowerCase()+')',
          ech:iso(d),y:d.getFullYear(),m:d.getMonth()+1});
      }
    });
  });
  lesEvts().forEach(e=>{
    if(e.cat!=='voyage'||!e.fin||e.fin===e.debut)return;
    const av=Number(REGLAGES.valises_avant_jours)||2;
    const d=deIso(e.debut);d.setDate(d.getDate()-av);
    out.push({id:'auto-valises-'+e.id,auto:true,lien:e.id,cat:'family',
      texte:'🧳 Préparer les valises — '+e.titre.replace(/^\S+\s/,''),
      dateTexte:av+' jour'+(av>1?'s':'')+' avant le départ',ech:iso(d),y:d.getFullYear(),m:d.getMonth()+1});
  });
  return out.filter(t=>!(CACHE.etatsAuto[t.id]&&CACHE.etatsAuto[t.id].supprimee));
}
function toutesTaches(){return lesTaches().concat(tachesAuto())}
function tachesLiees(idInfo){return toutesTaches().filter(t=>t.lien===idInfo)}
function trouverParId(id){
  return lesEvts().find(x=>x.id===id)||lesVacances().find(x=>x.id===id)||
         lesBdays().find(x=>x.id===id)||lesActs().find(x=>x.id===id)||toutesTaches().find(x=>x.id===id)||
         (CACHE.personnes||[]).find(x=>x.id===id)||
         /* Les courses, cadeaux et envies manquaient ici. Pia proposait
            légitimement de cocher un article — le cerveau reçoit les
            identifiants de la liste de courses — et l'app répondait
            « je n'ai pas retrouvé cet élément ». Sur Telegram ça marchait :
            l'asymétrie la plus visible au quotidien. */
         (CACHE.courses||[]).find(x=>x.id===id)||
         (CACHE.cadeaux||[]).find(x=>x.id===id)||
         (CACHE.envies||[]).find(x=>x.id===id);
}
/* Dans quelle liste vit cet identifiant ? Cocher n'écrit pas la même colonne
   selon l'endroit : `coche` pour une course, `offert` pour un cadeau,
   `faite` pour une envie ou une tâche. */
function collectionDe(id){
  if((CACHE.courses||[]).some(x=>x.id===id))return 'courses';
  if((CACHE.cadeaux||[]).some(x=>x.id===id))return 'cadeaux';
  if((CACHE.envies ||[]).some(x=>x.id===id))return 'envies';
  if(toutesTaches().some(x=>x.id===id))return 'taches';
  return null;
}

function partagePossible(){return typeof navigator!=='undefined'&&!!navigator.share}
async function partager(texte,titre){
  const t=String(texte||'').trim();
  if(!t)return false;
  if(navigator.share){
    try{await navigator.share({text:t,title:titre||'Famille'});return true}
    catch(e){if(String(e&&e.name)==='AbortError')return false}
  }
  // pas de feuille de partage (ordinateur) : on copie, c'est le mieux qu'on puisse faire
  try{await navigator.clipboard.writeText(t);toast('Copié — colle-le où tu veux ✔');return true}
  catch(e){toast('⚠️ Impossible de partager depuis cet appareil');return false}
}

function texteCourses(){
  const l=CACHE.courses.filter(c=>!c.achete_le&&!c.coche);
  if(!l.length)return '';
  // Partagée, la liste garde ses deux tas et ses urgences : sinon celui qui
  // la reçoit ne sait pas ce qui presse ni où ça s'achète.
  const ligne=g=>'· '+(g.urgent?'⚡ ':'')+g.texte
    +(g.items[0]&&g.items[0].magasin?' — '+g.items[0].magasin:'');
  const sup=grouperCourses(l.filter(c=>!c.ailleurs));
  const ail=grouperCourses(l.filter(c=>c.ailleurs));
  const bouts=[];
  if(sup.length)bouts.push('🛒 Au supermarché\n'+sup.map(ligne).join('\n'));
  if(ail.length)bouts.push('🛍️ Ailleurs\n'+ail.map(ligne).join('\n'));
  return 'La liste de courses\n\n'+bouts.join('\n\n');
}

function texteJournee(d){
  const items=elementsJour(d);
  const jour=DFR[jSem(d)-1]+' '+d.getDate()+' '+MFR[d.getMonth()].toLowerCase();
  const lignes=items.map(it=>(it.h?it.h+' · ':'')+sansEmoji(it.titre)+(it.qui?' ('+it.qui+')':''));
  const t=toutesTaches().filter(x=>x.ech===iso(d)&&!estFaite(x.id)).map(x=>'· '+x.texte+(x.qui?' — '+x.qui:''));
  if(!lignes.length&&!t.length)return '📅 '+jour+'\nRien de prévu 🌿';
  return '📅 '+jour+(lignes.length?'\n\n'+lignes.join('\n'):'')+(t.length?'\n\nÀ faire :\n'+t.join('\n'):'');
}
function texteRepas(lundi){

  for(let i=0;i<7;i++){

/* ================== PASTILLES D'UN JOUR (mois/année) ================== */
/* L'emoji d'un élément : celui de son titre, sinon celui de sa catégorie.
   (Tes titres en portent déjà un deux fois sur trois, et l'IA en ajoute un à chaque dictée.) */
const EMOJI_CAT={voyage:'🧳',rentree:'🎒',pro:'💼',event:'📌',bday:'🎂',
  deadline:'📋',facture:'💳',family:'🎁',other:'📌',school:'🏫',
  darya:'🤸',kyan:'🎵',cyrus:'🧸',both:'👨‍👩‍👧'};
const RE_EMOJI=/^(\p{Extended_Pictographic}\uFE0F?(?:\u200D\p{Extended_Pictographic}\uFE0F?)*)/u;
function sansEmoji(txt){return String(txt||'').trim().replace(RE_EMOJI,'').trim()}
function emojiDe(txt,cat){
  const m=String(txt||'').trim().match(RE_EMOJI);
  if(m)return m[1];
  return EMOJI_CAT[cat]||'📌';
}
/* Ce que la case du mois doit montrer. Un séjour ne compte qu'une fois,
   au jour du départ : ensuite c'est la couleur de la case qui porte la suite. */
function tachesDuJour(d,sansDoublonAnniv){
  const s=iso(d);
  let out=toutesTaches().filter(t=>t.ech===s&&!estFaite(t.id));
  if(sansDoublonAnniv&&bdaysDuJour(d).length)out=out.filter(t=>!String(t.id).startsWith('auto-souhait-'));
  return out;
}
function emojisJour(d){
  const s=iso(d);const brut=[];
  bdaysDuJour(d).forEach(b=>brut.push(emojiDe(b.titre,'bday')));
  evtsDuJour(d).forEach(e=>{
    const multi=e.fin&&e.fin!==e.debut;
    if(multi&&s!==e.debut)return;
    brut.push(emojiDe(e.titre,e.cat));
  });
  tachesDuJour(d,true).forEach(t=>brut.push(emojiDe(t.texte,t.cat)));
  const uniques=[];
  brut.forEach(e=>{if(!uniques.includes(e))uniques.push(e)});
  return {uniques,total:brut.length};
}
/* Un séjour, c'est un événement qui dure. Sur le mois il ne s'écrit plus
   dans une case mais en travers de la semaine : le nom d'un côté, la durée
   sous les yeux. */
function estSejour(e){return !!(e.fin&&e.fin!==e.debut)}

function pastilles(d,sansSejours){
  const out=[];
  if(visible('bday'))bdaysDuJour(d).forEach(b=>out.push({titre:b.titre,c:coul('bday')}));
  evtsDuJour(d).forEach(e=>{
    if(!visible(e.cat))return;
    const multi=estSejour(e);
    if(multi&&sansSejours)return;                 // il a sa barre, plus haut
    if(multi&&iso(d)!==e.debut&&jSem(d)!==1){out.push({barre:true,c:coulEvt(e)});return}
    out.push({titre:e.titre,c:coulEvt(e)});
  });
  // Les actions datées apparaissent aussi sur le calendrier (en contour)
  const s=iso(d);
  toutesTaches().filter(t=>t.ech===s&&!estFaite(t.id)).forEach(t=>
    out.push({titre:'☐ '+t.texte,c:coul('alert'),contour:true}));
  return out;
}

/* ================== VUE MOIS ================== */
let jourSel=null;
/* Le jour que regarde « Ma journée ». Il était figé sur new Date() : on ne
   pouvait ni préparer demain ni revoir hier. */
let jourVu=iso(new Date());
function renderMois(){
  const y=cur.getFullYear(),m=cur.getMonth();
  const estMobile=window.innerWidth<700;
  if(estMobile){
    const auj=new Date();
    if(!jourSel||jourSel.slice(0,7)!==(y+'-'+String(m+1).padStart(2,'0')))
      jourSel=(auj.getFullYear()===y&&auj.getMonth()===m)?iso(auj):null;
  }
  document.getElementById('navTitle').textContent=MFR[m]+' '+y;
  const g=document.getElementById('monthGrid');g.innerHTML='';
  const decal=(new Date(y,m,1).getDay()+6)%7;
  const debut=new Date(y,m,1-decal);
  const auj=iso(new Date());

  /* Les six semaines, une par rangée. C'est la rangée qui sert de repère
     aux barres : sans elle, une case ne sait rien de sa voisine. */
  for(let sem=0;sem<6;sem++){
    const jours=[];
    for(let k=0;k<7;k++){const d=new Date(debut);d.setDate(d.getDate()+sem*7+k);jours.push(d)}
    const lundi=iso(jours[0]),dimanche=iso(jours[6]);

    /* Ce qui traverse cette semaine. Sur mobile la case fait 48 px : une
       barre n'y tiendrait pas, on garde les emojis. */
    const sejours=estMobile?[]:lesEvts()
      .filter(e=>estSejour(e)&&visible(e.cat)&&e.debut<=dimanche&&(e.fin||e.debut)>=lundi)
      .sort((a,b)=>a.debut.localeCompare(b.debut)||String(b.fin).localeCompare(String(a.fin)));

    /* Les étiquettes vacances / férié ne tombent pas le même jour partout.
       On leur réserve la même hauteur dans toute la rangée, sinon les barres
       se décalent d'une case à l'autre. */
    const nbTags=(d)=>{
      if(estMobile||d.getMonth()!==m)return 0;
      const v=enVacances(d);let n=0;
      if(v&&visible('vacances')&&(iso(d)===v.debut||jSem(d)===1))n++;
      if(ferie(d))n++;
      return n;
    };
    const tagMax=Math.max(0,...jours.map(nbTags));
    const HT=15;                                   // hauteur d'une étiquette
    const HV=21;                                   // hauteur d'une voie de barre

    const row=document.createElement('div');row.className='sem-row';
    jours.forEach(d=>{
      const hors=d.getMonth()!==m,v=enVacances(d),f=ferie(d);
      const we=d.getDay()===0||d.getDay()===6;
      const estRentree=lesEvts().some(e=>e.cat==='rentree'&&iso(d)===e.debut);
      const enVoyage=visible('voyage')&&evtsDuJour(d).some(e=>e.cat==='voyage');
      const cls=['day-cell'];
      if(hors)cls.push('other-month');
      if(iso(d)===auj)cls.push('today');
      if(estRentree)cls.push('rentree');else if(enVoyage)cls.push('voyage');
      else if(v&&visible('vacances'))cls.push('vacation');else if(we)cls.push('weekend');
      if(estMobile&&iso(d)===jourSel)cls.push('sel');
      const c=document.createElement('div');c.className=cls.join(' ');
      const dd=new Date(d);
      c.onclick=()=>{if(estMobile){jourSel=iso(dd);if(dd.getMonth()!==m)cur=new Date(dd.getFullYear(),dd.getMonth(),1);renderMois()}else ouvrirJour(dd)};
      let h=`<div class="day-num${f?' ferie':''}">${d.getDate()}</div>`;
      if(!estMobile)h+=`<button class="cell-add" title="Ajouter ce jour-là">＋</button>`;
      if(estMobile){
        const {uniques,total}=emojisJour(d);
        if(total){
          const montres=uniques.slice(0,2);
          const reste=total-montres.length;
          h+=`<div class="emo-jour${montres.length>1?' duo':''}">`
            +montres.map(e=>`<span class="emo">${e}</span>`).join('')+'</div>'
            +(reste>0?`<div class="emo-plus">+${reste}</div>`:'');
        }
      }else{
        if(tagMax){
          let t='';
          if(v&&!hors&&visible('vacances')&&(iso(d)===v.debut||jSem(d)===1))t+=`<div class="vac-tag">☀️ ${echap(v.nom)}</div>`;
          if(f&&!hors)t+=`<div class="vac-tag" style="color:#b34508">🇫🇷 ${echap(f)}</div>`;
          h+=`<div class="zone-tag" style="height:${tagMax*HT}px">${t}</div>`;
        }
        if(sejours.length)h+=`<div class="zone-voies" style="height:${sejours.length*HV}px"></div>`;
        const pil=pastilles(d,true);
        pil.slice(0,3).forEach(p=>{
          if(p.barre){h+=`<div class="pill-cont" style="background:${p.c}"></div>`;return}
          h+=p.contour
            ?`<div class="pill contour" style="border:1.5px dashed ${p.c};color:${p.c};background:transparent">${echap(p.titre.substring(0,26))}</div>`
            :`<div class="pill" style="background:${p.c}">${echap(p.titre.substring(0,26))}</div>`;
        });
        if(pil.length>3)h+=`<div class="plus">+${pil.length-3} autres</div>`;
      }
      c.innerHTML=h;
      const bAdd=c.querySelector('.cell-add');
      if(bAdd)bAdd.onclick=(ev)=>{ev.stopPropagation();ouvrirAjout(iso(dd))};
      row.appendChild(c);
    });

    /* Les barres, posées par-dessus la rangée. 6 px de marge de chaque côté :
       elles restent dans la case sans mordre l'arrondi, et franchissent
       l'espace de 4 px entre deux jours sans qu'on les voie faire. */
    if(sejours.length){
      const voie=document.createElement('div');voie.className='voie';
      voie.style.top=(30+tagMax*HT)+'px';
      const M=6;
      sejours.forEach((e,i)=>{
        const fin=e.fin||e.debut;
        const g0=e.debut<lundi?0:jours.findIndex(d=>iso(d)===e.debut);
        const g1=fin>dimanche?6:jours.findIndex(d=>iso(d)===fin);
        if(g0<0||g1<0)return;
        const suiteG=e.debut<lundi,suiteD=fin>dimanche;
        const b=document.createElement('div');
        b.className='barre-sejour'+(suiteG?' suite-g':'')+(suiteD?' suite-d':'');
        b.style.background=coulEvt(e);
        b.style.left=`calc(${g0} * (100% + 4px) / 7 + ${M}px)`;
        b.style.width=`calc(${g1-g0+1} * (100% + 4px) / 7 - ${2*M+4}px)`;
        b.style.top=(i*HV)+'px';
        b.textContent=e.titre;
        b.title=e.titre;
        const jour=new Date(jours[g0]);
        b.onclick=(ev)=>{ev.stopPropagation();ouvrirJour(jour)};
        voie.appendChild(b);
      });
      row.appendChild(voie);
    }
    g.appendChild(row);
  }
  renderJourDetail();
}

function renderJourDetail(){
  const zone=document.getElementById('jourDetail');
  if(!zone)return;
  if(window.innerWidth>=700||!jourSel||vue!=='mois'||section!=='cal'){zone.innerHTML='';return}
  const d=deIso(jourSel);
  const v=enVacances(d),fe=ferie(d);
  const bds=bdaysDuJour(d),evs=evtsDuJour(d),acs=actsDuJour(d);
  const tks=tachesDuJour(d,true);
  const lignes=[];
  // L'emoji occupe la colonne de gauche : on ne le répète pas dans le titre.
  bds.forEach(b=>lignes.push({h:'',ti:sansEmoji(b.titre),ico:emojiDe(b.titre,'bday'),qui:''}));
  evs.forEach(e=>lignes.push({h:e.heure||'',ti:sansEmoji(e.titre),ico:emojiDe(e.titre,e.cat),qui:e.qui||''}));
  tks.forEach(t=>lignes.push({h:'',ti:sansEmoji(t.texte),ico:emojiDe(t.texte,t.cat),qui:t.qui||'',tache:true}));
  lignes.sort((a,b)=>minutes(a.h)-minutes(b.h));
  const info=[fe?'🇫🇷 '+fe:'',v?v.nom:''].filter(Boolean).join(' · ');
  let h=`<div class="jd-carte">
    <div class="jd-tete"><span class="jd-j">${DFR[jSem(d)-1]} ${d.getDate()} ${MFR[d.getMonth()]}</span>
      ${info?`<span class="jd-i">${echap(info)}</span>`:''}</div>`;
  if(!lignes.length&&!acs.length)h+='<div class="jd-vide">Rien de prévu ce jour-là 🌿</div>';
  lignes.slice(0,4).forEach(l=>{
    h+=`<div class="jd-l"><span class="jd-h">${l.h?echap(l.h):l.ico}</span>
      <span class="jd-t">${echap(l.ti)}</span>
      ${l.qui?`<span class="jd-q">${echap(l.qui)}</span>`:''}</div>`;
  });
  if(lignes.length>4)h+=`<div class="jd-x">＋ ${lignes.length-4} autre${lignes.length-4>1?'s':''}</div>`;
  if(acs.length)h+=`<div class="jd-x">＋ ${acs.length} habitude${acs.length>1?'s':''}</div>`;
  h+=`<div style="display:flex;gap:8px;margin-top:11px">
    <button class="btn mini" id="jd-detail" style="flex:1">Voir toute la journée ›</button>
    <button class="btn primaire mini" id="jd-add">＋ Ajouter</button>
  </div></div>`;
  zone.innerHTML=h;
  document.getElementById('jd-detail').onclick=()=>ouvrirJour(deIso(jourSel));
  document.getElementById('jd-add').onclick=()=>ouvrirAjout(jourSel);
}

/* ================== VUE « À VENIR » ==================
   Ce n'est pas le mois en liste : ça part d'aujourd'hui et ça continue,
   par-dessus la fin du mois. Et la routine de la semaine (école, trajets,
   activités hebdo) se replie en une ligne — sinon elle noie tout le reste. */
let avRoutineOuverte={};
function renderAgenda(){
  const zone=document.getElementById('agendaView');zone.innerHTML='';
  const auj=new Date(),sAuj=iso(auj);
  document.getElementById('navTitle').textContent='À venir';
  let h='',moisAffiche='',rendus=0;
  for(let i=0;i<120&&rendus<40;i++){
    const d=new Date(auj);d.setDate(d.getDate()+i);
    const s=iso(d);
    const v=enVacances(d),fe=ferie(d);
    // Les séjours : au jour du départ, et rappelés aujourd'hui s'ils sont en cours
    const evs=evtsDuJour(d).filter(e=>{
      const multi=e.fin&&e.fin!==e.debut;
      return !multi||s===e.debut||(i===0&&s>e.debut);
    });
    const bds=bdaysDuJour(d);
    const tks=tachesDuJour(d,true);
    const acs=actsDuJour(d).filter(a=>!a.annuleeCeJour);
    if(!evs.length&&!bds.length&&!tks.length&&!acs.length)continue;
    if(!evs.length&&!bds.length&&!tks.length&&i>0)continue; // un jour de pure routine ne mérite pas sa ligne
    rendus++;

    const moisCourt=MFR[d.getMonth()]+' '+d.getFullYear();
    if(moisCourt!==moisAffiche){moisAffiche=moisCourt;h+=`<div class="av-mois">${echap(moisCourt)}</div>`}

    const nomJour=i===0?"Aujourd'hui":i===1?'Demain':DFR[jSem(d)-1].toLowerCase()+' '+d.getDate();
    const info=[fe?'🇫🇷 '+fe:'',v?v.nom:''].filter(Boolean).join(' · ');
    h+=`<div class="av-jt"><span class="j ${i===0?'auj':''}">${echap(nomJour)}</span>
      <span class="b"></span>${info?`<span class="info">${echap(info)}</span>`:''}</div>`;

    const lignes=[];
    bds.forEach(b=>lignes.push({id:b.id,ti:b.titre.replace(/^🎂 /,''),su:'',qui:null,h:null}));
    evs.forEach(e=>{
      const multi=e.fin&&e.fin!==e.debut;
      const su=multi
        ? (s===e.debut?'du '+deIso(e.debut).getDate()+' au '+deIso(e.fin).getDate()+' '+MFR[deIso(e.fin).getMonth()].toLowerCase()
                      :"jusqu'au "+deIso(e.fin).getDate()+' '+MFR[deIso(e.fin).getMonth()].toLowerCase())
        : (e.heure||'');
      lignes.push({id:e.id,ti:e.titre,su,qui:e.qui,h:e.heure||null});
    });
    tks.forEach(t=>lignes.push({id:t.id,ti:t.texte,su:'à faire',qui:t.qui,h:null,tache:true}));
    lignes.sort((a,b)=>minutes(a.h||'')-minutes(b.h||''));
    lignes.forEach((l,k)=>{
      h+=`<div class="av-li ${k===0?'av-premier':''} ${k===lignes.length-1&&!acs.length?'av-dernier':''}" data-av="${l.id}" data-avd="${s}">
        <div class="av-rail"><span class="av-pa"></span></div>
        <div class="av-co"><div class="av-ti">${echap(l.ti)}</div>
          ${l.su?`<div class="av-su">${echap(l.su)}</div>`:''}</div>
        ${etiquettePersonne(l.qui)}</div>`;
    });
    if(acs.length){
      const ouvert=!!avRoutineOuverte[s];
      if(ouvert){
        acs.sort((a,b)=>minutes(a.hd)-minutes(b.hd)).forEach((a,k)=>{
          h+=`<div class="av-li ${k===acs.length-1?'av-dernier':''}" data-av="${a.id}" data-avd="${s}">
            <div class="av-rail"><span class="av-pa"></span></div>
            <div class="av-co"><div class="av-ti" style="font-weight:450;color:var(--ink-2)">${echap(a.titre.split('—')[0].trim())}</div>
              <div class="av-su">${echap((a.hd||'')+(a.hf?' → '+a.hf:''))}</div></div>
            ${etiquettePersonne(a.qui)}</div>`;
        });
      }
      const quoi=[...new Set(acs.map(a=>a.titre.split('—')[0].trim().split(' ')[0].replace(/^\S*[\u{1F300}-\u{1FAFF}]\S*$/u,'').trim()).filter(Boolean))].slice(0,3);
      h+=`<div class="av-rout" data-avrout="${s}"><div class="av-rail"></div>
        <span class="lb">${ouvert?'▾':'▸'} <b>${acs.length} habitude${acs.length>1?'s':''}</b>${!ouvert&&quoi.length?' — '+echap(quoi.join(', ').toLowerCase()):''}</span></div>`;
    }
  }
  zone.innerHTML=h||'<div class="av-vide">Rien devant toi pour l\'instant 🌿</div>';
  zone.querySelectorAll('[data-avrout]').forEach(el=>{
    el.onclick=()=>{const k=el.dataset.avrout;avRoutineOuverte[k]=!avRoutineOuverte[k];renderAgenda()};
  });
  zone.querySelectorAll('[data-av]').forEach(el=>{
    el.onclick=()=>{
      const id=el.dataset.av,jour=deIso(el.dataset.avd);
      if(String(id).startsWith('auto-')||CACHE.taches.some(t=>t.id===id)){ouvrirJour(jour);return}
      detailJour(id,jour);
    };
  });
}

/* ================== VUE SEMAINE ================== */
function renderSemaine(){
  const co=document.getElementById('weekView');
  const d=new Date(cur),dy=d.getDay(),df=d.getDate()-dy+(dy===0?-6:1);
  const lundi=new Date(d.setDate(df));
  const jours=[];for(let i=0;i<7;i++){const x=new Date(lundi);x.setDate(x.getDate()+i);jours.push(x)}
  document.getElementById('navTitle').textContent=`Semaine du ${lundi.getDate()} ${MFR[lundi.getMonth()]}`;
  const H0=8,H1=20,PPH=52; // de 8h à 20h, 52px par heure
  const auj=iso(new Date());
  // Bandeau "toute la journée" : événements sans heure + anniversaires
  let h='<div class="week-allday"><div class="wa-lbl">journée</div>';
  jours.forEach(dd=>{
    h+='<div class="wa">';
    if(visible('bday'))bdaysDuJour(dd).forEach(b=>{h+=`<div class="we" style="background:${coul('bday')}">${echap(b.titre.substring(0,18))}</div>`});
    evtsDuJour(dd).filter(e=>visible(e.cat)&&!e.heure).forEach(e=>{
      h+=`<div class="we" style="background:${coulEvt(e)}">${echap(e.titre.substring(0,18))}</div>`;
    });
    h+='</div>';
  });
  h+='</div>';
  // Entêtes des jours
  h+='<div class="wk2-entetes"><div></div>';
  jours.forEach(dd=>{h+=`<div class="wk2-h ${iso(dd)===auj?'auj':''}">${DS[jSem(dd)-1]} ${dd.getDate()}</div>`});
  h+='</div>';
  // Corps : colonne des heures + 7 colonnes de la semaine
  const HT=(H1-H0)*PPH;
  h+='<div class="wk2-corps"><div class="wk2-heures" style="height:'+HT+'px">';
  for(let hr=H0;hr<H1;hr++)h+=`<div style="height:${PPH}px">${hr}:00</div>`;
  h+='</div>';
  jours.forEach(dd=>{
    h+=`<div class="wk2-col" data-j="${iso(dd)}" style="height:${HT}px">`;
    for(let hr=H0+1;hr<H1;hr++)h+=`<div class="wk2-ligne" style="top:${(hr-H0)*PPH}px"></div>`;
    // Blocs : activités (avec durée) + événements horodatés
    const items=[];
    actsDuJour(dd).filter(a=>visible(a.cat)).forEach(a=>{
      const deb=minutes(a.hd);if(deb<0)return;
      items.push({deb,fin:a.hf&&minutes(a.hf)>deb?minutes(a.hf):deb+60,
        titre:a.titre,hr:a.hd+(a.hf?'–'+a.hf:''),c:coul(a.cat),ann:a.annuleeCeJour});
    });
    evtsDuJour(dd).filter(e=>visible(e.cat)&&e.heure).forEach(e=>{
      const m=String(e.heure).match(/(\d{1,2}[:h]\d{2})\s*[-–]\s*(\d{1,2}[:h]\d{2})/);
      const deb=minutes(m?m[1]:e.heure);if(deb<0)return;
      items.push({deb,fin:m&&minutes(m[2])>deb?minutes(m[2]):deb+60,titre:e.titre,hr:e.heure,c:coulEvt(e)});
    });
    // Répartition côte à côte en cas de chevauchement
    items.sort((a,b)=>a.deb-b.deb);
    const finsLanes=[];
    items.forEach(it=>{
      let l=0;
      while(finsLanes[l]!==undefined&&finsLanes[l]>it.deb)l++;
      it.lane=l;finsLanes[l]=it.fin;
    });
    const nb=Math.max(1,finsLanes.length);
    items.forEach(it=>{
      const top=Math.max(0,(it.deb-H0*60)/60*PPH);
      const bas=Math.min(HT,(it.fin-H0*60)/60*PPH);
      const ht=Math.max(16,bas-top-2);
      const larg=100/nb;
      h+=`<div class="wk2-ev" style="top:${top}px;height:${ht}px;left:${it.lane*larg}%;width:calc(${larg}% - 2px);background:${it.c};${it.ann?'opacity:.4;text-decoration:line-through':''}">`+
        `${ht>=30?`<div class="wk2-hr">${echap(it.hr)}</div>`:''}${echap(it.titre)}</div>`;
    });
    h+='</div>';
  });
  h+='</div>';
  co.innerHTML=h;
  co.querySelectorAll('.wk2-col').forEach(c=>{c.onclick=()=>ouvrirJour(deIso(c.dataset.j))});
}

function miniMois(y,m,auj){
  const nb=new Date(y,m+1,0).getDate();
  const decal=(new Date(y,m,1).getDay()+6)%7;
  let h=`<div class="mini-month" data-ym="${y}-${m}"><div class="mini-month-title">${MFR[m]} ${y}</div><div class="mini-grid">`;
  ['L','M','M','J','V','S','D'].forEach(x=>h+=`<div class="mh">${x}</div>`);
  for(let i=0;i<decal;i++)h+='<div class="md"></div>';
  for(let j=1;j<=nb;j++){
    const d=new Date(y,m,j);
    const evs=evtsDuJour(d).filter(e=>visible(e.cat));
    const bds=visible('bday')?bdaysDuJour(d):[];
    const aRen=evs.some(e=>e.cat==='rentree');
    const aBday=bds.length>0,aEvt=evs.some(e=>e.cat==='event'),aPro=evs.some(e=>e.cat==='pro'),aVoy=evs.some(e=>e.cat==='voyage');
    const aFer=ferie(d)&&true,aVac=visible('vacances')&&enVacances(d);
    let cl='md';
    if(iso(d)===auj)cl+=' td';else if(aRen)cl+=' ren';else if(aBday)cl+=' bday';else if(aEvt)cl+=' evt';
    else if(aFer)cl+=' fer';else if(aPro)cl+=' pro';else if(aVoy)cl+=' voy';else if(aVac)cl+=' vac';
    const tips=[ferie(d)?'🇫🇷 '+ferie(d):'',...bds.map(b=>b.titre),...evs.map(e=>e.titre)].filter(Boolean).join('\n');
    const safe=tips.replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    h+=`<div class="${cl}" ${safe?'data-tip="'+safe+'"':''}>${j}</div>`;
  }
  h+='</div></div>';
  return h;
}

function renderYearSidebar(){
  const el=document.getElementById('yearSidebar');
  const debut='2026-03-01',fin='2027-12-31';
  const auj=iso(new Date());
  const fmt=(s)=>{const d=deIso(s);return d.getDate()+' '+MFR[d.getMonth()].substring(0,4)};
  const cats={'🎂 Anniversaires':[],'💒 Événements':[],'💼 Absences':[],'✈️ Voyages':[]};
  // Anniversaires : première occurrence dans la période
  lesBdays().forEach(b=>{
    for(const y of [2026,2027]){
      const s=y+'-'+String(b.mois).padStart(2,'0')+'-'+String(b.jour).padStart(2,'0');
      if(s>=debut&&s<=fin&&s>=auj){
        const age=b.annee?y-b.annee:null;
        cats['🎂 Anniversaires'].push({tri:s,dateStr:fmt(s),titre:(b.type==='evenement'?(b.icone||'💍')+' ':'🎂 ')+b.nom+(age?' ('+age+' ans)':'')});
        break;
      }
    }
  });
  lesEvts().forEach(e=>{
    if(e.cat==='alert')return;
    if((e.fin||e.debut)<auj)return;
    const cible=e.cat==='pro'?'💼 Absences':e.cat==='voyage'?'✈️ Voyages':'💒 Événements';
    const lien=e.detail?(e.detail.match(/href="([^"]+)"/)||[])[1]:null;
    const dateStr=e.fin&&e.fin!==e.debut?fmt(e.debut)+' → '+deIso(e.fin).getDate():fmt(e.debut);
    cats[cible].push({tri:e.debut,dateStr,titre:e.titre,lien});
  });
  let h='<h3>📅 À venir</h3>';
  for(const [cat,items] of Object.entries(cats)){
    if(!items.length)continue;
    items.sort((a,b)=>a.tri<b.tri?-1:1);
    h+=`<div class="ys-cat"><div class="ys-cat-title">${cat}</div>`;
    items.forEach(e=>{
      h+=`<div class="ys-item"><span class="ys-date">${e.dateStr}</span><span class="ys-text">${echap(e.titre)}${e.lien?' <a href="'+e.lien+'" target="_blank">🔗</a>':''}</span></div>`;
    });
    h+='</div>';
  }
  el.innerHTML=h;
}

const GROUPES={deadline:'📋 Admin & inscriptions',facture:'💳 Factures',family:'👨‍👩‍👧 Événements & préparatifs',sante:'🩺 Santé',other:'📌 Divers'};

function tachesDuMois(y,m){
  const val=y*12+m;
  return toutesTaches().filter(t=>{
    if(t.persistante)return val>=(t.debY*12+t.debM)&&val<=(t.finY*12+t.finM);
    return t.y===y&&t.m===m;
  });
}
function tachesEnRetard(){
  const auj=iso(new Date());
  const reel=new Date();const valReel=reel.getFullYear()*12+(reel.getMonth()+1);
  const il7jours=new Date();il7jours.setDate(il7jours.getDate()-7);
  return toutesTaches().filter(t=>{
    if(estFaite(t.id))return false;
    if(t.persistante){const rest=(t.finY*12+t.finM)-valReel;return rest<=1&&valReel>=(t.debY*12+t.debM)&&rest>=0}
    if(!t.ech||t.ech>=auj)return false;
    if(t.auto)return t.ech>=iso(il7jours); // les actions auto (souhaiter…) ne se reportent que 7 jours
    return (t.y*12+t.m)>=valReel-2; // les autres : on remonte 2 mois max
  });
}

function ligneTache(t,opts){
  const faite=estFaite(t.id);
  let sous=echap(t.dateTexte||'');
  if(t.qui)sous+=(sous?' · ':'')+echap(t.qui);

    if(info)sous+=(sous?' · ':'')+'🔗 '+echap((info.titre||info.nom||'').substring(0,28));
  }
  if(t.persistante)sous+=(sous?' · ':'')+'<em>reporté tant que non coché</em>';
  if(opts&&opts.mois)sous=`<strong>${MFR[t.m-1]}</strong>`+(sous?' · '+sous:'');

}

/* La to-do est rangée par personne, pas par catégorie administrative :
   la question qu'on se pose n'est pas « de quel type est cette tâche »
   mais « qui la porte, et qu'est-ce que personne n'a pris ». */
const EMOJI_TACHE={deadline:'📋',facture:'💳',family:'🎁',sante:'🩺',other:'📌'};
function emojiTache(t){
  const m=String(t.texte||'').trim().match(RE_EMOJI);
  if(m)return '';                                  // le texte porte déjà le sien
  return (EMOJI_TACHE[t.cat]||EMOJI_TACHE.other)+' ';
}
/* Pourquoi cette ligne est là — une seule façon d'écrire les dates. */
function raisonTache(t){
  const auj=new Date(),sAuj=iso(auj);
  if(t.persistante){
    const val=auj.getFullYear()*12+(auj.getMonth()+1);
    const rest=(t.finY*12+t.finM)-val;
    if(rest<=0)return {txt:'dernier mois pour le faire',tard:true};
    if(rest===1)return {txt:'encore ce mois-ci et le suivant',tard:false};
    return {txt:'chaque mois, jusqu\'en '+MFR[t.finM-1].toLowerCase()+' '+t.finY,tard:false};
  }
  if(!t.ech)return {txt:'',tard:false};
  const d=deIso(t.ech);
  const j=Math.round((d-deIso(sAuj))/864e5);
  if(j<0)return {txt:(-j)+' jour'+(j<-1?'s':'')+' de retard',tard:true};
  if(j===0)return {txt:'aujourd\'hui',tard:true};
  if(j===1)return {txt:'demain',tard:false};
  if(j<=6)return {txt:DFR[jSem(d)-1].toLowerCase(),tard:false};
  return {txt:d.getDate()+' '+MFR[d.getMonth()].toLowerCase(),tard:false};
}
function ligneTache2(t,opts){
  const faite=estFaite(t.id);
  const r=raisonTache(t);
  const bouts=[];
  if(r.txt)bouts.push(`<span class="${r.tard&&!faite?'td-tard':''}">${echap(r.txt)}</span>`);
  if(t.lien){
    const info=trouverParId(t.lien);
    if(info)bouts.push('🔗 '+echap((info.titre||info.nom||'').substring(0,26)));
  }
  return `<div class="todo-item ${faite?'done':''}" data-id="${t.id}">
    <div class="todo-check" data-act="cocher"></div>
    <div class="todo-corps" data-act="cocher">
      <div class="todo-text">${emojiTache(t)}${echap(t.texte)}</div>
      ${bouts.length?`<div class="todo-date">${bouts.join(' · ')}</div>`:''}
    </div>
    ${opts&&opts.prendre?`<button class="td-prendre" data-act="prendre">je prends</button>`:''}
    <div class="todo-actions">
      <button class="todo-act" data-act="modif" title="Modifier">✏️</button>
      <button class="todo-act" data-act="suppr" title="Supprimer">🗑️</button>
    </div>
  </div>`;
}
/* Les autres comptes du foyer : un onglet chacun. */
function autresComptes(){
  const moi=String(UTILISATEUR||'').trim().toLowerCase();
  return (CACHE.comptes||[]).filter(n=>String(n).trim().toLowerCase()!==moi);
}
const estAMoi=(t)=>String(t.qui||'').trim().toLowerCase()===String(UTILISATEUR||'').trim().toLowerCase();
const estAPersonne=(t)=>!String(t.qui||'').trim();
/* Tout ce qui reste à faire — le retard ne remonte pas à l'infini, et une
   action automatique (souhaiter un anniversaire) ne traîne que 7 jours. */
function tachesOuvertes(){
  const auj=iso(new Date()),il7=iso(new Date(Date.now()-7*864e5)),il30=iso(new Date(Date.now()-30*864e5));
  return toutesTaches().filter(t=>{
    if(estFaite(t.id))return false;
    if(t.persistante){
      const val=new Date().getFullYear()*12+(new Date().getMonth()+1);
      return val>=(t.debY*12+t.debM)&&val<=(t.finY*12+t.finM);
    }
    if(!t.ech)return true;
    if(t.ech>=auj)return true;
    return t.ech>=(t.auto?il7:il30);
  });
}
/* L'horizon : ce qui demande une décision maintenant. Au-delà, ça existe
   mais ça dort replié — sinon vingt-deux anniversaires noient trois urgences. */
const HORIZON_JOURS=14;
function dansLHorizon(t){
  if(t.persistante)return true;
  if(!t.ech)return false;
  const j=Math.round((deIso(t.ech)-deIso(iso(new Date())))/864e5);
  return j<=HORIZON_JOURS;
}
const plusTard=(t)=>!t.persistante&&t.ech&&!dansLHorizon(t);
const sansDate=(t)=>!t.persistante&&!t.ech;
function trierTaches(l){
  return l.slice().sort((a,b)=>{
    const ra=raisonTache(a),rb=raisonTache(b);
    if(ra.tard!==rb.tard)return ra.tard?-1:1;
    return String(a.ech||'9999').localeCompare(String(b.ech||'9999'));
  });
}
function faitesRecemment(filtre){
  const il7=iso(new Date(Date.now()-7*864e5));
  return toutesTaches().filter(t=>estFaite(t.id)&&t.ech&&t.ech>=il7&&filtre(t));
}
/* ---------- Les projets ----------
   Un projet, c'est un nom et des tâches qui lui appartiennent. Dans la to-do

function lesProjets(){return (CACHE.projets||[]).filter(p=>!p.archive)}
function tachesDuProjet(id){return toutesTaches().filter(t=>t.projet_id===id)}
function avancement(id){
  const l=tachesDuProjet(id);
  return {faites:l.filter(t=>estFaite(t.id)).length,total:l.length};
}
/* La prochaine chose à faire dans un projet : la plus datée, puis la première. */
function prochaineDuProjet(id){
  const l=trierTaches(tachesDuProjet(id).filter(t=>!estFaite(t.id)));
  return l[0]||null;
}

function renderTodo(){

      }).join('')}
