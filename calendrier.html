  }

  if(ongletTodo==='moi'){
    const mA=miennes.filter(dansLHorizon),lA=libres.filter(dansLHorizon);
    h+=`<div class="td-sect">À toi<span class="n">${mA.length}</span></div>`;
    if(!mA.length)h+=`<div class="todo-empty">Rien sur ton dos 🌿</div>`;
    mA.forEach(t=>{h+=ligneTache2(t,{})});

    if(lA.length){
      h+=`<div class="td-sect rouge">Personne dessus<span class="n">${lA.length}</span></div>`;
      lA.forEach(t=>{h+=ligneTache2(t,{prendre:true})});
    }

    const projs=lesProjets().slice().sort((a,b)=>String(a.ech||'9999').localeCompare(String(b.ech||'9999')));
    h+=`<div class="td-sect">Les projets<span class="n">${projs.length||''}</span></div>`;
    if(!projs.length)h+=`<div class="todo-empty" style="padding:10px 0">Rien en cours.</div>`;
    projs.forEach(p=>{
      const a=avancement(p.id);
      const suite=prochaineDuProjet(p.id);
      h+=`<div class="pj-l" data-projet="${p.id}">
        <span class="ic">${p.emoji||'✨'}</span>
        <div class="co"><div class="tx">${echap(p.nom)}</div>
          <div class="barre"><i style="width:${a.total?Math.round(a.faites/a.total*100):0}%"></i></div>
          ${suite?`<div class="su">à suivre : ${echap(suite.texte)}</div>`:(a.total?'<div class="su">tout est fait 🎉</div>':'<div class="su">aucune tâche pour l\'instant</div>')}
        </div>
        <span class="ch">${a.faites} / ${a.total} ›</span></div>`;
    });
    h+=`<button class="btn mini" id="td-new-projet" style="width:100%;margin-top:8px">＋ Nouveau projet</button>`;

    const tard=trierTaches(miennes.concat(libres).filter(plusTard));
    if(tard.length){
      h+=`<div class="td-plier" data-plier="tard">${todoPlie.tard?'▾':'▸'} Plus tard (${tard.length})</div>`;
      if(todoPlie.tard)tard.forEach(t=>{h+=ligneTache2(t,{prendre:estAPersonne(t)})});
    }
    const sd=trierTaches(miennes.concat(libres).filter(sansDate));
    if(sd.length){
      h+=`<div class="td-plier" data-plier="sansdate">${todoPlie.sansdate?'▾':'▸'} Sans date (${sd.length})</div>`;
      if(todoPlie.sansdate)sd.forEach(t=>{h+=ligneTache2(t,{prendre:estAPersonne(t)})});
    }

    // Ce qui est confié aux enfants ou à quelqu'un d'autre : on le sait, sans l'avoir sous le nez
    const comptesBas=(CACHE.comptes||[]).map(x=>String(x).trim().toLowerCase());
    const ailleurs=trierTaches(ouvertes.filter(t=>{
      const q=String(t.qui||'').trim().toLowerCase();
      return q&&!comptesBas.includes(q);
    }));
    if(ailleurs.length){
      h+=`<div class="td-plier" data-plier="ailleurs">${todoPlie.ailleurs?'▾':'▸'} Confié à quelqu'un d'autre (${ailleurs.length})</div>`;
      if(todoPlie.ailleurs)ailleurs.forEach(t=>{h+=ligneTache2(t,{})});
    }
    const faites=faitesRecemment(t=>estAMoi(t)||estAPersonne(t));
    if(faites.length){
      h+=`<div class="td-plier" data-plier="faites">${todoPlie.faites?'▾':'▸'} Fait cette semaine (${faites.length})</div>`;
      if(todoPlie.faites)faites.forEach(t=>{h+=ligneTache2(t,{})});
    }
  }else{
    const nom=autres.find(n=>n.toLowerCase()===ongletTodo)||ongletTodo;
    const siennes=trierTaches(ouvertes.filter(t=>String(t.qui||'').trim().toLowerCase()===ongletTodo&&dansLHorizon(t)));
    h+=`<div class="td-sect">Ce que ${echap(nom)} porte<span class="n">${siennes.length}</span></div>`;
    if(!siennes.length)h+=`<div class="todo-empty">${echap(nom)} n'a rien sur le feu 🌿</div>`;
    siennes.forEach(t=>{h+=ligneTache2(t,{})});
    const f=faitesRecemment(t=>String(t.qui||'').trim().toLowerCase()===ongletTodo);
    if(f.length){
      h+=`<div class="td-plier" data-plier="faites">${todoPlie.faites?'▾':'▸'} Ce qu'${echap(nom)} a fait cette semaine (${f.length})</div>`;
      if(todoPlie.faites)f.forEach(t=>{h+=ligneTache2(t,{})});
    }
    h+=`<p class="discret2" style="margin-top:16px">Les projets et ce que personne n'a pris restent sur ton onglet.</p>`;
  }

  h+=`<button class="btn" style="width:100%;margin-top:14px" id="td-ajout">＋ Ajouter une tâche</button>`;
  p.innerHTML=h;

  // Les puces « À faire / Courses » sont redessinées à chaque rendu : sans
  // ce branchement, celle des courses est là mais ne répond pas. La liste
  // des courses, elle, le faisait déjà — d'où un aller sans retour.
  brancherVues(p,setVueTodo);
  p.querySelectorAll('.td-ong button').forEach(b=>{b.onclick=()=>{ongletTodo=b.dataset.o;renderTodo()}});
  p.querySelectorAll('[data-plier]').forEach(b=>{b.onclick=()=>{
    todoPlie[b.dataset.plier]=!todoPlie[b.dataset.plier];renderTodo();
  }});
  const ba=document.getElementById('td-ajout');
  if(ba)ba.onclick=()=>formTache(null);
  const bp=document.getElementById('td-new-projet');
  if(bp)bp.onclick=()=>formProjet(null);
  p.querySelectorAll('[data-projet]').forEach(el=>{el.onclick=()=>ouvrirProjet(el.dataset.projet)});
  p.querySelectorAll('.todo-item [data-act]').forEach(el=>{
    el.addEventListener('click',ev=>{
      ev.stopPropagation();
      const id=el.closest('.todo-item').dataset.id;
      if(!id)return;
      const act=el.dataset.act;
      if(act==='cocher'){basculerFaite(id);render()}
      else if(act==='prendre'){
        enregistrerObjet(id,'taches',{qui:UTILISATEUR||''});
        toast('C\'est à toi maintenant ✔');render();
      }
      else if(act==='modif'){formTache(id)}
      else if(act==='suppr'){
        if(confirm('Supprimer cette tâche ?')){supprimerObjet(id);render();toast('Tâche supprimée')}
      }
    });
  });
}

/* ================== TIROIR : DÉTAIL D'UN JOUR ================== */
/* ============ ☀️ TA JOURNÉE — l'écran d'un jour ============
   Une chronologie : un fil relie les rendez-vous, la pastille se remplit
   quand c'est passé, le fil se colore derrière toi. Les tâches, elles,
   ne sont pas une chronologie mais une répartition : rangées par personne. */
const TEINTES=[['#c2255c','#fce7ef'],['#1864ab','#e4effa'],['#9c36b5','#f6e6fb'],
               ['#e8590c','#fdece0'],['#2b8a3e','#e5f5e9'],['#5f3dc4','#eceafb']];
function teintePersonne(nom){
  const n=String(nom||'').trim();
  if(!n)return null;
  const bas=n.toLowerCase();
  const i=(CACHE.membres||[]).findIndex(m=>String(m).trim().toLowerCase()===bas);
  if(i>=0)return TEINTES[i%TEINTES.length];
  if(/[,&+]|\bet\b|famille|tous|toute/.test(bas))return ['#9c36b5','#f6e6fb'];
  return ['#6f6b62','#eeecea'];
}
function etiquettePersonne(nom){
  const t=teintePersonne(nom);
  if(!t)return '';
  return `<span class="tj-eti" style="color:${t[0]};background:${t[1]}">${echap(String(nom).trim())}</span>`;
}
// Les éléments datés du jour, dans l'ordre de l'heure
function elementsJour(d){
  const out=[];
  bdaysDuJour(d).forEach(b=>out.push({id:b.id,type:'bday',h:null,fin:null,
    titre:b.titre.replace(/^🎂 /,''),sous:b.detail||'',qui:null}));
  evtsDuJour(d).forEach(e=>{
    const multi=e.fin&&e.fin!==e.debut;
    out.push({id:e.id,type:'evt',h:e.heure||null,fin:null,titre:e.titre,
      sous:[e.heure||'',multi?'du '+deIso(e.debut).getDate()+' au '+deIso(e.fin).getDate()+' '+MFR[deIso(e.fin).getMonth()].toLowerCase():''].filter(Boolean).join(' · '),
      qui:e.qui||null});
  });
  actsDuJour(d).forEach(a=>out.push({id:a.id,type:'act',h:a.hd||null,fin:a.hf||null,recur:true,
    annulee:!!a.annuleeCeJour,titre:a.titre.split('—')[0].trim(),
    sous:(a.hd||'')+(a.hf?' → '+a.hf:'')+(a.annuleeCeJour?' · annulée ce jour':''),qui:a.qui||null}));
  out.sort((x,y)=>{
    if(!x.h&&!y.h)return 0;
    if(!x.h)return -1;
    if(!y.h)return 1;
    return minutes(x.h)-minutes(y.h);
  });
  return out;
}
/* La pastille « qui emmène », sur une ligne d'activité */
function pastilleAccomp(actId,d){
  const act=lesActs().find(a=>a.id===actId);
  if(!act)return '';
  const {qui,exception}=quiAccompagne(act,d);
  // On n'affiche rien tant que tu n'as rien dit sur cette activité : sinon
  // « qui l'emmène ? » s'afficherait neuf fois sur une journée d'école.
  // La pastille creuse n'apparaît que si tu as ouvert la question toi-même.
  if(!qui&&!act.accompagne&&!exception)return '';
  const cls=['acc',exception?'exception':'',qui?'':'vide'].filter(Boolean).join(' ');
  // Pas de voiture : on ne sait pas comment on y va, et le plus souvent
  // c'est à pied. « avec X » dit qui est là, sans rien présumer d'autre.
  const txt=qui?'avec '+echap(qui)+(exception?' · cette fois':''):'avec qui ?';
  return `<button type="button" class="${cls}" data-acc="${act.id}" data-accj="${iso(d)}">${txt}</button>`;
}
/* On touche la pastille : deux prénoms, et une seule vraie décision —
   cette fois-ci, ou pour de bon. */
function choisirAccompagnateur(actId,sJour){
  const act=lesActs().find(a=>a.id===actId);
  if(!act)return;
  const d=deIso(sJour);
  const {qui}=quiAccompagne(act,d);
  let choix=qui||'',pourToujours=false;
  const nomEnfant=(act.qui||'').trim();
  ouvrirTiroirBrut('Qui emmène '+(nomEnfant||'à '+act.titre.split('—')[0].trim())+' ?');
  const maj=()=>{
    document.querySelectorAll('#ac-qui [data-q]').forEach(b=>
      b.classList.toggle('actif',b.dataset.q===choix));
    document.querySelectorAll('#ac-port [data-t]').forEach(b=>
      b.classList.toggle('actif',(b.dataset.t==='1')===pourToujours));
  };
  document.getElementById('dbd').innerHTML=`
    <p class="discret2" style="margin-bottom:12px">${echap(act.titre.split('—')[0].trim())} · ${DFR[jSem(d)-1].toLowerCase()} ${d.getDate()} ${MFR[d.getMonth()].toLowerCase()}</p>
    <div class="mg-chips" id="ac-qui">
      ${accompagnateurs().chips.map(p=>`<button type="button" class="mg-chip" data-q="${attr(p.nom)}">${p.emoji||'🧑'} ${echap(p.nom)}</button>`).join('')}
      <button type="button" class="mg-chip" data-q="">on verra</button>
    </div>
    ${accompagnateurs().menu.length?`<select id="ac-autre" style="margin-top:8px">
      <option value="">Quelqu'un d'autre…</option>
      ${accompagnateurs().menu.map(p=>`<option value="${attr(p.nom)}">${echap(p.nom)}${roleAffiche(p)?' · '+echap(roleAffiche(p)):''}</option>`).join('')}
    </select>`:''}
    <label class="lbl" style="margin-top:16px">C'est pour…</label>
    <div class="mg-chips" id="ac-port">
      <button type="button" class="mg-chip" data-t="0">cette fois</button>
      <button type="button" class="mg-chip" data-t="1">toutes les fois</button>
    </div>
    <p class="discret2" style="margin-top:9px">« Cette fois » ne touche pas à l'habitude : la prochaine fois, ${echap(act.accompagne||'personne')} reprend.</p>
    <button class="btn primaire" id="ac-ok" style="width:100%;margin-top:16px">C'est noté</button>`;
  maj();
  const acAutre=document.getElementById('ac-autre');
  document.querySelectorAll('#ac-qui [data-q]').forEach(b=>{b.onclick=()=>{
    choix=b.dataset.q;if(acAutre)acAutre.value='';maj();
  }});
  if(acAutre)acAutre.onchange=()=>{
    if(!acAutre.value)return;
    choix=acAutre.value;
    document.querySelectorAll('#ac-qui [data-q]').forEach(b=>b.classList.remove('actif'));
  };
  document.querySelectorAll('#ac-port [data-t]').forEach(b=>{b.onclick=()=>{pourToujours=b.dataset.t==='1';maj()}});
  document.getElementById('ac-ok').onclick=()=>{
    poserAccompagnateur(act,d,choix,pourToujours);
    toast(choix?(pourToujours?'C\'est l\'habitude maintenant ✔':'C\'est noté pour cette fois ✔'):'On verra 🙂');
    render();
    ouvrirJour(d);   // on revient sur la journée qu'on regardait
  };
}
/* Le corps de « Ta journée ». Sert deux fois : dans le tiroir quand on
   ouvre un jour du calendrier, et en pleine page sur l'onglet Planning. */
function corpsJournee(d,pleinePage){
  const sJ=iso(d),sAuj=iso(new Date());
  const v=enVacances(d),f=ferie(d);
  const items=elementsJour(d);

  // Ce qui est derrière nous : tout un jour passé, rien un jour futur,
  // et l'heure qui tranche pour aujourd'hui.
  const mnt=new Date().getHours()*60+new Date().getMinutes();
  const estPasse=(it)=>{
    if(sJ<sAuj)return true;
    if(sJ>sAuj)return false;
    if(!it.h)return false;
    return minutes(it.fin||it.h)<mnt;
  };
  const etats=items.map(estPasse);
  const dernierPasse=etats.lastIndexOf(true);
  const montrerMaintenant=(sJ===sAuj)&&dernierPasse>=0&&dernierPasse<items.length-1;

  let h='';
  const ctx=[f?'🇫🇷 '+echap(f):'',v?'☀️ '+echap(v.nom):''].filter(Boolean).join(' · ');
  if(ctx)h+=`<div class="tj-ctx">${ctx}${v?` <span data-modif-vac="${v.id}" style="cursor:pointer;opacity:.55" title="Modifier cette période">✏️</span>`:''}</div>`;

  // ---- La chronologie ----
  if(items.length){
    h+=`<div class="tj-sect">Au programme<span class="tj-n">${items.length}</span></div>`;
    items.forEach((it,i)=>{
      const cls=[ 'tj-li',
        i===0?'tj-premier':'', i===items.length-1?'tj-dernier':'',
        it.recur?'tj-rec':'', it.annulee?'tj-annulee':'',
        (i<=dernierPasse)?'tj-plein':'' ].filter(Boolean).join(' ');
      const pa=['tj-pa',it.recur?'tj-rec':'',etats[i]?'tj-passe':''].filter(Boolean).join(' ');
      h+=`<div class="${cls}" data-detail="${it.id}">
        <div class="tj-rail"><span class="${pa}"></span></div>
        <div class="tj-co"><div class="tj-ti">${echap(it.titre)}</div>
          ${it.sous?`<div class="tj-su">${echap(it.sous)}</div>`:''}
          ${it.type==='act'?pastilleAccomp(it.id,d):''}</div>
        ${etiquettePersonne(it.qui)}</div>`;
      if(montrerMaintenant&&i===dernierPasse){
        h+=`<div class="tj-mnt"><div class="tj-rail"><span class="tj-pt"></span></div>
          <span class="tj-lb">${p2(new Date().getHours())}:${p2(new Date().getMinutes())} · maintenant</span></div>`;
      }
    });
  }else{
    h+=`<div class="tj-vide">Rien de prévu ce jour-là 🌿</div>`;
  }

  // ---- Les tâches, rangées par personne ----
  const vus=new Set();
  const taches=[];
  toutesTaches().forEach(t=>{if(t.ech===sJ&&!vus.has(t.id)){vus.add(t.id);taches.push(t)}});
  /* Les tâches rattachées à un élément du jour — « acheter le cadeau » sur un
     anniversaire — méritent d'apparaître même si leur échéance est passée.
     Mais pas celles qui visent l'an prochain : un anniversaire porte aussi la
     tâche de l'année suivante, et on voyait « (11 ans) » et « (12 ans) » l'un
     sous l'autre le même jour. */
  items.forEach(it=>tachesLiees(it.id).forEach(t=>{
    if(t.ech&&t.ech>sJ)return;
    if(!vus.has(t.id)){vus.add(t.id);taches.push(t)}
  }));
  if(taches.length){
    const moi=String(UTILISATEUR||'').trim().toLowerCase();
    const membres=(CACHE.membres||[]).slice()
      .sort((a,b)=>(String(a).trim().toLowerCase()===moi?-1:0)-(String(b).trim().toLowerCase()===moi?-1:0));
    const groupes=[];
    const pris=new Set();
    membres.forEach(m=>{
      const bas=String(m).trim().toLowerCase();
      const lot=taches.filter(t=>{const q=String(t.qui||'').trim().toLowerCase();
        return q&&(q===bas||q.includes(bas))&&!pris.has(t.id)});
      lot.forEach(t=>pris.add(t.id));
      if(lot.length)groupes.push({nom:bas===moi?'Toi':String(m).trim(),lot,aMoi:bas===moi});
    });
    const reste=taches.filter(t=>!pris.has(t.id)&&String(t.qui||'').trim());
    if(reste.length)groupes.push({nom:'Autres',lot:reste,aMoi:false});
    const libres=taches.filter(t=>!String(t.qui||'').trim());
    if(libres.length)groupes.push({nom:'À prendre',lot:libres,aMoi:false,libre:true});
    groupes.forEach(g=>{
      const faites=g.lot.filter(t=>estFaite(t.id)).length;
      h+=`<div class="tj-sect">${echap(g.nom)}<span class="tj-n">${g.libre?g.lot.length:faites+' sur '+g.lot.length}</span></div>`;
      g.lot.forEach(t=>{
        const fa=estFaite(t.id);
        h+=`<div class="tj-t ${fa?'tj-faite':''} ${g.aMoi?'':'tj-autre'}">
          <span class="tj-cb ${fa?'on':''}" data-coche="${t.id}"></span>
          <span class="tj-tt" data-ouvrir-tache="${t.id}">${echap(t.texte)}</span></div>`;
      });
    });
  }

  // Les traitements du jour : une case par prise, comme dans la fiche santé
  const doses=dosesDuJour(d);
  if(doses.length){
    const restantes=doses.filter(x=>!x.faite).length;
    h+=`<div class="tj-sect">💊 Traitements<span class="tj-n">${doses.length-restantes} sur ${doses.length}</span></div>`;
    doses.forEach(x=>{
      const def=MOMENTS.find(m=>m[0]===x.moment)||[x.moment,'💊',x.moment];
      h+=`<div class="tj-t ${x.faite?'tj-faite':''}">
        <span class="tj-cb ${x.faite?'on':''}" data-dosej="${x.trait.id}|${x.moment}"></span>
        <span class="tj-tt">${def[1]} ${echap(x.trait.medicament)}${x.trait.dose?' '+echap(x.trait.dose):''}
          <span class="tj-su">· ${echap(x.profil.nom)} · ${def[2]}</span></span></div>`;
    });
  }
  if(sJ===sAuj){
    const rtd=tachesEnRetard();
    if(rtd.length)h+=`<div class="tj-retard" data-voir-todo="1">🚨 ${rtd.length} tâche${rtd.length>1?'s':''} en retard — voir la to-do ›</div>`;
  }
  h+=`<div style="display:flex;gap:8px;margin-top:18px">
    <button class="btn primaire" style="flex:1" data-ajout-ici="1">＋ Ajouter ${pleinePage?'aujourd\'hui':'ce jour-là'}</button>
    ${boutonPartage(pleinePage?'tj-part-p':'tj-part','Envoyer')}
  </div>`;
  return h;
}

/* Le câblage de « Ta journée ». `rafraichir` dit comment se redessiner :
   le tiroir se rouvre, la pleine page se re-rend. */
function brancherJournee2(corps,d,rafraichir){
  corps.querySelectorAll('[data-detail]').forEach(el=>{
    el.onclick=()=>detailJour(el.dataset.detail,d);
  });
  corps.querySelectorAll('[id^="tj-part"]').forEach(btp=>{
    btp.onclick=(ev)=>{ev.stopPropagation();partager(texteJournee(d),'La journée')};
  });
  corps.querySelectorAll('[data-acc]').forEach(el=>{
    el.onclick=(ev)=>{ev.stopPropagation();choisirAccompagnateur(el.dataset.acc,el.dataset.accj)};
  });
  corps.querySelectorAll('[data-coche]').forEach(el=>{
    el.onclick=(ev)=>{ev.stopPropagation();basculerFaite(el.dataset.coche);rafraichir()};
  });
  corps.querySelectorAll('[data-dosej]').forEach(el=>{
    el.onclick=(ev)=>{ev.stopPropagation();const [id,m]=el.dataset.dosej.split('|');
      basculerPrise(id,iso(d),m);rafraichir()};
  });
  corps.querySelectorAll('[data-ouvrir-tache]').forEach(el=>{
    el.onclick=()=>{const id=el.dataset.ouvrirTache;
      if(id.startsWith('auto-'))toast('Cette action est générée automatiquement 🙂');else formTache(id)};
  });
  corps.querySelectorAll('[data-modif-vac]').forEach(b=>{b.onclick=(ev)=>{ev.stopPropagation();formVac(b.dataset.modifVac)}});
  const rt=corps.querySelector('[data-voir-todo]');
  if(rt)rt.onclick=()=>{fermerTiroir();setSection('todo')};
  const aj=corps.querySelector('[data-ajout-ici]');
  if(aj)aj.onclick=()=>ouvrirAjout(iso(d));
}

function ouvrirJour(d){
  jourOuvert=d;
  ouvrirTiroirBrut(DFR[jSem(d)-1]+' '+d.getDate()+' '+MFR[d.getMonth()]+' '+d.getFullYear());
  const corps=document.getElementById('dbd');
  corps.innerHTML=corpsJournee(d,false);
  brancherJournee2(corps,d,()=>{render();ouvrirJour(d)});
}

/* Le détail d'un élément : tout ce qu'on peut en faire, au même endroit */
function detailJour(id,d){
  const o=trouverParId(id);
  if(!o){ouvrirJour(d);return}
  const est=(t)=>lesEvts().some(x=>x.id===id)?t==='evt':lesBdays().some(x=>x.id===id)?t==='bday':t==='act';
  const type=lesEvts().some(x=>x.id===id)?'evt':lesBdays().some(x=>x.id===id)?'bday':'act';
  ouvrirTiroirBrut(DFR[jSem(d)-1]+' '+d.getDate()+' '+MFR[d.getMonth()]);
  const corps=document.getElementById('dbd');
  const annulee=(o.annulations||[]).includes(iso(d));
  let det='',qui=o.qui||'';
  if(type==='evt'){
    const multi=o.fin&&o.fin!==o.debut;
    det=[o.heure||'',multi?'du '+deIso(o.debut).getDate()+' au '+deIso(o.fin).getDate()+' '+MFR[deIso(o.fin).getMonth()].toLowerCase():''].filter(Boolean).join(' · ');
  }else if(type==='act'){
    det=(o.hd||'')+(o.hf?' → '+o.hf:'')+(o.lieu?' · 📍 '+o.lieu:'');
  }
  const liees=tachesLiees(id);
  let h=`<div class="tj-retour" data-retour="1">← ${DFR[jSem(d)-1].toLowerCase()} ${d.getDate()} ${MFR[d.getMonth()].toLowerCase()}</div>
    <div class="de" style="border-left-color:${type==='bday'?coul('bday'):type==='act'?coul(o.cat):coulEvt(o)}">
      <div class="evtit">${echap(type==='bday'?o.titre:o.titre)}</div>
      ${det?`<div class="evt">${echap(det)}</div>`:''}
      ${qui?`<div class="evwho">${echap(qui)}</div>`:''}
      ${o.detail?`<div class="evdetail">${o.detail}</div>`:''}
    </div>`;
  if(type==='bday'){
    const idees=cadeauxVisibles().filter(c=>!c.offert&&c.personne&&c.personne.trim().toLowerCase()===String(o.nom||'').trim().toLowerCase());
    if(idees.length)h+=`<p class="discret2">🎁 Idées notées : ${idees.map(i=>echap(i.idee)).join(' · ')}</p>`;
  }
  if(liees.length){
    h+='<div class="tj-sect">Actions liées</div>';
    liees.forEach(t=>{
      const fa=estFaite(t.id);
      h+=`<div class="tj-t ${fa?'tj-faite':''}">
        <span class="tj-cb ${fa?'on':''}" data-coche="${t.id}"></span>
        <span class="tj-tt">${echap(t.texte)}${t.dateTexte?` <span class="tj-su">${echap(t.dateTexte)}</span>`:''}</span></div>`;
    });
  }
  h+=`<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:16px">
    <button class="btn" data-modif="1">✏️ Modifier</button>
    <button class="btn" data-lier="1">＋ Action liée</button>
    ${type==='act'?`<button class="btn" data-annule="1">${annulee?'↩️ Rétablir ce jour':'🚫 Annuler ce jour'}</button>
      <button class="btn" data-pause="1">⏸ Suspendre</button>`:''}
    <button class="btn danger" data-suppr="1">🗑️ Supprimer</button>
  </div>`;
  corps.innerHTML=h;
  corps.querySelector('[data-retour]').onclick=()=>ouvrirJour(d);
  corps.querySelector('[data-modif]').onclick=()=>{
    if(type==='evt')formEvt(id,null);else if(type==='bday')formBday(id);else formAct(id);
  };
  corps.querySelector('[data-lier]').onclick=()=>formTache(null,id);
  corps.querySelectorAll('[data-coche]').forEach(el=>{
    el.onclick=()=>{basculerFaite(el.dataset.coche);render();detailJour(id,d)};
  });
  const an=corps.querySelector('[data-annule]');
  if(an)an.onclick=()=>{
    const list=[...(o.annulations||[])];
    const i=list.indexOf(iso(d));
    if(i>=0){list.splice(i,1);toast('Séance rétablie')}else{list.push(iso(d));toast('Séance annulée ce jour')}
    enregistrerObjet(id,'acts',{annulations:list});render();ouvrirJour(d);
  };
  const pz=corps.querySelector('[data-pause]');
  if(pz)pz.onclick=()=>formPause(id,d);
  corps.querySelector('[data-suppr]').onclick=()=>{
    if(!confirm('Supprimer ?'))return;
    supprimerObjet(id);toast('Supprimé');render();ouvrirJour(d);
  };
}

function apresEnregistrement(msg){
  toast(msg+' ✔');
  render();
  jourOuvert?ouvrirJour(jourOuvert):fermerTiroir();

const attr=(v)=>echap(v??'').replace(/"/g,'&quot;');
// Quand on choisit la date de début, la date de fin s'aligne dessus
function lierDates(idDeb,idFin){
  const d=document.getElementById(idDeb),fi=document.getElementById(idFin);
  if(!d||!fi)return;
  d.addEventListener('change',()=>{
    if(!d.value)return;
    fi.min=d.value;
    if(!fi.value||fi.value<d.value)fi.value=d.value;
  });
}

/* ---------- Formulaire événement ---------- */
/* Qui est concerné : une liste, pas une personne. Un événement de famille
   en réunit plusieurs, et c'est justement ce qui décide de la suite —
   si ce ne sont que des enfants, quelqu'un doit les y emmener. */
function listeQui(e){
  const foyer=(CACHE.personnes||[]).filter(p=>p.foyer).map(p=>p.nom);
  if(Array.isArray(e?.qui_liste)&&e.qui_liste.length)return e.qui_liste.filter(n=>foyer.includes(n));
  const v=String(e?.qui||'').trim();
  if(!v)return [];
  if(/^toute la famille$/i.test(v))return foyer;
  // Les anciennes valeurs sont du texte libre : on récupère ce qu'on reconnaît.
  return v.split(/[,+]/).map(x=>x.trim()).filter(n=>foyer.includes(n));
}

function formEvt(id,datePre){
  const e=id?trouverParId(id):null;
  ouvrirTiroirBrut(e?'Modifier l\'événement':'Nouvel événement');
  const corps=document.getElementById('dbd');
  const cats=[['event','📌 Événement'],['voyage','✈️ Voyage'],['pro','💼 Absence / déplacement'],['rentree','🎒 Rentrée']];
  const rang=n=>{const i=(CACHE.membres||[]).indexOf(n);return i<0?99:i};
  const foyer=(CACHE.personnes||[]).filter(p=>p.foyer).sort((a,b)=>rang(a.nom)-rang(b.nom));
  const quiSel=new Set(listeQui(e));
  let accomp=e?.accompagne||'',accompR=e?.accompagne_retour||'';
  const acc=accompagnateurs();
  const b=boutonsForm(()=>{
    const titre=document.getElementById('f-titre').value.trim();
    const debut=document.getElementById('f-debut').value;
    if(!titre||!debut){toast('Titre et date obligatoires');return}
    let detail=document.getElementById('f-detail').value.trim();
    if(detail&&!/<a /.test(detail))detail=detail.replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank">$1</a>');
    const liste=foyer.map(p=>p.nom).filter(n=>quiSel.has(n));   // toujours dans l'ordre de la maison
    // `qui` reste lisible pour tout ce qui l'affiche déjà ; `qui_liste` est
    // la vérité, celle sur laquelle on raisonne.
    const tous=foyer.length>0&&liste.length===foyer.length;
    enregistrerObjet(id,'evts',{
      titre,cat:document.getElementById('f-cat').value,debut,
      fin:document.getElementById('f-fin').value||'',
      heure:document.getElementById('f-heure').value.trim()||'',
      qui:tous?'Toute la famille':liste.join(', '),
      qui_liste:liste.length?liste:null,
      accompagne:enfantsSeuls()?(accomp||null):null,
      accompagne_retour:enfantsSeuls()?(accompR||null):null,
      detail:detail||''});
    apresEnregistrement(e?'Événement modifié':'Événement ajouté');
  });
  const pastilles=(idp,val)=>
    acc.chips.map(p=>`<button type="button" class="mg-chip ${val===p.nom?'actif':''}" data-${idp}="${attr(p.nom)}">${p.emoji||'🧑'} ${echap(p.nom)}</button>`).join('')+
    `<button type="button" class="mg-chip ${val?'':'actif'}" data-${idp}="">on verra</button>`;
  const menu=(idsel,val)=>acc.menu.length?`<select id="${idsel}" style="margin-top:7px">
      <option value="">Quelqu'un d'autre…</option>
      ${acc.menu.map(p=>`<option value="${attr(p.nom)}" ${val===p.nom?'selected':''}>${echap(p.nom)}${roleAffiche(p)?' · '+echap(roleAffiche(p)):''}</option>`).join('')}
    </select>`:'';

  corps.innerHTML=`
    <label>Titre</label><input type="text" id="f-titre" value="${attr(e?.titre)}" placeholder="🎉 Fête de l'école">
    <label>Type</label><select id="f-cat">${cats.map(c=>`<option value="${c[0]}" ${e?.cat===c[0]?'selected':''}>${c[1]}</option>`).join('')}</select>
    <div class="grille-form">
      <div><label>Date de début</label><input type="date" id="f-debut" value="${e?e.debut:(datePre||'')}"></div>
      <div><label>Date de fin (si plusieurs jours)</label><input type="date" id="f-fin" value="${e?.fin||''}"></div>
    </div>
    <label>Heure (optionnel)</label><input type="text" id="f-heure" value="${attr(e?.heure)}" placeholder="14:30">
    <label class="lbl">Qui est concerné ? <span class="discret2">(plusieurs possibles)</span></label>
    <div class="mg-chips" id="f-qui">
      <button type="button" class="mg-chip" data-tous="1">👪 Toute la famille</button>
      ${foyer.map(p=>`<button type="button" class="mg-chip" data-q="${attr(p.nom)}">${p.emoji||'🧑'} ${echap(p.nom)}</button>`).join('')}
    </div>
    <div id="f-logi" style="display:none">
      <label class="lbl">Qui les emmène ? <span class="discret2">(personne d'adulte n'est concerné par cet événement)</span></label>
      <div class="mg-chips" id="f-acc">${pastilles('a',accomp)}</div>
      ${menu('f-acc-autre',accomp)}
      <div id="f-retour-lien" style="margin-top:7px"><button type="button" class="fp-changer" id="f-retour-ouvre">et au retour, c'est quelqu'un d'autre ?</button></div>
      <div id="f-retour" style="display:none">
        <label class="lbl">Qui les récupère ?</label>
        <div class="mg-chips" id="f-accr">${pastilles('r',accompR)}</div>
        ${menu('f-accr-autre',accompR)}
      </div>
    </div>
    <label>Détails (optionnel — les liens deviennent cliquables)</label>
    <textarea id="f-detail">${echap(e?.detail??'')}</textarea>
    ${b.html}`;

  function enfantsSeuls(){
    if(!quiSel.size)return false;
    return [...quiSel].every(n=>{const p=foyer.find(x=>x.nom===n);return p&&!estAdulte(p)});
  }
  function majQui(){
    const tous=foyer.length>0&&foyer.every(p=>quiSel.has(p.nom));
    document.querySelectorAll('#f-qui [data-q]').forEach(x=>x.classList.toggle('actif',quiSel.has(x.dataset.q)));
    document.querySelector('#f-qui [data-tous]').classList.toggle('actif',tous);
    document.getElementById('f-logi').style.display=enfantsSeuls()?'':'none';
  }
  document.querySelectorAll('#f-qui [data-q]').forEach(bt=>{bt.onclick=()=>{
    if(quiSel.has(bt.dataset.q))quiSel.delete(bt.dataset.q);else quiSel.add(bt.dataset.q);
    majQui();
  }});
  document.querySelector('#f-qui [data-tous]').onclick=()=>{
    const tous=foyer.every(p=>quiSel.has(p.nom));
    quiSel.clear();
    if(!tous)foyer.forEach(p=>quiSel.add(p.nom));   // retaper dessus décoche tout
    majQui();
  };
  // Les deux sélecteurs d'accompagnateur se câblent pareil : pastilles et menu
  // se désignent l'un l'autre, pour qu'un seul choix soit visible à la fois.
  const brancher=(zone,idsel,lire,ecrire)=>{
    const ch=document.getElementById(idsel);
    document.querySelectorAll(`#${zone} [data-${lire}]`).forEach(bt=>{bt.onclick=()=>{
      ecrire(bt.dataset[lire]);
      document.querySelectorAll(`#${zone} .mg-chip`).forEach(x=>x.classList.toggle('actif',x===bt));
      if(ch)ch.value='';
    }});
    if(ch)ch.onchange=()=>{
      if(!ch.value)return;
      ecrire(ch.value);
      document.querySelectorAll(`#${zone} .mg-chip`).forEach(x=>x.classList.remove('actif'));
    };
  };
  brancher('f-acc','f-acc-autre','a',v=>{accomp=v});
  brancher('f-accr','f-accr-autre','r',v=>{accompR=v});
  document.getElementById('f-retour-ouvre').onclick=()=>{
    document.getElementById('f-retour').style.display='';
    document.getElementById('f-retour-lien').style.display='none';
  };
  if(accompR)document.getElementById('f-retour-ouvre').onclick();
  majQui();
  b.wire();
  lierDates('f-debut','f-fin');
}

    <input type="text" id="fp-role" value="${p?echap(p.role||''):''}" placeholder="ma sœur">
    <div class="fp-echo" id="fp-echo"></div>
    <div id="fp-chips" style="display:none">
      <div class="mg-chips" id="fp-cats" style="margin-top:6px">${cats.map(c=>`<button class="mg-chip" data-cat="${attr(c)}">${emojiCat(c)} ${echap(c)}</button>`).join('')}</div>
      <input type="text" id="fp-cat-libre" placeholder="ou un autre mot…" style="margin-top:7px">
    </div>
    <label class="lbl">Son icône <span class="discret2">(facultatif)</span></label>
    <div class="mg-chips" id="fp-emos">${EMOJIS_GENS.map(e=>`<button class="mg-chip ${emoji===e?'actif':''}" data-emo="${e}" style="font-size:1.1rem">${e}</button>`).join('')}</div>
    <label class="lbl">Anniversaire <span class="discret2">(facultatif — laisse vide si tu ne le connais pas)</span></label>
    <div class="grille-form">
      <div><label>Jour</label><input type="number" id="fp-jour" min="1" max="31" value="${p&&p.naiss_jour?p.naiss_jour:(dPre?dPre.getDate():'')}"></div>
      <div><label>Mois</label><select id="fp-mois"><option value="">—</option>${MFR.map((mo,i)=>`<option value="${i+1}" ${(p&&p.naiss_mois?p.naiss_mois:(dPre?dPre.getMonth()+1:0))===i+1?'selected':''}>${mo}</option>`).join('')}</select></div>
    </div>
    <label class="lbl">Année de naissance <span class="discret2">(pour afficher l'âge)</span></label>
    <input type="number" id="fp-annee" value="${p&&p.naiss_annee?p.naiss_annee:''}" placeholder="1987">
    <label class="check-ligne"><input type="checkbox" id="fp-cadeau" ${p&&p.cadeau?'checked':''}> 🎁 Prévoir un cadeau — une action « Acheter le cadeau » une semaine avant</label>
    <button class="btn primaire" id="fp-ok" style="width:100%;margin-top:14px">${p?'Enregistrer':'Ajouter'}</button>
    ${p?`<button class="btn danger" id="fp-suppr" style="width:100%;margin-top:8px">Tout effacer</button>`:''}`;

  // ↳ la petite ligne qui dit ce que j'ai compris — et permet de me corriger
  const majChips=()=>{
    document.getElementById('fp-chips').style.display=chipsOuverts?'':'none';
    document.querySelectorAll('#fp-cats .mg-chip').forEach(x=>
      x.classList.toggle('actif',x.dataset.cat.toLowerCase()===String(categorie||'').trim().toLowerCase()&&!!String(categorie||'').trim()));
  };
  const majEcho=()=>{
    const e=document.getElementById('fp-echo');
    const v=String(categorie||'').trim();
    if(v)e.innerHTML=`↳ je la range avec <b>${emojiCat(v)} ${echap(v)}</b> · <button type="button" class="fp-changer" id="fp-changer">changer</button>`;
    else if(String(document.getElementById('fp-role').value||'').trim())
      e.innerHTML=`↳ je ne devine pas où la ranger · <button type="button" class="fp-changer" id="fp-changer">choisir</button>`;
    else e.innerHTML=`<button type="button" class="fp-changer" id="fp-changer" style="opacity:.7">la ranger quelque part ?</button>`;
    document.getElementById('fp-changer').onclick=()=>{chipsOuverts=!chipsOuverts;majChips()};
    majChips();
  };
  const chRole=document.getElementById('fp-role');
  chRole.addEventListener('input',()=>{
    if(!catManuel){
      const dev=devineCategorie({nom:document.getElementById('fp-nom').value,role:chRole.value});
      categorie=dev||(p&&p.categorie?p.categorie:'');
    }
    majEcho();
  });
  document.querySelectorAll('#fp-cats [data-cat]').forEach(b=>{b.onclick=()=>{
    const v=b.dataset.cat;
    categorie=(String(categorie||'').toLowerCase()===v.toLowerCase())?'':v;
    catManuel=!!categorie;
    document.getElementById('fp-cat-libre').value='';
    chipsOuverts=false;
    majEcho();
  }});
  const chLibre=document.getElementById('fp-cat-libre');
  chLibre.addEventListener('input',()=>{categorie=chLibre.value;catManuel=!!chLibre.value.trim();majChips()});
  chLibre.addEventListener('keydown',e=>{if(e.key==='Enter'){chipsOuverts=false;majEcho()}});
  majEcho();

  document.querySelectorAll('#fp-emos [data-emo]').forEach(b=>{b.onclick=()=>{
    emoji=(emoji===b.dataset.emo)?'':b.dataset.emo;
    document.querySelectorAll('#fp-emos .mg-chip').forEach(x=>x.classList.toggle('actif',x.dataset.emo===emoji));
  }});
  // Retaper sur le choix actif l'annule : on peut ne pas savoir, ou ne pas vouloir dire.
  document.querySelectorAll('#fp-genres [data-g]').forEach(b=>{b.onclick=()=>{
    genre=(genre===b.dataset.g)?'':b.dataset.g;
    document.querySelectorAll('#fp-genres .mg-chip').forEach(x=>x.classList.toggle('actif',x.dataset.g===genre));
  }});
  document.getElementById('fp-ok').onclick=()=>{
    const nom=document.getElementById('fp-nom').value.trim();
    if(!nom){toast('Il faut un prénom');return}
    if(!p){
      const deja=CACHE.personnes.find(x=>x.nom.trim().toLowerCase()===nom.toLowerCase());
      if(deja){fermerTiroir();persOuverte=deja.id;toast('On la connaît déjà 🙂');
        if(section==='memoire')renderMemoire();return}
    }
    const j=parseInt(document.getElementById('fp-jour').value)||null;
    const m=parseInt(document.getElementById('fp-mois').value)||null;
    const an=parseInt(document.getElementById('fp-annee').value)||null;
    const role=document.getElementById('fp-role').value.trim()||null;
    const l={nom,emoji:emoji||null,
      genre:genre||null,
      categorie:rangerCategorie(categorie),
      role,
      naiss_jour:(j&&m)?j:null,naiss_mois:(j&&m)?m:null,naiss_annee:(j&&m)?an:null,
      cadeau:document.getElementById('fp-cadeau').checked};
    // le rôle est écrit de MON point de vue : on retient qui l'a écrit
    if((role||'')!==(roleAvant||''))l.role_auteur=role?EMAIL_CONNECTE:null;
    if(!p){
      l.foyer=false;   // qui vit à la maison se décide dans ⚙️ Réglages
      l.id=genId();
      persOuverte=l.id;   // on ouvre sa page : autant noter tout de suite
    }
    enregistrerObjet(id,'personnes',l);
    apresEnregistrement(p?'C\'est noté ✔':'C\'est ajouté ✔');
  };
  const sup=document.getElementById('fp-suppr');
  if(sup)sup.onclick=()=>{
    const n=CACHE.notes.filter(x=>x.personne_id===id).length;
    if(!confirm('Tout effacer sur '+p.nom+(n?', y compris les '+n+' chose'+(n>1?'s':'')+' notée'+(n>1?'s':''):'')+' ?'))return;
    supprimerObjet(id);apresEnregistrement('C\'est effacé');
  };
}

/* ---------- Formulaire activité récurrente ---------- */
function formAct(id){
  const a=id?trouverParId(id):null;
  ouvrirTiroirBrut(a?'Modifier l\'activité':'Nouvelle activité récurrente');
  const corps=document.getElementById('dbd');
  /* Une seule question au lieu de deux. Le formulaire demandait « Pour qui ?
     (couleur) » dans un menu, puis « Qui ? (optionnel) » en texte libre —
     la même question posée deux fois, et on répondait « Darya » deux fois.
     On coche des personnes ; la couleur s'en déduit. */
  const rang=n=>{const i=(CACHE.membres||[]).indexOf(n);return i<0?99:i};
  const foyer=(CACHE.personnes||[]).filter(p=>p.foyer).sort((x,y)=>rang(x.nom)-rang(y.nom));
  const quiSel=new Set(listeQui({qui:a?.qui,qui_liste:a?.qui_liste}));
  let ecole=a?.cat==='school';
  const sel=new Set(a?a.jours:[]);
  let accomp=a&&a.accompagne?a.accompagne:'';
  /* La couleur : celle de la personne quand elle est seule, la couleur
     commune dès qu'ils sont plusieurs. Elle n'est plus choisie à la main. */
  const catDeQui=()=>{
    if(ecole)return 'school';
    const l=[...quiSel];
    if(l.length===1){
      const c=String(l[0]).trim().toLowerCase();
      return COULEURS[c]?c:'both';
    }
    return 'both';
  };
  const b=boutonsForm(()=>{
    const titre=document.getElementById('f-titre').value.trim();
    const hd=document.getElementById('f-hd').value.trim();
    if(!titre||!hd||sel.size===0){toast('Titre, heure de début et au moins un jour obligatoires');return}
    const liste=foyer.map(p=>p.nom).filter(n=>quiSel.has(n));
    enregistrerObjet(id,'acts',{
      titre,cat:catDeQui(),jours:[...sel].sort(),
      hd,hf:document.getElementById('f-hf').value.trim()||'',
      lieu:document.getElementById('f-lieu').value.trim()||'',
      accompagne:accomp,
      qui:ecole&&!liste.length?'École / crèche':liste.join(', ')});
    apresEnregistrement(a?'Activité modifiée':'Activité ajoutée');
  });
  corps.innerHTML=`
    <p style="font-size:.82rem;color:var(--ink-2)">💡 Apparaît chaque semaine automatiquement, sauf vacances scolaires et jours fériés.</p>
    <label>Titre</label><input type="text" id="f-titre" value="${attr(a?.titre)}" placeholder="Judo — Gymnase…">
    <label class="lbl">Pour qui ? <span class="discret2">(plusieurs possibles — ça donne la couleur)</span></label>
    <div class="mg-chips" id="f-qui">
      ${foyer.map(p=>`<button type="button" class="mg-chip ${quiSel.has(p.nom)?'actif':''}" data-q="${attr(p.nom)}">${p.emoji||'🧑'} ${echap(p.nom)}</button>`).join('')}
      <button type="button" class="mg-chip ${ecole?'actif':''}" data-ecole="1">🏫 École / crèche</button>
    </div>
    <label>Jours de la semaine</label>
    <div class="jours-picker" id="f-jours">${DS.map((j,i)=>`<span class="jp ${sel.has(i+1)?'on':''}" data-j="${i+1}">${j}</span>`).join('')}</div>
    <div class="grille-form">
      <div><label>Heure de début</label><input type="text" id="f-hd" value="${attr(a?.hd)}" placeholder="17:00"></div>
      <div><label>Heure de fin</label><input type="text" id="f-hf" value="${attr(a?.hf)}" placeholder="18:00"></div>
    </div>
    <div class="grille-form">
      <div><label>Lieu (optionnel)</label><input type="text" id="f-lieu" value="${attr(a?.lieu)}"></div>
    </div>
    <label class="lbl">Qui l'emmène ? <span class="discret2">(en général — tu pourras changer semaine par semaine)</span></label>
    <div class="mg-chips" id="f-accomp">
      ${accompagnateurs().chips.map(p=>`<button type="button" class="mg-chip ${accomp===p.nom?'actif':''}" data-a="${attr(p.nom)}">${p.emoji||'🧑'} ${echap(p.nom)}</button>`).join('')}
      <button type="button" class="mg-chip ${accomp?'':'actif'}" data-a="">on verra</button>
    </div>
    ${accompagnateurs().menu.length?`<select id="f-accomp-autre" style="margin-top:7px">
      <option value="">Quelqu'un d'autre…</option>
      ${accompagnateurs().menu.map(p=>`<option value="${attr(p.nom)}" ${accomp===p.nom?'selected':''}>${echap(p.nom)}${roleAffiche(p)?' · '+echap(roleAffiche(p)):''}</option>`).join('')}
    </select>`:''}
    ${b.html}`;
  const chAcc=document.getElementById('f-accomp-autre');
  document.querySelectorAll('#f-accomp [data-a]').forEach(bt=>{bt.onclick=()=>{
    accomp=bt.dataset.a;
    document.querySelectorAll('#f-accomp .mg-chip').forEach(x=>x.classList.toggle('actif',x===bt));
    if(chAcc)chAcc.value='';
  }});
  if(chAcc)chAcc.onchange=()=>{
    if(!chAcc.value)return;
    accomp=chAcc.value;
    document.querySelectorAll('#f-accomp .mg-chip').forEach(x=>x.classList.remove('actif'));
  };
  document.querySelectorAll('#f-qui [data-q]').forEach(bt=>{bt.onclick=()=>{
    if(quiSel.has(bt.dataset.q))quiSel.delete(bt.dataset.q);else quiSel.add(bt.dataset.q);
    if(quiSel.size)ecole=false;
    document.querySelectorAll('#f-qui [data-q]').forEach(x=>x.classList.toggle('actif',quiSel.has(x.dataset.q)));
    document.querySelector('#f-qui [data-ecole]').classList.toggle('actif',ecole);
  }});
  document.querySelector('#f-qui [data-ecole]').onclick=()=>{
    ecole=!ecole;
    if(ecole)quiSel.clear();
    document.querySelectorAll('#f-qui [data-q]').forEach(x=>x.classList.remove('actif'));
    document.querySelector('#f-qui [data-ecole]').classList.toggle('actif',ecole);
  };
  document.querySelectorAll('#f-jours .jp').forEach(p=>{
    p.onclick=()=>{const n=parseInt(p.dataset.j);if(sel.has(n)){sel.delete(n);p.classList.remove('on')}else{sel.add(n);p.classList.add('on')}};
  });
  b.wire();
}

/* ---------- Suspendre une activité sur une période ---------- */
function formPause(idAct,jourRetour){
  const a=trouverParId(idAct);
  ouvrirTiroirBrut('⏸ Suspendre « '+(a.titre.length>26?a.titre.substring(0,26)+'…':a.titre)+' »');
  const corps=document.getElementById('dbd');
  const pauses=a.pauses||[];
  let listeH='';
  if(pauses.length){
    listeH='<div class="dsec" style="margin-top:14px"><h3>Périodes de suspension en cours</h3>';
    pauses.forEach((p,i)=>{
      listeH+=`<div class="ligne-ev" style="border-top:none;padding:4px 0">
        <div class="corps">Du <strong>${deIso(p.debut).toLocaleDateString('fr-FR')}</strong> au <strong>${deIso(p.fin).toLocaleDateString('fr-FR')}</strong></div>
        <button class="btn mini danger" data-suppr-pause="${i}">Retirer</button></div>`;
    });
    listeH+='</div>';
  }
  corps.innerHTML=`
    <p style="font-size:.82rem;color:var(--ink-2)">L'activité disparaîtra du calendrier entre ces deux dates (piscine fermée, prof absent…).<br>
    💡 Pas besoin de suspendre pendant les vacances scolaires : c'est déjà automatique.</p>
    <div class="grille-form">
      <div><label>Du</label><input type="date" id="f-pdebut" value="${jourRetour?iso(jourRetour):''}"></div>
      <div><label>Au</label><input type="date" id="f-pfin"></div>
    </div>
    <div style="margin-top:16px;display:flex;gap:8px">
      <button class="btn primaire" id="f-psave" style="flex:1">Suspendre</button>
      <button class="btn" id="f-pcancel">Annuler</button>
    </div>
    ${listeH}`;
  document.getElementById('f-psave').onclick=()=>{
    const debut=document.getElementById('f-pdebut').value,fin=document.getElementById('f-pfin').value;
    if(!debut||!fin){toast('Les deux dates sont obligatoires');return}
    if(fin<debut){toast('La fin doit être après le début');return}
    enregistrerObjet(idAct,'acts',{pauses:[...pauses,{debut,fin}]});
    toast('Activité suspendue sur la période');
    render();
    jourRetour?ouvrirJour(jourRetour):fermerTiroir();
  };
  document.getElementById('f-pcancel').onclick=()=>{jourRetour?ouvrirJour(jourRetour):fermerTiroir()};
  lierDates('f-pdebut','f-pfin');
  corps.querySelectorAll('[data-suppr-pause]').forEach(b=>{b.onclick=()=>{
    const reste=pauses.filter((_,i)=>i!==parseInt(b.dataset.supprPause));
    enregistrerObjet(idAct,'acts',{pauses:reste});
    toast('Suspension retirée');
    render();formPause(idAct,jourRetour);
  }});
}

/* ---------- Formulaire tâche ---------- */
/* `ctx` sert quand la tâche naît ailleurs que dans la to do : depuis la
   fiche santé de quelqu'un, « Acheter le cadeau de… » en exemple et un
   menu de catégories n'ont aucun sens — on sait déjà où on est. */
function formTache(id,lienPre,projetPre,ctx){
  const c0=ctx||{};
  const t=id?trouverParId(id):null;
  ouvrirTiroirBrut(t?'Modifier la tâche':(c0.titre||'Nouvelle tâche'));
  const corps=document.getElementById('dbd');
  const reel=new Date();
  const finMois=t?.persistante?t.finY+'-'+String(t.finM).padStart(2,'0'):'';
  const lien=t?t.lien:lienPre;
  const projId=t?(t.projet_id||null):(projetPre||null);
  const proj=projId?(CACHE.projets||[]).find(x=>x.id===projId):null;
  const infoLiee=lien?trouverParId(lien):null;
  const b=boutonsForm(()=>{
    const texte=document.getElementById('f-texte').value.trim();
    if(!texte){toast('Le texte est obligatoire');return}
    const persistante=document.getElementById('f-persist').checked;
    const ech=document.getElementById('f-ech').value||null;
    // La ligne grise sous une tâche. On ne la demande plus : elle se calcule
    // à partir de la date. Les tâches fabriquées par l'app gardent la leur,
    // qui dit autre chose qu'une date — « 2 jours avant le départ ».
    let dateTexte=t?.dateTexte||'';
    const auto=t&&String(t.id||'').startsWith('auto-');
    if(!auto&&ech)dateTexte='Avant le '+deIso(ech).getDate()+' '+MFR[deIso(ech).getMonth()].toLowerCase();
    else if(!auto&&!ech)dateTexte='';
    const donnees={texte,cat:document.getElementById('f-cat').value,
      qui:document.getElementById('f-qui').value.trim()||'',ech,dateTexte,persistante,lien:lien||'',projet_id:projId};
    if(persistante){
      const fm=document.getElementById('f-fin').value;
      const [fy,fmm]=fm?fm.split('-').map(Number):[reel.getFullYear(),reel.getMonth()+1];
      donnees.debY=t?.debY??reel.getFullYear();donnees.debM=t?.debM??(reel.getMonth()+1);
      donnees.finY=fy;donnees.finM=fmm;donnees.y=null;donnees.m=null;
    }else{
      const base=ech?deIso(ech):(t?new Date(t.y,(t.m||1)-1,1):reel);
      donnees.y=base.getFullYear();donnees.m=base.getMonth()+1;
      donnees.debY=null;donnees.debM=null;donnees.finY=null;donnees.finM=null;
    }
    enregistrerObjet(id,'taches',donnees);
    if(projId&&projetOuvert===projId){fermerTiroir();toast(t?'C\'est noté ✔':'Étape ajoutée ✔');renderProjet();return}
    apresEnregistrement(t?'Tâche modifiée':'Tâche ajoutée');
  });
  corps.innerHTML=`
    ${proj?`<p style="font-size:.82rem;color:var(--ink-2)">${proj.emoji||'✨'} Étape de <strong>${echap(proj.nom)}</strong></p>`:''}
    ${infoLiee?`<p style="font-size:.82rem;color:var(--ink-2)">🔗 Action liée à <strong>${echap(infoLiee.titre||infoLiee.nom)}</strong> — elle apparaîtra chez elle et dans la to-do.</p>`:''}
    <label>Qu'est-ce qu'il faut faire ?</label>
    <input type="text" id="f-texte" value="${attr(t?.texte)}" placeholder="${attr(c0.exemple||'🎁 Acheter le cadeau de…')}">
    <div class="grille-form">
      <div><label>Échéance (optionnel)</label><input type="date" id="f-ech" value="${t?.ech||''}"></div>
      <div><label>Qui s'en occupe ?</label><select id="f-qui">${membresOptions(t?.qui)}</select></div>
    </div>
    ${(!t&&c0.cat)
      ? `<input type="hidden" id="f-cat" value="${attr(c0.cat)}">
         <p class="discret2" style="margin:2px 0 12px">Rangée dans ${echap(GROUPES[c0.cat]||'')} — parce qu'on est parti de là.</p>`
      : `<label>Catégorie</label>

function linkifie(t){const e=echap(t);return e.replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank">$1</a>')}

/* ---------- 🍽️ Les repas de la semaine ----------
   Une recette, c'est un nom et des ingrédients en texte libre — « 6 œufs »
   si tu veux, l'app ne cherche pas à comprendre. Tu dis « mardi, quiche » :
   les ingrédients partent dans les courses en gardant leur provenance. */
let ongletCourses='liste';    // 'liste' | 'repas'
let semaineRepas=0;           // décalage en semaines
function lundiDe(d){
  const x=deIso(iso(d));
  const j=(x.getDay()+6)%7;   // 0 = lundi
  x.setDate(x.getDate()-j);
  return x;
}
function menuDuJour(sJour){return (CACHE.menus||[]).find(m=>m.jour===sJour)||null}
function recetteDe(id){return (CACHE.recettes||[]).find(r=>r.id===id)||null}
/* Poser un repas : les ingrédients rejoignent la liste, en gardant d'où ils viennent. */
/* `garder` : les lignes d'ingrédients qu'on veut vraiment acheter. Absent =
   tout. C'est ce qui permet de dire « le beurre, je l'ai » sans toucher à la
   recette : elle garde ses ingrédients, c'est la liste qui n'en prend que
   ce qui manque. */
function poserMenu(sJour,recetteId,texte,garder){
  const id='menu-'+sJour;
  const avant=menuDuJour(sJour);
  if(avant)retirerIngredients(sJour);
  const l={id,jour:sJour,recette_id:recetteId||null,texte:texte||null,ajoute_par:UTILISATEUR||null};
  const i=(CACHE.menus||[]).findIndex(m=>m.id===id);
  if(i>=0){CACHE.menus[i]={...CACHE.menus[i],...l};pousser(sb.from('menus').update(l).eq('id',id))}
  else{CACHE.menus.push(l);pousser(sb.from('menus').insert(l))}
  const r=recetteId?recetteDe(recetteId):null;
  const retenus=(r?(r.ingredients||[]):[]).map(x=>String(x||'').trim()).filter(Boolean)
    .filter((t,i)=>!garder||garder.includes(i));
  retenus.forEach(t=>{
    enregistrerObjet(null,'courses',{texte:t,coche:false,achete_le:null,
      recette_id:r.id,pour_le:sJour});
  });
  return retenus.length;
}
/* Enlever un repas : on ne retire QUE ce qui n'a pas encore été acheté ni coché. */
function retirerIngredients(sJour){
  const aJeter=CACHE.courses.filter(c=>c.pour_le===sJour&&c.recette_id&&!c.coche&&!c.achete_le);
  aJeter.forEach(c=>supprimerObjet(c.id));
  return aJeter.length;
}
function enleverMenu(sJour){
  const n=retirerIngredients(sJour);
  const id='menu-'+sJour;
  const i=(CACHE.menus||[]).findIndex(m=>m.id===id);
  if(i>=0){CACHE.menus.splice(i,1);pousser(sb.from('menus').delete().eq('id',id))}
  return n;
}

/* Deux listes, un drapeau. « Du lait » et « des T-shirts pour Darya » ne
   s'achètent pas au même endroit. L'urgence, elle, ne dit pas OÙ mais QUAND :
   elle traverse les deux listes, donc l'article reste chez lui — simplement
   tout en haut. En faire un troisième tas le ferait disparaître du magasin
   où il faut justement l'acheter. */
let courseOu='super';        // 'super' | 'ailleurs' — où va ce qu'on tape
let courseUrgent=false;
let courseMagasin='';

/* ---------- Lire une quantité ----------
   « 20 cl de crème » → 20 · cl · crème. « 6 œufs » → 6 · rien · œufs.
   « une pincée de sel » → on ne comprend pas, et on ne devine pas : la ligne
   reste telle quelle. Mieux vaut deux lignes justes qu'une somme fausse. */
const UNITES=[
  ['kg','kg'],['mg','mg'],['g','g'],
  ['ml','ml'],['cl','cl'],['dl','dl'],['l','L'],
  // On écrit les formes longues AVANT les abréviations : sinon « c. à s »
  // avale le début de « c. à soupe » et la ligne n'est plus comprise.
  ["cuill(?:è|e)res?\\s*(?:à|a)\\s*soupe|c\\.?\\s*(?:à|a)\\s*\\.?\\s*soupe|c\\.?à\\.?s\\.?|càs|cas",'c. à soupe'],
  ["cuill(?:è|e)res?\\s*(?:à|a)\\s*caf(?:é|e)|c\\.?\\s*(?:à|a)\\s*\\.?\\s*caf(?:é|e)|c\\.?à\\.?c\\.?|càc|cac",'c. à café'],
  ['pinc(?:ée|ee)s?','pincée'],['gousses?','gousse'],['tranches?','tranche'],
  ['sachets?','sachet'],['bo(?:î|i)tes?','boîte'],['bottes?','botte'],
  ['brins?','brin'],['feuilles?','feuille'],['pots?','pot'],
  ['barquettes?','barquette'],['paquets?','paquet'],['bouquets?','bouquet'],
  ['tasses?','tasse'],['verres?','verre'],['pav(?:é|e)s?','pavé'],['filets?','filet'],
];
const MOTS_NOMBRE={un:1,une:1,deux:2,trois:3,quatre:4,cinq:5,six:6,sept:7,huit:8,
  neuf:9,dix:10,onze:11,douze:12,demi:0.5,demie:0.5,'demi-':0.5};
function lireNombre(x){
  const t=String(x).replace(',','.').replace(/\s/g,'');
  const f=t.match(/^(\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/);
  if(f)return Number(f[1])/Number(f[2]);
  const n=Number(t);
  return isFinite(n)?n:null;
}
function litIngredient(txt){
  const s=String(txt||'').trim();
  let m=s.match(/^(\d+(?:[.,]\d+)?(?:\s*\/\s*\d+)?)\s+?(.*)$/);
  let q=m?lireNombre(m[1]):null;
  if(!m){
    const mm=s.match(/^(\p{L}+)\s+(.*)$/u);
    const v=mm?MOTS_NOMBRE[mm[1].toLowerCase()]:undefined;
    if(v===undefined)return {q:null,u:null,nom:s};
    q=v;m=[null,mm[1],mm[2]];
  }
  let reste=String(m[2]||'').trim();
  let u=null;
  for(const [re,lib] of UNITES){
    const mm=reste.match(new RegExp('^(?:'+re+')\\.?(?:\\s|$)','i'));
    if(mm){u=lib;reste=reste.slice(mm[0].length).trim();break}
  }
  reste=reste.replace(/^(?:de\s+|d')/i,'').trim();
  if(q===null||!reste)return {q:null,u:null,nom:s};
  return {q,u,nom:reste};
}
/* La clé de regroupement : sans accents, sans pluriel, sans ponctuation.
   « Œufs » et « oeuf » sont le même rayon. */
function cleIngredient(n){
  return String(n||'').toLowerCase().replace(/œ/g,'oe').replace(/æ/g,'ae')
    .normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()
    // Le pluriel se met sur CHAQUE mot, pas seulement le dernier :
    // « pommes de terre » et « pomme de terre » sont le même légume.
    .split(' ').map(m=>m.replace(/(s|x)$/,'')).join(' ');
}
function fmtQuantite(n){
  if(n===null||n===undefined)return '';
  const r=Math.round(n*100)/100;
  return Number.isInteger(r)?String(r):String(r).replace('.',',');
}
/* « 3 pincée de sel » sonne faux. Les unités de mesure ne prennent pas la
   marque du pluriel (200 g, 20 cl), les autres si. */
const METRIQUES=/^(g|kg|mg|ml|cl|dl|L)$/;
function unitePluriel(u,q){
  if(!u||q===null||q<=1)return u;
  return (METRIQUES.test(u)||u.includes('.'))?u:u+'s';
}
const deDevant=n=>/^[aeiouyéèêàâîïôûh]/i.test(String(n||''))?"d'"+n:'de '+n;

/* Regrouper ce qui est le même ingrédient dans la même unité. Deux unités
   différentes pour le même produit — 200 g de beurre et 2 c. à soupe — ne
   s'additionnent pas : on les laisse côte à côte. */
function grouperCourses(l){
  const par=new Map();
  l.forEach(c=>{
    const p=litIngredient(c.texte);
    const cle=cleIngredient(p.nom);
    const k=cle?('i|'+cle+'|'+(p.u||'')):('seul|'+c.id);
    if(!par.has(k))par.set(k,[]);
    par.get(k).push({c,p});
  });
  return [...par.values()].map(g=>{
    if(g.length===1)return {items:[g[0].c],texte:g[0].c.texte,urgent:!!g[0].c.urgent};
    const qs=g.map(x=>x.p.q).filter(x=>x!==null&&x!==undefined);
    const u=g[0].p.u,nom=g[0].p.nom;
    const somme=qs.length===g.length?qs.reduce((a,b)=>a+b,0):null;
    // Si une seule ligne n'était pas chiffrée, on ne prétend pas savoir
    // combien il en faut : on montre le nom, et les sources disent le reste.
    const texte=somme===null?nom
      :(u?`${fmtQuantite(somme)} ${unitePluriel(u,somme)} ${deDevant(nom)}`:`${fmtQuantite(somme)} ${nom}`);
    return {items:g.map(x=>x.c),texte,urgent:g.some(x=>x.c.urgent)};
  });
}
/* D'où viennent ces lignes : « pour 🥧 Quiche · mardi + 🍰 Gâteau · jeudi ». */
function sourcesCourses(items){
  const v=[];
  items.forEach(c=>{
    if(!c.recette_id)return;
    const r=recetteDe(c.recette_id);
    const d=c.pour_le?deIso(c.pour_le):null;
    const q=[r?(r.emoji||'🍽️')+' '+r.nom:'',d?DFR[jSem(d)-1].toLowerCase():''].filter(Boolean).join(' · ');
    if(q&&!v.includes(q))v.push(q);
  });
  return v.length?`<div class="todo-date">pour ${echap(v.join(' + '))}</div>`:'';
}

function trierCourses(l){
  return l.slice().sort((a,b)=>
    (b.urgent?1:0)-(a.urgent?1:0) || String(a.cree_le||'').localeCompare(String(b.cree_le||'')));
}
function ligneCourse(g,faite){
  const ids=g.items.map(c=>c.id).join(',');
  const seul=g.items.length===1;
  return `<div class="todo-item${faite?' done':''}${g.urgent&&!faite?' urgent':''}" data-ids="${attr(ids)}">
    <div class="todo-check" data-act="cocher"></div>
    <div class="todo-corps" data-act="cocher">
      <div class="todo-text">${g.urgent&&!faite?'⚡ ':''}${echap(g.texte)}</div>
      ${sourcesCourses(g.items)}</div>
    <div class="todo-actions">
      <button class="todo-act" data-act="urgent" title="${g.urgent?'Ce n\'est plus urgent':'C\'est urgent'}">⚡</button>
      ${seul?`<button class="todo-act" data-act="editer" title="Modifier">✏️</button>`:''}
      <button class="todo-act" data-act="suppr" title="Supprimer">🗑️</button>
    </div></div>`;
}

function renderCourses(){
  const zone=document.getElementById('todoPanel');
  const ouvertes=CACHE.courses.filter(c=>!c.achete_le&&!c.coche);
  const caddie=CACHE.courses.filter(c=>!c.achete_le&&c.coche);
  const superm=trierCourses(ouvertes.filter(c=>!c.ailleurs));

  let h=`<h2 class="ps-titre">🛒 La liste de courses</h2>

  </div>`;

  if(nUrgent)h+=`<div class="bandeau-urgent">⚡ ${nUrgent} chose${nUrgent>1?'s':''} qui ne peu${nUrgent>1?'vent':'t'} pas attendre</div>`;
  if(!ouvertes.length&&!caddie.length)h+=`<div class="todo-empty" style="text-align:center;padding:26px 0">Liste vide 🌿</div>`;

  if(superm.length){
    h+=`<div class="todo-section"><div class="todo-section-title">🛒 Au supermarché (${superm.length})</div>`;
    grouperCourses(superm).forEach(g=>{h+=ligneCourse(g,false)});
    h+='</div>';
  }
  if(ailleurs.length){
    h+=`<div class="todo-section"><div class="todo-section-title">🛍️ Ailleurs (${ailleurs.length})</div>`;

    const mags=[...new Set(ailleurs.filter(c=>c.magasin).map(c=>c.magasin.trim()))]
      .sort((a,b)=>a.localeCompare(b));
    mags.forEach(m=>{
      h+=`<div class="sous-magasin">${echap(m)}</div>`;
      grouperCourses(trierCourses(ailleurs.filter(c=>(c.magasin||'').trim()===m))).forEach(g=>{h+=ligneCourse(g,false)});
    });
    const sansMag=trierCourses(ailleurs.filter(c=>!c.magasin));
    if(sansMag.length){
      if(mags.length)h+=`<div class="sous-magasin">Sans magasin précis</div>`;
      grouperCourses(sansMag).forEach(g=>{h+=ligneCourse(g,false)});
    }
    h+='</div>';
  }
  if(caddie.length){
    h+=`<div class="todo-section"><div class="todo-section-title">Dans le caddie (${caddie.length}) — clic pour remettre</div>`;
    grouperCourses(caddie).forEach(g=>{h+=ligneCourse(g,true)});
    h+=`</div><button class="btn primaire" style="width:100%;margin-top:8px" id="courses-terminees">✔ Courses terminées — archiver le caddie</button>`;

  if(ouvertes.length||caddie.length)h+=`<div style="margin-top:12px">${boutonPartage('course-part','Envoyer la liste')}</div>`;

  brancherVues(zone,setVueTodo);

  zone.querySelectorAll('#course-ou [data-ou]').forEach(b=>{b.onclick=()=>{
    courseOu=b.dataset.ou;
    zone.querySelectorAll('#course-ou [data-ou]').forEach(x=>x.classList.toggle('actif',x===b));
    majMag();
  }});
  const bu=zone.querySelector('#course-ou [data-urg]');
  if(bu)bu.onclick=()=>{courseUrgent=!courseUrgent;bu.classList.toggle('actif',courseUrgent)};

  const bcp=document.getElementById('course-part');
  if(bcp)bcp.onclick=()=>partager(texteCourses(),'Liste de courses');

    const texte=document.getElementById('course-texte').value.trim();

    courseMagasin=(document.getElementById('course-magasin')||{}).value?.trim()||'';
    enregistrerObjet(null,'courses',{texte,coche:false,achete_le:null,
      ailleurs:courseOu==='ailleurs',
      magasin:courseOu==='ailleurs'?(courseMagasin||null):null,
      urgent:courseUrgent});
    // L'urgence ne se garde pas d'un article à l'autre : on la redemande.
    // La liste et le magasin, si : on ajoute rarement un seul T-shirt.
    courseUrgent=false;
    renderCourses();
    document.getElementById('course-texte').focus();
  };
  document.getElementById('course-ajouter').onclick=ajouter;
  document.getElementById('course-texte').addEventListener('keydown',e=>{if(e.key==='Enter')ajouter()});
  // Une ligne à l'écran peut porter plusieurs lignes en base : cocher les
  // 9 œufs, c'est cocher les 6 de la quiche ET les 3 du gâteau.
  zone.querySelectorAll('.todo-item [data-act]').forEach(el=>{
    el.addEventListener('click',ev=>{
      ev.stopPropagation();
      const ids=(el.closest('.todo-item').dataset.ids||'').split(',').filter(Boolean);
      const items=ids.map(i=>CACHE.courses.find(x=>x.id===i)).filter(Boolean);
      if(!items.length)return;
      const act=el.dataset.act;
      if(act==='cocher'){const v=!items[0].coche;
        items.forEach(c=>enregistrerObjet(c.id,'courses',{coche:v,coche_par:v?EMAIL_CONNECTE:null}));render()}
      else if(act==='urgent'){const v=!items[0].urgent;items.forEach(c=>enregistrerObjet(c.id,'courses',{urgent:v}));renderCourses()}
      else if(act==='editer'){formCourse(items[0].id)}
      else if(act==='suppr'){items.forEach(c=>supprimerObjet(c.id));render()}
    });
  });
  const fin=document.getElementById('courses-terminees');
  if(fin)fin.onclick=()=>{
    const auj=iso(new Date());
    const n=caddie.length;
    caddie.forEach(c=>enregistrerObjet(c.id,'courses',{achete_le:auj}));
    toast(n+' article'+(n>1?'s':'')+' archivé'+(n>1?'s':'')+' — le reste est reporté ✔');
    renderCourses();
  };
}

/* ================== 🩺 LA SANTÉ ==================
   Pas de fiche santé séparée : la santé est une facette d'une personne
   du registre. Les médecins aussi sont des personnes — le Dr Chen est
   saisi une fois même s'il suit les trois enfants. */
let santeFiche=null;   // id de la personne ouverte, null = la liste
const MOMENTS=[['matin','☀️','matin'],['midi','🕛','midi'],['soir','🌙','soir'],['coucher','🛏️','coucher']];
const HEURES_DEF={matin:'08:00',midi:'12:30',soir:'19:30',coucher:'21:45'};

/* Qui apparaît dans la Santé : le foyer, plus toute personne pour qui on
   a noté quelque chose de médical. */
function gensSante(){
  const avecDonnees=new Set([
    ...CACHE.traitements.map(t=>t.personne_id),
    ...CACHE.suivis.map(x=>x.personne_id),
    ...CACHE.medecins.map(m=>m.personne_id),
  ]);
  return CACHE.personnes
    .filter(p=>p.foyer||avecDonnees.has(p.id)||p.allergies||p.sante_notes)
    .sort((a,b)=>(b.foyer?1:0)-(a.foyer?1:0)||String(a.nom).localeCompare(String(b.nom)));
}
function traitementsActifs(pid,d){
  const s=iso(d||new Date());
  return CACHE.traitements.filter(t=>t.personne_id===pid&&t.debut<=s&&(!t.fin||t.fin>=s));
}
function medecinsDe(pid){
  return CACHE.medecins.filter(m=>m.personne_id===pid)
    .map(m=>CACHE.personnes.find(x=>x.id===m.medecin_id)).filter(Boolean);
}
function priseFaite(idTrait,jour,moment){return CACHE.prises.some(p=>p.id===idTrait+'-'+jour+'-'+moment)}
function basculerPrise(idTrait,jour,moment){
  const id=idTrait+'-'+jour+'-'+moment;
  const i=CACHE.prises.findIndex(p=>p.id===id);
  if(i>=0){CACHE.prises.splice(i,1);pousser(sb.from('sante_prises').delete().eq('id',id))}
  else{const l={id,traitement_id:idTrait,jour,moment,par:UTILISATEUR||null};
    CACHE.prises.push(l);pousser(sb.from('sante_prises').insert(l))}
}
function echeanceSuivi(su){
  if(su.prochain)return su.prochain;
  if(su.dernier&&su.periode_mois){
    const d=deIso(su.dernier);d.setMonth(d.getMonth()+Number(su.periode_mois));return iso(d);
  }
  return null;
}
function alertesProfil(pid){
  const auj=iso(new Date()),dans60=iso(new Date(Date.now()+60*864e5));
  const out={retard:[],bientot:[]};
  CACHE.suivis.filter(x=>x.personne_id===pid).forEach(su=>{
    const e=echeanceSuivi(su);
    if(!e)return;
    if(e<auj)out.retard.push({su,e});else if(e<=dans60)out.bientot.push({su,e});
  });
  return out;
}
function alertesSante(){let n=0;gensSante().forEach(p=>{n+=alertesProfil(p.id).retard.length});return n}
function dosesDuJour(d){
  const jour=iso(d||new Date()),out=[];
  CACHE.personnes.forEach(p=>{
    traitementsActifs(p.id,d).forEach(t=>{
      (t.moments||[]).forEach(m=>out.push({profil:p,trait:t,moment:m,jour,faite:priseFaite(t.id,jour,m)}));
    });
  });
  const ordre=MOMENTS.map(x=>x[0]);
  return out.sort((a,b)=>ordre.indexOf(a.moment)-ordre.indexOf(b.moment));
}

/* Une prise est « en retard » quand son heure est passée et qu'elle
   n'est pas cochée. On ne compte que celles qui ont une heure :
   sans heure, c'est un pense-bête, pas un rendez-vous. */
function prisesEnRetard(){
  const d=new Date(),jour=iso(d),mnt=d.getHours()*60+d.getMinutes(),out=[];
  CACHE.personnes.forEach(p=>{
    traitementsActifs(p.id,d).forEach(t=>{
      const hh=t.heures||{};
      (t.moments||[]).forEach(m=>{
        const v=String(hh[m]||'').match(/^(\d{1,2}):(\d{2})$/);
        if(!v)return;
        const h=Number(v[1])*60+Number(v[2]);
        if(mnt<h)return;
        if(priseFaite(t.id,jour,m))return;
        out.push({profil:p,trait:t,moment:m,jour,minutes:h,retard:mnt-h});
      });
    });
  });
  return out.sort((a,b)=>b.retard-a.retard);
}
let priseEcartee=new Set();   // « pas maintenant » — le temps de cette visite
function montrerPriseSiBesoin(){
  const zone=document.getElementById('prisePlein');
  if(!zone)return;
  const due=prisesEnRetard().filter(x=>!priseEcartee.has(x.trait.id+'-'+x.jour+'-'+x.moment));
  if(!due.length){zone.style.display='none';zone.innerHTML='';return}
  const x=due[0];
  const def=MOMENTS.find(m=>m[0]===x.moment)||[x.moment,'💊',x.moment];
  const sien=(x.profil.email||'').toLowerCase()===EMAIL_CONNECTE;
  const h=Math.floor(x.retard/60),mn=x.retard%60;
  zone.innerHTML=`<div class="pp-pil">💊</div>
    <div class="pp-titre">${echap(x.trait.medicament)}</div>
    <div class="pp-quand">La prise ${def[1]} ${echap(def[2])}${sien?'':' de '+echap(x.profil.nom)}${x.trait.dose?' · '+echap(x.trait.dose):''}</div>
    <div class="pp-retard">${x.retard<5?'C\'est l\'heure':(h?h+' h '+(mn?mn+' min':''):mn+' min')+' de retard'}</div>
    <div class="pp-btns">
      <button class="btn primaire" id="pp-fait">C'est pris ✔</button>
      <button class="btn" id="pp-plus-tard">Pas maintenant</button>
    </div>
    ${due.length>1?`<div class="pp-reste">et ${due.length-1} autre${due.length>2?'s':''} en attente</div>`:''}`;
  zone.style.display='flex';
  document.getElementById('pp-fait').onclick=()=>{
    basculerPrise(x.trait.id,x.jour,x.moment);
    montrerPriseSiBesoin();
    render();
  };

    priseEcartee.add(x.trait.id+'-'+x.jour+'-'+x.moment);
    montrerPriseSiBesoin();

}
/* Toutes les minutes : si une heure vient de tomber, l'écran s'ouvre tout seul */
setInterval(()=>{if(typeof CACHE!=='undefined'&&CACHE.personnes)montrerPriseSiBesoin()},60000);

function renderSante(){
  const zone=document.getElementById('vueSante');
  if(santeFiche&&!CACHE.personnes.some(p=>p.id===santeFiche))santeFiche=null;
  if(santeFiche){renderSanteFiche(zone);return}
  const gens=gensSante();
  let h=`<div class="sa-tete"><h2 class="ps-titre">🩺 La santé de la famille</h2></div>
    <p class="discret2" style="margin:-2px 0 14px">Vert = rien à faire.</p>`;
  if(!gens.length){
    h+=`<div class="sa-vide">Personne n'est encore rangé « à la maison ».<br>
      Ajoute les gens du foyer dans la 🧠 Mémoire, ils apparaîtront ici.</div>`;
  }
  gens.forEach(p=>{
    const al=alertesProfil(p.id),tr=traitementsActifs(p.id),bouts=[];
    tr.forEach(t=>{
      const jours=t.fin?Math.max(1,Math.round((deIso(t.fin)-deIso(t.debut))/864e5)+1):null;
      const fait=Math.max(1,Math.round((new Date()-deIso(t.debut))/864e5)+1);
      bouts.push('💊 '+t.medicament+(jours?` (jour ${Math.min(fait,jours)}/${jours})`:''));
    });
    al.retard.forEach(x=>bouts.push('⚠️ '+x.su.nom+' dépassé'));
    if(!bouts.length&&al.bientot.length)bouts.push(al.bientot[0].su.nom+' à prévoir');
    if(!bouts.length)bouts.push(p.allergies?'Allergie : '+p.allergies:'Rien à signaler');
    const badge=al.retard.length?`<span class="sa-badge sa-late">⚠️ ${al.retard.length} alerte${al.retard.length>1?'s':''}</span>`
      :al.bientot.length?`<span class="sa-badge sa-warn">${al.bientot.length} à prévoir</span>`
      :`<span class="sa-badge sa-ok">✓ à jour</span>`;
    h+=`<div class="sa-fiche" data-profil="${p.id}">
      <div class="sa-av">${p.emoji||'🙂'}</div>
      <div style="min-width:0"><div class="sa-nom">${echap(p.nom)}</div>
        <div class="sa-etat">${echap(bouts.slice(0,2).join(' · '))}</div></div>
      ${badge}</div>`;
  });
  h+=`<div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
    ${gens.length?'<button class="btn primaire" id="sa-new-trait">💊 Déclarer un traitement</button>':''}
  </div>
  <p class="discret2" style="margin-top:10px">Qui vit à la maison se règle dans ⚙️ Réglages. Pour suivre la santé de quelqu'un d'autre (tes parents…), déclare simplement son traitement ou son suivi : sa page apparaîtra ici.</p>`;
  zone.innerHTML=h;
  zone.querySelectorAll('[data-profil]').forEach(el=>{el.onclick=()=>{santeFiche=el.dataset.profil;renderSante()}});
  const bt=document.getElementById('sa-new-trait');
  if(bt)bt.onclick=()=>formTraitement(null,null);
}

function renderSanteFiche(zone){
  const p=CACHE.personnes.find(x=>x.id===santeFiche);
  const auj=iso(new Date());
  const tr=traitementsActifs(p.id);
  const suivis=CACHE.suivis.filter(x=>x.personne_id===p.id)
    .sort((a,b)=>String(echeanceSuivi(a)||'9999').localeCompare(String(echeanceSuivi(b)||'9999')));
  const age=(p.naiss_annee&&p.naiss_mois&&p.naiss_jour)
    ?Math.floor((new Date()-new Date(p.naiss_annee,p.naiss_mois-1,p.naiss_jour))/(365.25*864e5)):null;
  let h=`<button class="btn mini" id="sa-retour" style="margin-bottom:12px">‹ La famille</button>
    <div class="sa-tete"><div class="sa-av" style="width:44px;height:44px;font-size:1.45rem">${p.emoji||'🙂'}</div>
      <div><h2 class="ps-titre" style="margin:0">${echap(p.nom)}</h2>
        <div class="discret2">${[age!=null?age+' ans':'',roleAffiche(p)?echap(roleAffiche(p)):'',p.allergies?'⚠️ allergie : '+echap(p.allergies):''].filter(Boolean).join(' · ')||'—'}</div></div>
      <button class="todo-act" id="sa-edit" title="Allergies et infos médicales" style="margin-left:auto">✏️</button></div>`;
  tr.forEach(t=>{
    const jours=t.fin?Math.max(1,Math.round((deIso(t.fin)-deIso(t.debut))/864e5)+1):null;
    const jFait=Math.min(jours||99,Math.max(1,Math.round((new Date()-deIso(t.debut))/864e5)+1));
    h+=`<div class="sa-bloc alerte">
      <div class="sa-bt">💊 ${echap(t.medicament)}
        ${jours?`<span class="n">jour ${jFait} / ${jours}</span>`:'<span class="n">en cours</span>'}</div>
      <div class="sa-s">${[t.dose,(t.moments||[]).length+' fois par jour',t.fin?"jusqu'au "+deIso(t.fin).getDate()+' '+MFR[deIso(t.fin).getMonth()].toLowerCase():''].filter(Boolean).join(' · ')}</div>
      ${jours?`<div class="sa-barre"><div style="width:${Math.round(jFait/jours*100)}%"></div></div>`:''}
      <div class="sa-doses">${(t.moments||[]).map(m=>{
        const def=MOMENTS.find(x=>x[0]===m)||[m,'💊',m];
        const on=priseFaite(t.id,auj,m);
        return `<div class="sa-dose ${on?'on':''}" data-dose="${t.id}|${m}">${def[1]} ${def[2]}<b>${on?'✓ donné':'à cocher'}</b></div>`;
      }).join('')}</div>
      <div style="display:flex;gap:8px;margin-top:10px">
        <button class="btn mini" data-modtrait="${t.id}">✏️ Modifier</button>
        <button class="btn mini danger" data-stoptrait="${t.id}">Arrêter</button>
      </div></div>`;
  });
  // Les actions de santé qui la concernent : elles vivent dans la to-do,
  // on les montre aussi ici. Une seule tâche, deux endroits où la voir.
  const aFaire=tachesLiees(p.id).filter(t=>t.cat==='sante'&&!estFaite(t.id))
    .sort((a,b)=>String(a.ech||'9999').localeCompare(String(b.ech||'9999')));
  h+=`<div class="sa-bloc"><div class="sa-bt">✅ À faire pour sa santé<span class="n">${aFaire.length||''}</span></div>`;
  if(!aFaire.length)h+=`<div class="sa-s" style="padding:4px 0">Rien en attente.</div>`;
  aFaire.forEach(t=>{
    const tard=t.ech&&t.ech<auj;
    h+=`<div class="sa-l ${tard?'retard':''}">
      <span class="cb" data-fait-tache="${t.id}" title="C'est fait"></span>
      <span class="txt" data-mod-tache="${t.id}">${echap(t.texte)}</span>
      <span class="quand">${t.ech?(tard?'en retard depuis le ':'')+deIso(t.ech).getDate()+' '+MFR[deIso(t.ech).getMonth()].toLowerCase():''}</span></div>`;
  });
  h+=`<button class="btn mini" id="sa-new-tache" style="margin-top:10px">＋ Ajouter une action</button></div>`;
  h+=`<div class="sa-bloc"><div class="sa-bt">💉 Vaccins &amp; bilans<span class="n">${suivis.length||''}</span></div>`;
  if(!suivis.length)h+=`<div class="sa-s" style="padding:4px 0">Rien de suivi pour l'instant.</div>`;
  suivis.forEach(su=>{
    const e=echeanceSuivi(su),enRetard=e&&e<auj;
    const quand=e?(enRetard?'dépassé depuis le '+deIso(e).getDate()+' '+MFR[deIso(e).getMonth()].toLowerCase()
      :'prévu '+deIso(e).getDate()+' '+MFR[deIso(e).getMonth()].toLowerCase()+' '+deIso(e).getFullYear())
      :(su.dernier?'fait le '+deIso(su.dernier).getDate()+' '+MFR[deIso(su.dernier).getMonth()].toLowerCase():'jamais fait');
    h+=`<div class="sa-l ${enRetard?'retard':''}">
      <span class="cb ${e&&!enRetard?'on':''}" data-faitsuivi="${su.id}" title="Marquer comme fait aujourd'hui"></span>
      <span class="txt" data-modsuivi="${su.id}">${su.type==='vaccin'?'💉 ':'🩺 '}${echap(su.nom)}</span>
      <span class="quand">${echap(quand)}</span></div>`;
  });
  h+=`<button class="btn mini" id="sa-new-suivi" style="margin-top:10px">＋ Ajouter un suivi</button></div>`;

  const meds=medecinsDe(p.id);
  h+=`<div class="sa-bloc"><div class="sa-bt">🩺 Ses médecins</div>`;
  if(!meds.length)h+=`<div class="sa-s" style="padding:4px 0">Aucun médecin rattaché.</div>`;
  meds.forEach(m=>{
    h+=`<div class="sa-med"><b>${echap(m.nom)}</b>
      <span class="r">${[m.role,m.detail].filter(Boolean).map(echap).join(' · ')}</span>
      <button class="todo-act" data-delmed="${m.id}" title="Détacher">✕</button></div>`;
  });
  h+=`<button class="btn mini" id="sa-add-med" style="margin-top:8px">＋ Rattacher un médecin</button></div>`;
  if(p.sante_notes)h+=`<div class="sa-bloc"><div class="sa-bt">📝 À savoir</div><div class="sa-s">${echap(p.sante_notes)}</div></div>`;
  h+=`<button class="btn primaire" id="sa-add-trait" style="width:100%">💊 Déclarer un traitement</button>`;
  zone.innerHTML=h;

  document.getElementById('sa-retour').onclick=()=>{santeFiche=null;renderSante()};
  document.getElementById('sa-edit').onclick=()=>formSanteInfos(p.id);
  document.getElementById('sa-new-suivi').onclick=()=>formSuivi(null,p.id);
  document.getElementById('sa-new-tache').onclick=()=>formTache(null,p.id,null,{
    titre:'Nouvelle action santé',
    exemple:'🩺 Prendre rendez-vous chez le dentiste',
    cat:'sante',
  });
  zone.querySelectorAll('[data-fait-tache]').forEach(el=>{el.onclick=()=>{
    basculerFaite(el.dataset.faitTache);renderSante();
  }});
  zone.querySelectorAll('[data-mod-tache]').forEach(el=>{el.onclick=()=>formTache(el.dataset.modTache)});
  document.getElementById('sa-add-trait').onclick=()=>formTraitement(null,p.id);
  document.getElementById('sa-add-med').onclick=()=>formMedecin(p.id);
  zone.querySelectorAll('[data-dose]').forEach(el=>{
    el.onclick=()=>{const [id,m]=el.dataset.dose.split('|');basculerPrise(id,auj,m);renderSante()};
  });
  zone.querySelectorAll('[data-delmed]').forEach(el=>{el.onclick=()=>{
    const l=CACHE.medecins.find(m=>m.personne_id===p.id&&m.medecin_id===el.dataset.delmed);
    if(l){supprimerObjet(l.id);toast('Détaché');renderSante()}
  }});
  zone.querySelectorAll('[data-modtrait]').forEach(el=>{el.onclick=()=>formTraitement(el.dataset.modtrait,p.id)});
  zone.querySelectorAll('[data-stoptrait]').forEach(el=>{el.onclick=()=>{
    if(!confirm('Arrêter ce traitement ? Les prises déjà cochées seront effacées.'))return;
    supprimerObjet(el.dataset.stoptrait);toast('Traitement arrêté');renderSante();
  }});
  zone.querySelectorAll('[data-faitsuivi]').forEach(el=>{el.onclick=()=>{
    const su=CACHE.suivis.find(x=>x.id===el.dataset.faitsuivi);
    if(!su)return;
    enregistrerObjet(su.id,'suivis',{dernier:auj,prochain:null});
    toast('Noté : fait aujourd\'hui ✓');renderSante();
  }});
  zone.querySelectorAll('[data-modsuivi]').forEach(el=>{el.onclick=()=>formSuivi(el.dataset.modsuivi,p.id)});
}
