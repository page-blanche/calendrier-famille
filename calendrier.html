/* Rattacher un médecin : on le choisit dans le registre, ou on le crée */
function formMedecin(pid){
  ouvrirTiroirBrut('Rattacher un médecin');
  const deja=new Set(CACHE.medecins.filter(m=>m.personne_id===pid).map(m=>m.medecin_id));
  const candidats=CACHE.personnes.filter(x=>x.id!==pid&&!deja.has(x.id)&&!x.foyer);
  document.getElementById('dbd').innerHTML=`
    <p class="discret2">Un médecin est une personne comme une autre : saisi une fois, il peut suivre
    plusieurs membres de la famille.</p>
    ${candidats.length?`<label class="lbl">Quelqu'un du registre</label>
      <div class="mg-chips" id="fm-liste">${candidats.slice(0,14).map(x=>`<button class="mg-chip" data-m="${x.id}">${x.emoji||'🩺'} ${echap(x.nom)}${x.role?' · '+echap(x.role):''}</button>`).join('')}</div>`:''}
    <label class="lbl">Ou en créer un</label>
    <input type="text" id="fm-nom" placeholder="Dr Chen">
    <input type="text" id="fm-role" placeholder="Pédiatre" style="margin-top:8px">
    <input type="text" id="fm-tel" placeholder="Téléphone" style="margin-top:8px">
    <button class="btn primaire" id="fm-ok" style="width:100%;margin-top:14px">Créer et rattacher</button>`;
  const rattacher=(medId)=>{
    enregistrerObjet(null,'medecins',{personne_id:pid,medecin_id:medId});
    toast('Rattaché ✓');fermerTiroir();renderSante();
  };
  const liste=document.getElementById('fm-liste');
  if(liste)liste.querySelectorAll('[data-m]').forEach(b=>{b.onclick=()=>rattacher(b.dataset.m)});
  document.getElementById('fm-ok').onclick=()=>{
    const nom=document.getElementById('fm-nom').value.trim();
    if(!nom){toast('Il faut un nom');return}
    const id=genId();
    enregistrerObjet(null,'personnes',{id,nom,foyer:false,emoji:'🩺',
      role:document.getElementById('fm-role').value.trim()||null,
      detail:document.getElementById('fm-tel').value.trim()||null});
    rattacher(id);
  };
}

function formTraitement(id,personnePre){
  const t=id?CACHE.traitements.find(x=>x.id===id):null;
  const dejaLa=new Set(gensSante().map(x=>x.id));
  const gens=gensSante();
  const ailleurs=CACHE.personnes.filter(x=>!dejaLa.has(x.id)).sort((a,b)=>a.nom.localeCompare(b.nom));
  if(!gens.length&&!ailleurs.length){toast('Ajoute d\'abord les gens du foyer');return}
  ouvrirTiroirBrut(t?'Modifier le traitement':'💊 Déclarer un traitement');
  let pid=t?t.personne_id:(personnePre||gens[0].id);
  let moments=t?[...(t.moments||[])]:['matin','soir'];
  const heures={...(t&&t.heures?t.heures:{})};
  const auj=iso(new Date());
  document.getElementById('dbd').innerHTML=`
    <label class="lbl">Pour qui ?</label>
    <div class="mg-chips" id="st-qui">${gens.map(p=>`<button class="mg-chip ${p.id===pid?'actif':''}" data-p="${p.id}">${p.emoji||'🙂'} ${echap(p.nom)}</button>`).join('')}</div>
    ${ailleurs.length?`<select id="st-autre" style="margin-top:7px">
      <option value="">Quelqu'un d'autre…</option>
      ${ailleurs.map(x=>`<option value="${x.id}" ${x.id===pid?'selected':''}>${echap(x.nom)}${roleAffiche(x)?' · '+echap(roleAffiche(x)):''}</option>`).join('')}
    </select>`:''}
    <label class="lbl">Médicament</label>
    <input type="text" id="st-med" value="${t?echap(t.medicament):''}" placeholder="Amoxicilline">
    <label class="lbl">Dose <span class="discret2">(facultatif)</span></label>
    <input type="text" id="st-dose" value="${t?echap(t.dose||''):''}" placeholder="5 ml">
    <label class="lbl">Quand ?</label>
    <div class="mg-chips" id="st-moments">${MOMENTS.map(m=>`<button class="mg-chip ${moments.includes(m[0])?'actif':''}" data-m="${m[0]}">${m[1]} ${m[2]}</button>`).join('')}</div>
    <div id="st-heures"></div>
    <label class="lbl">Du</label>
    <input type="date" id="st-debut" value="${t?t.debut:auj}">
    <label class="lbl">Jusqu'au <span class="discret2">(vide = jusqu'à ce que tu l'arrêtes)</span></label>
    <input type="date" id="st-fin" value="${t&&t.fin?t.fin:''}">
    <div class="mg-chips" id="st-duree">${[3,5,7,10].map(n=>`<button class="mg-chip" data-j="${n}">${n} jours</button>`).join('')}</div>
    <button class="btn primaire" id="st-ok" style="width:100%;margin-top:14px">${t?'Enregistrer':'Démarrer le suivi 💊'}</button>`;
  const chAutre=document.getElementById('st-autre');
  document.querySelectorAll('#st-qui [data-p]').forEach(b=>{b.onclick=()=>{
    pid=b.dataset.p;document.querySelectorAll('#st-qui .mg-chip').forEach(x=>x.classList.toggle('actif',x===b));
    if(chAutre)chAutre.value='';
  }});
  if(chAutre)chAutre.onchange=()=>{
    if(!chAutre.value)return;
    pid=chAutre.value;
    document.querySelectorAll('#st-qui .mg-chip').forEach(x=>x.classList.remove('actif'));
  };
  const ordreM=MOMENTS.map(x=>x[0]);
  const majHeures=()=>{
    const z=document.getElementById('st-heures');
    const l=[...moments].sort((a,b)=>ordreM.indexOf(a)-ordreM.indexOf(b));
    if(!l.length){z.innerHTML='';return}
    z.innerHTML=`<div class="st-h-tete">À quelle heure te le rappeler ?</div>`+
      l.map(m=>{const d=MOMENTS.find(x=>x[0]===m)||[m,'💊',m];
        return `<div class="st-h"><span>${d[1]} ${d[2]}</span>
          <input type="time" data-h="${m}" value="${attr(heures[m]!==undefined?heures[m]:HEURES_DEF[m]||'')}"></div>`}).join('')+
      `<p class="discret2" style="margin-top:6px">Efface l'heure pour ne pas être rappelée : la prise reste à cocher, mais elle ne sonne pas.</p>`;
    z.querySelectorAll('[data-h]').forEach(i=>{
      heures[i.dataset.h]=i.value;
      i.addEventListener('input',()=>{heures[i.dataset.h]=i.value});
    });
  };
  document.querySelectorAll('#st-moments [data-m]').forEach(b=>{b.onclick=()=>{
    const m=b.dataset.m;
    if(moments.includes(m))moments=moments.filter(x=>x!==m);else moments.push(m);
    b.classList.toggle('actif',moments.includes(m));
    majHeures();
  }});
  majHeures();
  document.querySelectorAll('#st-duree [data-j]').forEach(b=>{b.onclick=()=>{
    const deb=deIso(document.getElementById('st-debut').value||auj);
    deb.setDate(deb.getDate()+Number(b.dataset.j)-1);
    document.getElementById('st-fin').value=iso(deb);
  }});
  document.getElementById('st-ok').onclick=()=>{
    const med=document.getElementById('st-med').value.trim();
    if(!med){toast('Il faut le nom du médicament');return}
    if(!moments.length){toast('Choisis au moins un moment de la journée');return}
    const ordre=MOMENTS.map(x=>x[0]);
    const gardees={};
    moments.forEach(m=>{const v=String(heures[m]||'').trim();if(v)gardees[m]=v});
    enregistrerObjet(id,'traitements',{personne_id:pid,medicament:med,
      dose:document.getElementById('st-dose').value.trim()||null,
      moments:[...moments].sort((a,b)=>ordre.indexOf(a)-ordre.indexOf(b)),
      heures:gardees,
      debut:document.getElementById('st-debut').value||auj,
      fin:document.getElementById('st-fin').value||null});
    toast(t?'Traitement enregistré':'C\'est parti 💊');fermerTiroir();santeFiche=pid;renderSante();
  };
}

/* ================== 🪄 SAISIE MAGIQUE (chat) ================== */
let MAGIE_HISTO=[];     // le fil de la conversation, envoyé à l'IA pour qu'elle suive
let MAGIE_PROPS=null;   // cartes en attente de validation
let MAGIE_TEXTE='';     // dernier texte analysé (pour les corrections)
let MAGIE_ATTENTE=null; // question « qui ? » en cours
/* Ce que Pia a sous les yeux n'est plus construit ici. L'app et Telegram en
   avaient chacun leur version, et elles ont dérivé sans qu'on le décide :
   Telegram voyait l'urgence des courses, l'app non. Une phrase marchait d'un
   côté et pas de l'autre. C'est le cerveau qui regarde maintenant, pour les
   deux ; on ne lui envoie plus que notre identité. */
function noterMessage(role,texte,source,actions){
  if(!texte||!EMAIL_CONNECTE)return;
  const l={personne:EMAIL_CONNECTE,role,texte:String(texte).slice(0,4000),
    source:source||'app',actions:actions||null};
  sb.from('messages').insert(l).then(r=>{if(r.error)console.warn('message non gardé',r.error.message)});
}

/* Le fil, tel qu'on le retrouve en ouvrant l'app. */
async function chargerConversation(){
  if(!EMAIL_CONNECTE)return[];
  const {data,error}=await sb.from('messages').select('*')
    .eq('personne',EMAIL_CONNECTE).order('cree_le',{ascending:false}).limit(80);
  if(error){console.warn('conversation illisible',error.message);return[]}
  return (data||[]).reverse();
}

function jourFr(ts){
  if(!ts)return '';
  const d=new Date(ts),auj=new Date();
  const sd=iso(d),sa=iso(auj);
  if(sd===sa)return "aujourd'hui";
  if(sd===iso(new Date(auj.getTime()-864e5)))return 'hier';
  return DFR[jSem(d)-1].toLowerCase()+' '+d.getDate()+' '+MFR[d.getMonth()].toLowerCase();
}

const CHAT_EXEMPLES=[
  ['📅','foot de Kyan mercredi 17h'],
  ['🛒','lait, pain, piles'],
  ['❓',"on a quoi ce week-end ?"],

];

/* Dessiner le fil depuis la base. On ne rejoue pas les cartes à valider :
   ce qui était à décider l'a été, ou ne l'est plus. */
async function peuplerChat(){
  const fil=mgFil();if(!fil)return;
  const msgs=await chargerConversation();
  CONV_CHARGEE=true;
  MAGIE_HISTO=msgs.slice(-12).map(m=>({role:m.role==='moi'?'user':'assistant',content:m.texte}));
  if(!msgs.length){fil.innerHTML=chatVide();brancherChatVide(fil);return}
  let h='',jour='';
  msgs.forEach(m=>{
    const j=jourFr(m.cree_le);
    if(j!==jour){jour=j;h+=`<div class="chat-jour"><span>${echap(j)}</span></div>`}
    const src=m.source&&m.source!=='app'
      ? `<div class="mg-src">${m.source==='telegram'?'dicté sur Telegram':'le réveil du matin'}</div>`:'';
    h+=`<div class="mg-b ${m.role==='moi'?'mg-moi':'mg-ia'}">${echap(m.texte)}${src}</div>`;
  });
  fil.innerHTML=h;
  mgScroll();
}
function brancherChatVide(fil){
  fil.querySelectorAll('[data-ex]').forEach(b=>{
    b.onclick=()=>{const i=document.getElementById('mg-texte');i.value=b.dataset.ex;mgEnvoyer()};
  });
}

/* La page de chat est fixée sous l'interrupteur : on mesure plutôt que
   de deviner, l'entête n'a pas la même hauteur sur tous les téléphones. */
function majHautChat(){
  const mb=document.getElementById('modesBar');if(!mb)return;
  document.documentElement.style.setProperty('--haut-chat',
    Math.round(mb.getBoundingClientRect().bottom+6)+'px');
}
function setMode(m,pre){
  MODE=(m==='parler')?'parler':'famille';
  document.body.classList.toggle('mode-parler',MODE==='parler');
  majHautChat();
  document.querySelectorAll('#modesBar [data-mode]').forEach(b=>
    b.classList.toggle('actif',b.dataset.mode===MODE));
  if(MODE!=='parler')return;
  MAGIE_PROPS=null;MAGIE_ATTENTE=null;
  const input=document.getElementById('mg-texte');
  const lancer=()=>{
    if(pre&&pre.trim()){input.value=pre;mgEnvoyer();return}
    if(window.matchMedia('(min-width:700px)').matches)setTimeout(()=>input.focus(),150);
  };
  if(!CONV_CHARGEE)peuplerChat().then(lancer);
  else lancer();
}

/* On garde le nom historique : tout le reste de l'app appelle formMagie(). */

function mgFil(){return document.getElementById('mg-fil')}
function mgScroll(){const f=mgFil();if(f)f.scrollTop=f.scrollHeight}
function mgBulle(qui,html){
  const d=document.createElement('div');
  d.className='mg-b '+(qui==='moi'?'mg-moi':'mg-ia');

  mgFil().appendChild(d);mgScroll();return d;

function mgPense(){
  const d=document.createElement('div');d.className='mg-pense';d.id='mg-pense';
  d.textContent='🪄 réfléchit…';mgFil().appendChild(d);mgScroll();
}
function mgFiniPense(){const d=document.getElementById('mg-pense');if(d)d.remove()}
function mgChips(liste){
  const c=document.createElement('div');c.className='mg-chips';
  liste.forEach(([lbl,cb])=>{
    const ch=document.createElement('button');ch.className='mg-chip';ch.textContent=lbl;
    ch.onclick=()=>{c.remove();mgBulle('moi',echap(lbl));cb()};

async function mgEnvoyer(){
  const input=document.getElementById('mg-texte');
  const texte=input.value.trim();
  if(!texte)return;
  input.value='';
  mgBulle('moi',echap(texte));
  if(MAGIE_ATTENTE){
    // Réponse libre (« vendredi prochain », « plutôt Didier ») : on laisse l'IA interpréter
    MAGIE_PROPS=MAGIE_ATTENTE.actions;MAGIE_ATTENTE=null;
  }
  const enCorrection=!!MAGIE_PROPS;
  if(!enCorrection)MAGIE_HISTO.push({role:'user',content:texte});
  noterMessage('moi',texte,'app');
  mgPense();
  let data=null,error=null;
  try{
    const body={texte:enCorrection?MAGIE_TEXTE:texte,
      contexte:{aujourdhui:iso(new Date()),membres:CACHE.membres,personnes:CACHE.personnes.map(p=>p.nom),
        moi:UTILISATEUR||'',adultes:accompagnateurs().chips.concat(accompagnateurs().menu).map(p=>p.nom)},
      personne:EMAIL_CONNECTE||'',moi:UTILISATEUR||'',
      historique:MAGIE_HISTO.slice(-12)};
    if(enCorrection){body.correction=texte;body.precedent=MAGIE_PROPS}
    const r=await sb.functions.invoke('saisie-magique',{body});
    data=r.data;error=r.error;
  }catch(e){error=e}
  mgFiniPense();
  if(error||!data||data.erreur||(data.mode!=='reponse'&&!Array.isArray(data.actions))){
    const det=String((data&&data.erreur)||(error&&error.message)||'');
    mgBulle('ia','Je n\'ai pas réussi à répondre là 😕 Redis-le moi ?'+(det?'<div class="todo-date" style="margin-top:3px">'+echap(det.slice(0,120))+'</div>':''));
    return;
  }
  if(data.mode==='reponse'&&data.texte){
    MAGIE_PROPS=null;
    MAGIE_HISTO.push({role:'assistant',content:data.texte});
    noterMessage('assistant',data.texte,'app');
    const b=mgBulle('ia',echap(data.texte).replace(/\n/g,'<br>'));
    // un message rédigé s'envoie : le brouillon ne sert à rien s'il faut le recopier
    if(data.brouillon){
      const z=document.createElement('div');
      z.style.marginTop='8px';
      z.innerHTML=boutonPartage('mg-part','Envoyer ce message');
      b.appendChild(z);
      document.getElementById('mg-part').onclick=()=>partager(data.texte);
      mgScroll();
    }
    return;
  }
  if(!data.actions.length){
    MAGIE_HISTO.push({role:'assistant',content:"(rien trouvé à ranger)"});
    mgBulle('ia','Hmm, je n\'ai pas vu quoi ranger là-dedans 🤔 Tu peux préciser ?');return;
  }
  if(enCorrection)MAGIE_HISTO.push({role:'user',content:texte});
  else MAGIE_TEXTE=texte;
  MAGIE_HISTO.push({role:'assistant',content:JSON.stringify({mode:'saisie',actions:data.actions})});
  mgProposer(data);
}
function mgProposer(data){
  MAGIE_PROPS=data.actions;
  if(data.remarque)mgBulle('ia','💭 '+echap(data.remarque));
  mgSuite(data.actions,true);
}
// Pose UNE question à la fois pour ce que l'IA ne peut pas deviner :
// d'abord la date, puis qui s'en occupe. Le reste, elle le déduit.
function mgSuite(actions,premier){
  const sansDate=actions.map((a,i)=>(a.type==='tache'&&!a.ech&&!a._dateOk)?i:-1).filter(i=>i>=0);
  if(sansDate.length){
    MAGIE_ATTENTE={actions,indices:sansDate,quoi:'date'};
    mgBulle('ia',(premier?'Super, je te prépare ça 👍 ':'')+'C\'est pour <b>quand</b> ?');
    const d=new Date();
    const plus=(n)=>{const x=new Date();x.setDate(x.getDate()+n);return iso(x)};
    const finSemaine=()=>{const x=new Date();x.setDate(x.getDate()+((7-x.getDay())%7||7));return iso(x)};
    mgChips([
      ["Aujourd'hui",()=>mgRepondreDate(iso(d),"aujourd'hui")],
      ['Demain',()=>mgRepondreDate(plus(1),'demain')],
      ['Cette semaine',()=>mgRepondreDate(finSemaine(),'cette semaine')],
      ['Sans date',()=>mgRepondreDate(null,'sans date')],
    ]);
    return;
  }
  const sansQui=actions.map((a,i)=>(a.type==='tache'&&!a.qui&&!a._quiOk)?i:-1).filter(i=>i>=0);
  if(sansQui.length){
    MAGIE_ATTENTE={actions,indices:sansQui,quoi:'qui'};
    mgBulle('ia',(premier?'Super, je te prépare ça 👍 ':'')+'Et <b>qui s\'en occupe</b> ?');
    const membres=CACHE.membres.length?CACHE.membres:['Mandana','Didier'];
    mgChips([
      ...membres.map(m=>[m,()=>mgRepondreQui(m)]),
      ['Les deux 💪',()=>mgRepondreQui((CACHE.comptes&&CACHE.comptes.length>=2?CACHE.comptes:membres).slice(0,2).join(' & '))],
      ['Peu importe',()=>mgRepondreQui('')],
    ]);
    return;
  }
  mgCartes(actions);
}
function mgRepondreDate(ech,libelle){
  const att=MAGIE_ATTENTE;MAGIE_ATTENTE=null;
  if(!att)return;
  att.indices.forEach(i=>{att.actions[i].ech=ech;att.actions[i]._dateOk=true});
  MAGIE_HISTO.push({role:'assistant',content:'(question : pour quand ? → réponse : '+libelle+')'});
  mgSuite(att.actions,false);
}
function mgRepondreQui(rep){
  const att=MAGIE_ATTENTE;MAGIE_ATTENTE=null;
  if(!att)return;
  MAGIE_HISTO.push({role:'assistant',content:'(question : qui s\'en occupe ? → réponse : '+(rep||'peu importe')+')'});
  att.indices.forEach(i=>{att.actions[i].qui=(rep||'').trim()||null;att.actions[i]._quiOk=true});
  mgSuite(att.actions,false);
}
function mgCartes(actions){
  MAGIE_PROPS=actions;
  const d=document.createElement('div');d.className='mg-cartes';
  let h='<div class="mg-cartes-titre">Vérifie chaque proposition :</div>';

    const r=magiResume(a);
    return `<div class="mg-prop" data-i="${i}">
      <div style="flex:1">
        <div class="mg-type">${r.ico} ${echap(r.type.toUpperCase())}</div>
        <div class="mg-titre">${echap(r.titre||'')}</div>
        ${r.det?`<div class="todo-date">${r.det}</div>`:''}
        <div class="mg-prop-btns">
          <button class="btn primaire mini" data-mgok="${i}">✓ OK</button>
          ${['cocher','reporter','supprimer'].includes(a.type)?'':`<button class="btn mini" data-mgedit="${i}">✏️ Modifier</button>`}
          <button class="btn mini" data-mgsuppr="${i}">${['cocher','reporter','supprimer'].includes(a.type)?'✕ Non':'🗑️'}</button>
        </div>
      </div>
    </div>`;
  }).join('');
  h+=`<div class="discret2" style="margin:4px 0 0;font-size:.72rem">Pas tout à fait ? Écris ta correction ci-dessous 👇</div>`;
  d.innerHTML=h;
  mgFil().appendChild(d);mgScroll();
  let restants=actions.length,enregistres=0;
  const clore=()=>{
    if(restants>0)return;
    MAGIE_PROPS=null;
    render();
    MAGIE_HISTO.push({role:'assistant',content:'('+(enregistres?enregistres+' proposition(s) enregistrée(s)':'rien gardé')+')'});
    mgBulle('ia',(enregistres?enregistres+' élément'+(enregistres>1?'s':'')+' enregistré'+(enregistres>1?'s':'')+' ✅ ':'Ok, rien gardé 🙂 ')+'Autre chose ?');
  };
  const fige=(i,txt)=>{
    const p=d.querySelector('.mg-prop[data-i="'+i+'"]');
    p.style.opacity=.5;
    p.querySelector('.mg-prop-btns').innerHTML='<span class="todo-date">'+txt+'</span>';
    restants--;clore();
  };
  d.querySelectorAll('[data-mgok]').forEach(b=>{b.onclick=()=>{
    const i=Number(b.dataset.mgok);
    const n=magiEnregistrer([actions[i]]);
    const t=actions[i].type;
    const mot=t==='cocher'?(actions[i].faite===false?'✓ remise à faire':'✓ cochée')
      :t==='reporter'?'✓ reportée':t==='supprimer'?'✓ supprimée':'✓ enregistré';
    if(n){enregistres++;fige(i,mot)}else fige(i,'⚠️ incomplet, non enregistré');
  }});
  d.querySelectorAll('[data-mgsuppr]').forEach(b=>{b.onclick=()=>fige(Number(b.dataset.mgsuppr),'retiré')});
  d.querySelectorAll('[data-mgedit]').forEach(b=>{b.onclick=()=>{
    const i=Number(b.dataset.mgedit);
    fige(i,'✏️ ouvert en formulaire');
    magiCorriger(actions[i]);
  }});
}
/* Qui vit à la maison → qui peut se voir confier une tâche. Adultes d'abord. */
/* Adulte ou enfant. Tant que ce n'est pas posé dans ⚙️ Réglages, on retombe
   sur ce qu'on sait : avoir un compte, ou avoir 18 ans. */
function estAdulte(p){
  if(!p)return false;
  if(p.adulte===true)return true;
  if(p.adulte===false)return false;
  if((p.email||'').trim())return true;
  if(p.naiss_annee)return (new Date().getFullYear()-p.naiss_annee)>=18;
  return false;
}
function adultesMaison(){return CACHE.personnes.filter(p=>p.foyer&&estAdulte(p))}
/* Qui peut accompagner un enfant : la maison, mais aussi Zora, une grand-mère,
   la maman d'un copain. Hors foyer, on ne connaît pas les âges — on suppose
   adulte sauf si on a dit le contraire.
   Apparaissent en pastilles : la maison, plus celles à qui tu l'as déjà confié.
   Les autres restent dans le menu, pour ne pas noyer l'écran. */
function dejaAccompagne(){
  const v=new Set();
  lesActs().forEach(a=>{if(a.accompagne)v.add(a.accompagne.trim().toLowerCase())});
  (CACHE.accomp||[]).forEach(x=>{if(x.qui)v.add(x.qui.trim().toLowerCase())});
  return v;
}
function accompagnateurs(){
  const maison=adultesMaison();
  const vus=dejaAccompagne();
  const dedans=new Set(maison.map(p=>p.id));
  const dehors=CACHE.personnes.filter(p=>!p.foyer&&p.adulte!==false&&!dedans.has(p.id))
    .sort((a,b)=>a.nom.localeCompare(b.nom));
  const habitues=dehors.filter(p=>vus.has(p.nom.trim().toLowerCase()));
  const reste=dehors.filter(p=>!vus.has(p.nom.trim().toLowerCase()));
  return {chips:maison.concat(habitues),menu:reste};
}
function enfantsMaison(){return CACHE.personnes.filter(p=>p.foyer&&!estAdulte(p))}
/* Qui emmène, pour une occurrence précise. L'exception gagne sur l'habitude,
   mais ne l'écrase jamais. */
function quiAccompagne(act,d){
  const j=iso(d);
  const ex=(CACHE.accomp||[]).find(x=>x.activite_id===act.id&&x.jour===j);
  if(ex)return {qui:ex.qui||null,exception:true};
  return {qui:act.accompagne||null,exception:false};
}
function poserAccompagnateur(act,d,qui,pourToujours){
  if(pourToujours){
    enregistrerObjet(act.id,'acts',{accompagne:qui||null});
    // l'habitude change : les exceptions à venir ne servent plus à rien
    const aJeter=(CACHE.accomp||[]).filter(x=>x.activite_id===act.id&&x.jour>=iso(new Date()));
    aJeter.forEach(x=>{
      const i=CACHE.accomp.indexOf(x);
      if(i>=0)CACHE.accomp.splice(i,1);
      pousser(sb.from('accompagnements').delete().eq('id',x.id));
    });
    return;
  }
  const j=iso(d),id=act.id+'-'+j;
  const dejaI=(CACHE.accomp||[]).findIndex(x=>x.id===id);
  if(dejaI>=0){
    CACHE.accomp[dejaI]={...CACHE.accomp[dejaI],qui:qui||null};
    pousser(sb.from('accompagnements').update({qui:qui||null}).eq('id',id));
  }else{
    const l={id,activite_id:act.id,jour:j,qui:qui||null,pose_par:UTILISATEUR||null};
    CACHE.accomp.push(l);
    pousser(sb.from('accompagnements').insert(l));
  }
}
function recalculerMembres(){
  const comptes=CACHE.comptes||[];
  const foyer=CACHE.personnes.filter(p=>p.foyer).map(p=>p.nom);
  const rang=(n)=>comptes.some(c=>String(c).trim().toLowerCase()===String(n).trim().toLowerCase())?0:1;
  CACHE.membres=(foyer.length?foyer:comptes).slice().sort((a,b)=>rang(a)-rang(b));
}
function nomDe(id){
  const o=trouverParId(String(id||''));
  return o?(o.texte||o.titre||o.idee||'') : '(introuvable)';
}
function magiResume(a){
  const dfr=s=>{if(!s)return '';const d=deIso(s);return DFR[jSem(d)-1].toLowerCase()+' '+d.getDate()+' '+MFR[d.getMonth()].toLowerCase()};
  const badge=x=>x?'👥 partagée':'🔒 privée';
  switch(a.type){
    case 'evenement':return {ico:'📌',type:'Événement',titre:a.titre,det:[dfr(a.debut),a.fin&&a.fin!==a.debut?'→ '+dfr(a.fin):null,a.heure,a.qui?'pour '+a.qui:null].filter(Boolean).join(' · ')};
    case 'tache':return {ico:'✅',type:'Tâche',titre:a.texte,det:[(GROUPES[a.cat]||GROUPES.other),a.ech?'avant le '+dfr(a.ech):null,a.qui?'👤 '+a.qui:'👤 non assignée',a.sante_de?'🩺 santé de '+a.sante_de:null,
      /* Une tâche commune est annoncée à la maison : la proposition doit le
         dire avant qu'on valide, pas après. */
      a.partagee===false?'🔒 pour toi seule':'👥 la maison sera prévenue'].filter(Boolean).join(' · ')};
    case 'emmene':return {ico:'🚗',type:'Qui emmène',titre:(a.qui||'Personne')+' emmène — '+(a.activite||''),
      det:a.toujours?'à partir de maintenant, c\'est l\'habitude':(a.jour?'seulement le '+dfr(a.jour):'seulement cette fois')};
    case 'course':return {ico:'🛒',type:'Courses',titre:a.texte,det:'ajouté à la liste partagée'};
    case 'maison':{
      const det=a.genre==='abonnement'
        ?['reconduction '+dfr(a.echeance),(a.resilier_avant_jours??30)+' j de préavis',a.montant_mois?a.montant_mois+' €/mois':null].filter(Boolean).join(' · ')
        :['tous les '+a.tous_les_mois+' mois','dernière fois '+dfr(a.derniere_fois)].filter(Boolean).join(' · ');
      return {ico:'🏠',type:a.id?'Maison — correction':(a.genre==='abonnement'?'Abonnement':'Entretien'),titre:a.nom,det};
    }
    case 'dose':{
      const t=(CACHE.traitements||[]).find(x=>x.id===a.id);
      return {ico:'💊',type:a.faite===false?'Prise annulée':'Prise',
        titre:a.texte||(t?t.medicament:'la prise'),
        det:[a.moment,dfr(a.jour||iso(new Date())),t&&t.dose?t.dose:null].filter(Boolean).join(' · ')};
    }
    case 'repas':{
      const r=a.recette?(CACHE.recettes||[]).find(x=>x.nom.trim().toLowerCase()===String(a.recette).trim().toLowerCase()):null;
      const n=r?(r.ingredients||[]).length:0;
      return {ico:'🍽️',type:'Repas',titre:r?r.nom:(a.texte||a.recette||'?'),
        det:[dfr(a.jour),n?n+' ingrédient'+(n>1?'s':'')+' dans les courses':'sans recette notée'].filter(Boolean).join(' · ')};
    }
    case 'cadeau':return {ico:'🎁',type:'Idée cadeau',titre:a.idee,det:'pour '+(a.personne||'?')+' · '+badge(a.partagee)};
    case 'note':return {ico:'🧠',type:'Note',titre:a.texte,det:'sur '+(a.personne||'?')+(a.categorie&&!CACHE.personnes.some(x=>x.nom.trim().toLowerCase()===String(a.personne||'').trim().toLowerCase())?' · '+emojiCat(a.categorie)+' '+a.categorie:'')+' · '+badge(a.partagee)};
    case 'envie':return {ico:'✨',type:'Envie',titre:a.titre,det:(ENV_CATS.find(c=>c[0]===a.categorie)||[,'','Autre'])[2]+' · '+badge(a.partagee)};
    case 'cocher':return {ico:a.faite===false?'↩️':'☑️',type:a.faite===false?'À refaire':'Fait',titre:a.texte||nomDe(a.id),
      det:a.faite===false?'on la remet à faire':'on la coche comme faite'};
    case 'reporter':return {ico:'📆',type:'Reporté',titre:a.texte||nomDe(a.id),
      det:a.ech?'nouvelle échéance : '+dfr(a.ech):'sans date'};
    case 'supprimer':return {ico:'🗑️',type:'Suppression',titre:a.texte||nomDe(a.id),det:'on la retire de la liste'};
    case 'relance_annule':return {ico:'🚫',type:'Relance annulée',titre:a.texte||'(la relance prévue)',
      det:'je ne la dirai pas'};
    case 'evenement_modif':{const e=lesEvts().find(x=>x.id===a.id);
      const ch=[a.titre?'renommé « '+a.titre+' »':null,
        a.debut?'déplacé au '+dfr(a.debut):null,
        !a.debut&&a.fin?'jusqu\'au '+dfr(a.fin):null,
        a.heure?'à '+a.heure:null,a.qui?'pour '+a.qui:null].filter(Boolean).join(' · ');
      return {ico:'📅',type:'Agenda',titre:e?e.titre:'(événement)',det:ch||'rien ne change'}}
    case 'relance':{const p=String(a.quand||'').split('T');
      return {ico:'⏰',type:'Relance',titre:a.texte||'(vide)',
        det:[a.qui?'à '+a.qui:'pour toi',dfr(p[0]),(p[1]||'').slice(0,5)].filter(Boolean).join(' · ')}}
    default:return {ico:'❓',type:String(a.type||'?'),titre:'(non reconnu)',det:''};
  }
}
function magiEnregistrer(actions){
  let n=0;
  actions.forEach(a=>{
    if(a.type==='evenement'&&a.titre){
      enregistrerObjet(null,'evts',{titre:a.titre,cat:['event','voyage','pro','rentree'].includes(a.cat)?a.cat:'event',
        debut:a.debut||iso(new Date()),fin:a.fin||null,heure:a.heure||null,qui:a.qui||null,detail:a.detail||null});n++;
    }else if(a.type==='tache'&&a.texte){
      delete a._dateOk;delete a._quiOk;
      const ech=a.ech||null;
      const base=ech?deIso(ech):new Date();
      // une action de santé se rattache à la personne : même tâche, visible aussi chez elle
      const cible=a.sante_de?CACHE.personnes.find(x=>x.nom.trim().toLowerCase()===String(a.sante_de).trim().toLowerCase()):null;
      enregistrerObjet(null,'taches',{texte:a.texte,cat:cible?'sante':(GROUPES[a.cat]?a.cat:'other'),qui:a.qui||'',ech,
        dateTexte:ech?'Avant le '+deIso(ech).getDate()+' '+MFR[deIso(ech).getMonth()].toLowerCase():'',
        persistante:false,lien:cible?cible.id:'',y:base.getFullYear(),m:base.getMonth()+1,debY:null,debM:null,finY:null,finM:null,
        partagee:a.partagee!==false});n++;
    }else if(a.type==='emmene'&&a.activite_id){
      const act=lesActs().find(x=>x.id===a.activite_id);
      if(!act){toast('⚠️ Je n\'ai pas retrouvé cette activité');return}
      poserAccompagnateur(act,a.jour?deIso(a.jour):new Date(),a.qui||'',!!a.toujours);n++;
    }else if(a.type==='course'&&a.texte){
      enregistrerObjet(null,'courses',{texte:a.texte,coche:false,achete_le:null});n++;
    }else if(a.type==='cadeau'&&a.idee){
      enregistrerObjet(null,'cadeaux',{personne:(a.personne||'?').trim(),idee:a.idee,detail:a.detail||null,offert:false,
        partagee:!!a.partagee,email_auteur:EMAIL_CONNECTE});n++;
    }else if(a.type==='note'&&a.texte){
      const nom=(a.personne||'?').trim();
      let pers=CACHE.personnes.find(x=>x.nom.trim().toLowerCase()===nom.toLowerCase());
      if(!pers){pers={id:genId(),nom};enregistrerObjet(null,'personnes',{id:pers.id,nom,
        role:String(a.role||'').trim()||null,
        role_auteur:String(a.role||'').trim()?EMAIL_CONNECTE:null,
        categorie:rangerCategorie(a.categorie)})}
      enregistrerObjet(null,'notes',{personne_id:pers.id,texte:a.texte,partagee:!!a.partagee,
        email_auteur:EMAIL_CONNECTE,cree_le:new Date().toISOString()});n++;
    }else if(a.type==='relance_annule'&&a.id){
      /* Annulée, pas effacée : « tu devais me dire quoi, déjà ? » mérite
         une réponse même après coup. */
      pousser(sb.from('relances').update({annulee:true}).eq('id',a.id).is('envoye_le',null));n++;
    }else if(a.type==='evenement_modif'&&a.id){
      /* Seuls les champs fournis bougent : corriger une heure ne doit pas
         effacer le titre ni la date de fin. */
      const e=lesEvts().find(x=>x.id===a.id);
      if(!e){toast('⚠️ Je n\'ai pas retrouvé cet événement');return}
      const chg={};
      ['titre','debut','fin','heure','qui'].forEach(k=>{if(a[k]!=null)chg[k]=a[k]});
      if(!Object.keys(chg).length)return;
      enregistrerObjet(a.id,'evts',chg);n++;render();
    }else if(a.type==='relance'&&a.texte&&a.quand){
      /* Une relance ne vit pas dans le CACHE : rien ne l'affiche, elle part
         toute seule. On l'écrit donc directement, sans passer par la
         mécanique des listes. L'heure saisie est l'heure d'ici — le
         navigateur est à Paris, toISOString() fait la conversion. */
      const m=(CACHE.utilisateurs||[]).find(x=>String(x.nom||'').toLowerCase()===String(a.qui||'').trim().toLowerCase());
      const t=new Date(String(a.quand));
      if(!isNaN(t)){
        pousser(sb.from('relances').insert({id:genId(),de_email:EMAIL_CONNECTE,
          pour_email:m?.email||EMAIL_CONNECTE,pour_nom:m?.nom||null,
          texte:a.texte,quand:t.toISOString()}));n++;
      }
    }else if((a.type==='cocher'||a.type==='reporter'||a.type==='supprimer')&&a.id){
      const cible=trouverParId(String(a.id));
      if(!cible){toast('⚠️ Je n\'ai pas retrouvé cet élément');return}
      const coll=collectionDe(cible.id);
      if(a.type==='cocher'){
        const veut=a.faite!==false;
        if(coll==='courses'){
          enregistrerObjet(cible.id,'courses',{coche:veut,coche_par:veut?EMAIL_CONNECTE:null});n++;
        }else if(coll==='cadeaux'){
          enregistrerObjet(cible.id,'cadeaux',{offert:veut});n++;
        }else if(coll==='envies'){
          enregistrerObjet(cible.id,'envies',{faite:veut});n++;
        }else if(coll==='taches'){
          if(estFaite(cible.id)!==veut)basculerFaite(cible.id);
          n++;
        }else{
          /* Un événement n'a pas de colonne « fait ». On le disait quand
             même coché : une fausse confirmation, silencieuse. */
          toast('⚠️ Ça ne se coche pas — dis-moi plutôt de le supprimer');
        }
      }else if(a.type==='supprimer'){
        supprimerObjet(cible.id);n++;
      }else{
        /* Reporter n'existe que pour les tâches. Avant, on envoyait un
           update sur `taches` avec l'identifiant d'un événement : zéro ligne
           touchée, aucune erreur, et « ✓ reportée » affiché quand même. */
        if(coll!=='taches'){
          toast('⚠️ Je ne sais reporter que les tâches, pas ça');
        }else{
          const ech=a.ech||null;
          const base=ech?deIso(ech):new Date();
          enregistrerObjet(cible.id,'taches',{ech,
            dateTexte:ech?'Avant le '+deIso(ech).getDate()+' '+MFR[deIso(ech).getMonth()].toLowerCase():'',
            y:base.getFullYear(),m:base.getMonth()+1});n++;
        }
      }
      render();
    }else if(a.type==='maison'&&a.nom&&a.genre){
      const coll=a.genre==='abonnement'?'abonnements':'entretiens';
      const l={nom:a.nom};
      const garde=k=>{if(a[k]!==undefined&&a[k]!==null)l[k]=a[k]};
      ['emoji','contact_nom','contact_tel','note'].forEach(garde);
      if(a.genre==='abonnement')['fournisseur','echeance','resilier_avant_jours','reconduction_tacite','montant_mois','reference','depuis'].forEach(garde);
      else ['derniere_fois','tous_les_mois','prevenir_avant_jours','categorie'].forEach(garde);
      if(a.id)enregistrerObjet(a.id,coll,l);
      else{l.id=genId();enregistrerObjet(null,coll,l)}
      n++;
    }else if(a.type==='dose'&&a.id&&a.moment){
      const jour=a.jour||iso(new Date());
      const id=a.id+'-'+jour+'-'+a.moment;
      const i=CACHE.prises.findIndex(x=>x.id===id);
      if(a.faite===false){
        if(i>=0){CACHE.prises.splice(i,1);pousser(sb.from('sante_prises').delete().eq('id',id))}
      }else if(i<0){
        const l={id,traitement_id:a.id,jour,moment:a.moment,par:UTILISATEUR||null};
        CACHE.prises.push(l);pousser(sb.from('sante_prises').insert(l));
      }
      n++;
    }else if(a.type==='repas'&&a.jour){
      // Le tri « je l'ai déjà » se fait dans l'écran des repas ; ici on pose
      // le menu complet, comme Pia le fait avant de proposer le tri.
      const r=a.recette?(CACHE.recettes||[]).find(x=>x.nom.trim().toLowerCase()===String(a.recette).trim().toLowerCase()):null;
      poserMenu(a.jour,r?r.id:null,r?null:(a.texte||a.recette||''));n++;
    }else if(a.type==='envie'&&a.titre){
      enregistrerObjet(null,'envies',{categorie:ENV_CATS.some(c=>c[0]===a.categorie)?a.categorie:'autre',titre:a.titre,
        detail:a.detail||null,faite:false,partagee:!!a.partagee,email_auteur:EMAIL_CONNECTE,cree_le:new Date().toISOString()});n++;
    }
  });
  return n;
}
function magiCorriger(a){
  const set=(id,v)=>{const el=document.getElementById(id);if(el&&v!=null)el.value=v};
  const coche=(id,v)=>{const el=document.getElementById(id);if(el)el.checked=!!v};
  /* « Qui » n'est plus un menu mais des pastilles : on appuie dessus pour elle,
     ce qui laisse le formulaire dans le même état que si elle l'avait fait. */
  const cocheQui=(v)=>{
    const s=String(v||'').trim();if(!s)return;
    if(/^toute la famille$/i.test(s)){document.querySelector('#f-qui [data-tous]')?.click();return}
    s.split(/[,+]/).map(x=>x.trim()).filter(Boolean).forEach(n=>{
      const bt=[...document.querySelectorAll('#f-qui [data-q]')].find(x=>x.dataset.q===n);
      if(bt&&!bt.classList.contains('actif'))bt.click();
    });
  };
  if(a.type==='evenement'){
    formEvt(null,a.debut||null);
    setTimeout(()=>{set('f-titre',a.titre);set('f-cat',['event','voyage','pro','rentree'].includes(a.cat)?a.cat:'event');
      set('f-debut',a.debut);set('f-fin',a.fin||a.debut);set('f-heure',a.heure||'');
      cocheQui(a.qui||'');set('f-detail',a.detail||'')},60);
  }else if(a.type==='tache'){
    formTache(null);
    setTimeout(()=>{set('f-texte',a.texte);set('f-ech',a.ech||'');set('f-qui',a.qui||'');set('f-cat',GROUPES[a.cat]?a.cat:'other')},60);
  }else if(a.type==='cadeau'){
    formCadeau();
    setTimeout(()=>{set('fk-personne',a.personne||'');set('fk-idee',a.idee||'');set('fk-detail',a.detail||'');coche('fk-partagee',a.partagee)},60);
  }else if(a.type==='note'){
    formNote();
    setTimeout(()=>{set('fn-personne',a.personne||'');set('fn-texte',a.texte||'');coche('fn-partagee',a.partagee)},60);
  }else if(a.type==='envie'){
    formEnvie();
    setTimeout(()=>{set('fe-titre',a.titre||'');set('fe-cat',ENV_CATS.some(c=>c[0]===a.categorie)?a.categorie:'autre');set('fe-detail',a.detail||'');coche('fe-partagee',a.partagee)},60);
  }
}

/* Les catégories déjà utilisées, avec leur nombre. Sert à ranger la liste
   ET à guider l'IA pour qu'elle réutilise au lieu d'inventer. */
function categoriesUtilisees(){
  const m={};
  CACHE.personnes.forEach(x=>{
    const c=String(x.categorie||'').trim();
    if(c)m[c]=(m[c]||0)+1;
  });
  return Object.entries(m).map(([nom,n])=>({nom,n})).sort((a,b)=>b.n-a.n||a.nom.localeCompare(b.nom));
}
const EMOJIS_CAT={'famille':'👪','amis':'🤝','école':'🏫','ecole':'🏫','santé':'🩺','sante':'🩺',
  'services':'🔧','travail':'💼','voisins':'🏡'};
const emojiCat=(c)=>EMOJIS_CAT[String(c||'').trim().toLowerCase()]||'👥';
/* On réutilise le mot déjà employé s'il existe, à la casse près : « Amis »
   et « amis » ne doivent pas faire deux coins différents. */
function rangerCategorie(txt){
  const v=String(txt||'').trim();
  if(!v)return null;
  const deja=categoriesUtilisees().find(c=>c.nom.toLowerCase()===v.toLowerCase());
  return deja?deja.nom:v;
}
/* Une étagère se mérite : en dessous de 3 personnes, pas de section à soi. */
const SEUIL_ETAGERE=3;

/* De qui on a parlé récemment — sans jamais prétendre juger de l'importance */
function gensRecents(exclusIds){
  const auj=new Date(),score={};
  const marque=(id,pts)=>{if(id&&!exclusIds.has(id))score[id]=(score[id]||0)+pts};
  notesVisibles().forEach(n=>{
    const j=(auj-new Date(n.cree_le||0))/864e5;
    if(j<45)marque(n.personne_id,j<7?4:j<21?3:2);
  });
  CACHE.personnes.forEach(x=>{
    if(!x.naiss_jour||!x.naiss_mois)return;
    let d=new Date(auj.getFullYear(),x.naiss_mois-1,x.naiss_jour);
    if(d<auj)d=new Date(auj.getFullYear()+1,x.naiss_mois-1,x.naiss_jour);
    const j=Math.round((d-auj)/864e5);
    if(j<=45)marque(x.id,3);
  });
  const nomsActifs=new Set();
  lesActs().forEach(a=>String(a.qui||'').split(/[+&,]/).forEach(v=>nomsActifs.add(v.trim().toLowerCase())));
  CACHE.evts.filter(e=>(e.fin||e.debut)>=iso(auj)).forEach(e=>
    String(e.qui||'').split(/[+&,]/).forEach(v=>nomsActifs.add(v.trim().toLowerCase())));
  CACHE.personnes.forEach(x=>{if(nomsActifs.has(x.nom.trim().toLowerCase()))marque(x.id,2)});
  return Object.entries(score).sort((a,b)=>b[1]-a[1]).slice(0,4)
    .map(([id])=>CACHE.personnes.find(x=>x.id===id)).filter(Boolean);
}

/* Deux mots pour la même chose : « école » et « ecole Victor Hugo ». On le
   signale une fois, discrètement, et jamais deux fois si elle a dit non. */
function normCat(c){return String(c||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'')}
let catRefus=null;
function lireRefus(){
  if(catRefus)return catRefus;
  catRefus=[];
  try{catRefus=JSON.parse(localStorage.getItem('catRefus')||'[]')}catch(e){}
  return catRefus;
}
function jumellesCat(){
  const refus=lireRefus();
  const cs=categoriesUtilisees();
  for(let i=0;i<cs.length;i++)for(let j=i+1;j<cs.length;j++){
    const a=cs[i],b=cs[j],na=normCat(a.nom),nb=normCat(b.nom);
    if(!na||!nb)continue;
    const proche=na===nb||na.startsWith(nb)||nb.startsWith(na)||
      (na.length>4&&nb.length>4&&na.slice(0,5)===nb.slice(0,5));
    if(!proche)continue;
    const cle=[a.nom,b.nom].sort().join('|');
    if(refus.includes(cle))continue;
    return {a,b,cle};
  }
  return null;
}
function fusionnerCat(garde,vire){
  CACHE.personnes.filter(p=>String(p.categorie||'')===vire)
    .forEach(p=>enregistrerObjet(p.id,'personnes',{categorie:garde}));
  toast('C\'est regroupé ✔');
  renderMemoire();
}
function refuserFusion(cle){
  const r=lireRefus();
  r.push(cle);
  try{localStorage.setItem('catRefus',JSON.stringify(r))}catch(e){}
  renderMemoire();
}

/* Une proposition, seulement quand il y a un indice. Sinon on laisse vide :
   mieux vaut « à ranger » qu'un tirage au sort. */
const INDICES=[
  [/pédiatre|medecin|médecin|docteur|^dr\b|dentiste|ophtalmo|kiné|kine|orthophon|psy|infirmi|sage-femme|allergo|dermato/i,'santé'],
  [/maîtresse|maitresse|instit|professeur|prof\b|école|ecole|collège|college|lycée|lycee|atsem|directrice|directeur d/i,'école'],
  [/nounou|baby|garde|femme de ménage|ménage|plombier|électricien|electricien|serrurier|garagiste|coiffeur|coiffeuse|jardinier|assistante maternelle|taxi|vétérinaire|veterinaire/i,'services'],
  [/mère|mere|père|pere|maman|papa|sœur|soeur|frère|frere|tante|oncle|cousin|cousine|grand-|mamie|papy|papi|belle-|beau-|fils|fille|neveu|nièce|niece|marraine|parrain/i,'famille'],
  [/voisin|voisine/i,'voisins'],
  [/collègue|collegue|patron|associé|associe|client|boulot|bureau/i,'travail'],
  [/ami|copain|copine|pote/i,'amis'],
];
/* On ne lit QUE ce qui décrit la personne : son rôle, ce qu'on a mis à côté de
   son nom. Jamais le contenu des notes — « elle cherche une nounou » ne fait
   pas d'elle une nounou. Sans indice, on laisse vide plutôt que de tirer au sort. */
function devineCategorie(p){
  const t=[p.role||'',p.detail||''].join(' ');
  for(const [re,cat] of INDICES)if(re.test(t))return cat;
  if(/^dr\b|^docteur/i.test(p.nom||''))return 'santé';
  for(const [re,cat] of INDICES)if(re.test(p.nom||''))return cat;
  return '';
}
const CATS_BASE=['famille','amis','école','santé','services','travail','voisins'];
/* Le rôle est écrit du point de vue de celui qui l'a noté. « Ma sœur » est
   faux sur l'écran de Didier ; « collègue » aussi, plus sournoisement. Aux
   autres, on précise par rapport à qui — sans jamais inventer de lien. */
function prenomDe(email){
  const e=String(email||'').toLowerCase();
  if(!e)return '';
  const x=CACHE.personnes.find(y=>(y.email||'').toLowerCase()===e);
  return x?x.nom:e.split('@')[0];
}
const CATS_RELATIONNELLES=['famille','amis','voisins','travail'];
function roleAffiche(p){
  let r=String(p.role||'').trim();
  if(!r)return '';
  const auteurMail=(p.role_auteur||'').toLowerCase();
  if(!auteurMail||auteurMail===EMAIL_CONNECTE)return r;   // c'est moi qui l'ai écrit
  const auteur=prenomDe(auteurMail);
  if(!auteur)return r;
  const poss=r.match(/^(?:ma|mon|mes)\s+(.+)/i);
  if(poss)r=poss[1];
  if(/\bde\b|\bd'/i.test(r))return r;                    // déjà ancré : « la maman de Martin »
  if(poss)return r+' de '+auteur;                          // le possessif est un signal explicite
  for(const [re,cat] of INDICES)if(re.test(r))
    return CATS_RELATIONNELLES.includes(cat)?r+' de '+auteur:r;
  return r+' — noté par '+auteur;                          // inconnu : on attribue, on n'invente pas
}
function catsProposees(){
  const v=categoriesUtilisees().map(c=>c.nom);
  CATS_BASE.forEach(c=>{if(!v.some(x=>x.toLowerCase()===c))v.push(c)});
  return v;
}
function formQuiEstQui(){
  rangementOuvert=true;rangementChoix={};rangementLigne=null;
  CACHE.personnes.filter(x=>!x.foyer).forEach(p=>{
    rangementChoix[p.id]=String(p.categorie||'').trim()||devineCategorie(p);
  });
  renderMemoire();
}
function renderRangement(zone){
  const gens=CACHE.personnes.filter(x=>!x.foyer).sort((a,b)=>a.nom.localeCompare(b.nom));
  const cats=catsProposees();
  const nProp=gens.filter(p=>rangementChoix[p.id]&&!String(p.categorie||'').trim()).length;
  let h=`<button class="btn mini" id="qq-retour" style="margin-bottom:12px">‹ Les gens</button>
  <h2 class="ps-titre">🗂️ Dire qui est qui</h2>
  <p class="discret2">${gens.length} personne${gens.length>1?'s':''}${nProp?` · j'ai proposé quelque chose quand j'avais un indice — corrige ce qui cloche`:` · un mot par personne, ça sert juste à s'y retrouver`}.</p>`;
  gens.forEach(p=>{
    const c=rangementChoix[p.id]||'';
    const ouvert=rangementLigne===p.id;
    h+=`<div class="qq-carte" data-p="${p.id}">
      <div class="qq-nom">${p.emoji||'🧑'} ${echap(p.nom)}
        <span style="flex:1"></span>
        <span class="pp-fait ${c?'':'vide'}" data-ouvre="${p.id}">${c?emojiCat(c)+' '+echap(c):'à ranger'}</span></div>
      ${roleAffiche(p)?`<div class="qq-ind">${echap(roleAffiche(p))}</div>`:''}
      ${ouvert?`<div class="mg-chips" data-chips="${p.id}">
        ${cats.map(x=>`<button class="mg-chip ${x.toLowerCase()===c.toLowerCase()?'actif':''}" data-c="${attr(x)}">${emojiCat(x)} ${echap(x)}</button>`).join('')}
        </div>
        <input type="text" class="qq-libre" data-libre="${p.id}" value="${attr(cats.some(x=>x.toLowerCase()===c.toLowerCase())?'':c)}" placeholder="ou un autre mot…">`:''}
    </div>`;
  });
  h+=`<div class="qq-barre">
    <span class="discret2" style="flex:1">On peut en laisser sans, ça marche quand même.</span>
    <button class="btn primaire" id="qq-ok">C'est bon</button></div>`;
  zone.innerHTML=h;
  document.getElementById('qq-retour').onclick=()=>{rangementOuvert=false;renderMemoire()};
  zone.querySelectorAll('[data-ouvre]').forEach(el=>{el.onclick=(ev)=>{
    ev.stopPropagation();
    rangementLigne=(rangementLigne===el.dataset.ouvre)?null:el.dataset.ouvre;
    renderMemoire();
  }});
  zone.querySelectorAll('[data-chips] [data-c]').forEach(b=>{b.onclick=()=>{
    const pid=b.closest('[data-chips]').dataset.chips,v=b.dataset.c;
    rangementChoix[pid]=(String(rangementChoix[pid]||'').toLowerCase()===v.toLowerCase())?'':v;
    rangementLigne=null;
    renderMemoire();
  }});
  zone.querySelectorAll('[data-libre]').forEach(inp=>{
    inp.addEventListener('input',()=>{rangementChoix[inp.dataset.libre]=inp.value});
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){rangementLigne=null;renderMemoire()}});
  });
  document.getElementById('qq-ok').onclick=()=>{
    let n=0;
    gens.forEach(p=>{
      const v=rangerCategorie(rangementChoix[p.id]);
      const avant=String(p.categorie||'').trim()||null;
      if(v!==avant){enregistrerObjet(p.id,'personnes',{categorie:v});n++}
    });
    rangementOuvert=false;rangementLigne=null;
    toast(n?'C\'est rangé ✔':'Rien n\'a changé');
    renderMemoire();
  };
}

function renderMemoire(){
  const zone=document.getElementById('vueMemoire');
  const p=persOuverte?CACHE.personnes.find(x=>x.id===persOuverte):null;
  if(p){renderFichePersonne(zone,p);return}
  persOuverte=null;
  if(rangementOuvert){renderRangement(zone);return}
  if(ongletMem==='envies'){renderEnvies(zone);return}
  if(ongletMem==='cadeaux'){renderCadeaux(zone);return}
  if(ongletMem==='recettes'){renderRecettes();return}
  const visibles=notesVisibles();
  const parPers={};visibles.forEach(n=>{(parPers[n.personne_id]=parPers[n.personne_id]||[]).push(n)});
  const tous=[...CACHE.personnes].sort((a,b)=>a.nom.localeCompare(b.nom));
  const enRecherche=!!rechercheMem.trim();
  const trouves=enRecherche?tous.filter(x=>x.nom.toLowerCase().includes(rechercheMem.toLowerCase())
    ||String(x.role||'').toLowerCase().includes(rechercheMem.toLowerCase())):tous;

  const ligneGens=(x)=>{
    const notes=(parPers[x.id]||[]).sort((a,b)=>(a.cree_le||'')<(b.cree_le||'')?1:-1);
    const bouts=[];
    if(x.naiss_jour&&x.naiss_mois)bouts.push('🎂 '+x.naiss_jour+' '+MFR[x.naiss_mois-1].toLowerCase());
    if(notes.length)bouts.push(notes.length+(notes.length>1?' choses notées':' chose notée'));
    const kdo=cadeauxVisibles().filter(c=>!c.offert&&(c.personne||'').trim().toLowerCase()===x.nom.trim().toLowerCase()).length;
    if(kdo)bouts.push(kdo+' idée'+(kdo>1?'s':'')+' gardée'+(kdo>1?'s':''));
    return `<div class="todo-item" data-id="${x.id}" style="cursor:pointer">
      <div style="flex-shrink:0;font-size:1.15rem">${x.emoji||'🧑'}</div>
      <div class="todo-corps"><div class="todo-text">${echap(x.nom)}${roleAffiche(x)?` <span class="todo-date">· ${echap(roleAffiche(x))}</span>`:''}</div>
      <div class="todo-date">${bouts.length?echap(bouts.join(' · ')):'On n\'a encore rien noté'}</div></div>
      <div style="color:var(--ink-3)">›</div></div>`;
  };

  let h=`<h2 class="ps-titre">🧠 Mémoire</h2>
    <p class="discret2">Ce que tu veux garder sur les gens. 🔒 Ce que tu écris reste pour toi — sauf si tu le partages.</p>
  <div class="ps-ajout">
    ${CACHE.personnes.length>6?`<input type="text" id="mem-recherche" placeholder="🔍 Chercher quelqu'un…" value="${attr(rechercheMem)}">`:''}
    <button class="btn primaire" id="mem-ajouter" style="${CACHE.personnes.length>6?'':'width:100%'}">+ Ajouter</button>
  </div>`;
  if(!CACHE.personnes.length){
    h+=`<div class="todo-empty" style="text-align:center;padding:24px 0">Personne pour l'instant.<br>Commence par celle que tu as peur d'oublier 😉</div>`;
  }else if(enRecherche){
    if(!trouves.length)h+=`<div class="todo-empty" style="text-align:center;padding:16px 0">Personne ne correspond à « ${echap(rechercheMem)} »<br>
      <button class="btn mini" id="mem-creer-cherche" style="margin-top:10px">Ajouter « ${echap(rechercheMem.trim())} »</button></div>`;
    trouves.forEach(x=>{h+=ligneGens(x)});
  }else{
    const vus=new Set();
    const bloc=(titre,gens,n)=>{
      if(!gens.length)return '';
      gens.forEach(x=>vus.add(x.id));
      return `<div class="mem-groupe">${titre}${n?`<span class="mg-n">${n}</span>`:''}</div>`+gens.map(ligneGens).join('');
    };
    const maison=tous.filter(x=>x.foyer);
    h+=bloc('🏠 À la maison',maison,maison.length);
    const recents=gensRecents(vus);
    h+=bloc('↩︎ Dont tu as parlé récemment',recents,'');
    // Une étagère apparaît quand elle a assez de monde
    categoriesUtilisees().filter(c=>c.n>=SEUIL_ETAGERE).forEach(c=>{
      const gens=tous.filter(x=>!vus.has(x.id)&&String(x.categorie||'').trim()===c.nom);
      h+=bloc(emojiCat(c.nom)+' '+echap(c.nom.charAt(0).toUpperCase()+c.nom.slice(1)),gens,gens.length);
    });
    const reste=tous.filter(x=>!vus.has(x.id));
    if(reste.length){
      h+=`<div class="mem-plier" data-plier="1">${memAutresOuvert?'▾':'▸'} Tous les autres
        <span class="mg-n">${reste.length}</span></div>`;
      if(memAutresOuvert)reste.forEach(x=>{h+=ligneGens(x)});
    }
    const jum=jumellesCat();
    if(jum){
      const garde=jum.a.nom.length<=jum.b.nom.length?jum.a.nom:jum.b.nom;
      const vire=garde===jum.a.nom?jum.b.nom:jum.a.nom;
      h+=`<div class="qq-carte" id="mem-jum" style="margin-top:16px" data-garde="${attr(garde)}" data-vire="${attr(vire)}" data-cle="${attr(jum.cle)}">
        <div class="qq-ind" style="margin-bottom:8px">« ${echap(jum.a.nom)} » et « ${echap(jum.b.nom)} » — c'est la même chose ?</div>
        <div class="mg-chips"><button class="mg-chip" data-jum="oui">Oui, tout mettre dans « ${echap(garde)} »</button>
        <button class="mg-chip" data-jum="non">Non, c'est différent</button></div>
      </div>`;
    }
    const sansCat=tous.filter(x=>!x.foyer&&!String(x.categorie||'').trim());
    if(sansCat.length>=5)
      h+=`<button class="btn" id="mem-ranger" style="width:100%;margin-top:14px">🗂️ Dire qui est qui — ${sansCat.length} personnes</button>`;
  }
  zone.innerHTML=h;
  document.getElementById('mem-ajouter').onclick=()=>formPersonne(null);
  const cc=document.getElementById('mem-creer-cherche');
  if(cc)cc.onclick=()=>{
    const nom=rechercheMem.trim();
    rechercheMem='';
    formPersonne(null);
    const ch=document.getElementById('fp-nom');
    if(ch){ch.value=nom;ch.dispatchEvent(new Event('input'))}
  };
  brancherOngletsMem(zone);
  const rech=document.getElementById('mem-recherche');
  if(rech){
    rech.addEventListener('input',()=>{rechercheMem=rech.value;renderMemoire();
      const r2=document.getElementById('mem-recherche');r2.focus();r2.setSelectionRange(r2.value.length,r2.value.length);});
  }
  const pl=zone.querySelector('[data-plier]');
  if(pl)pl.onclick=()=>{memAutresOuvert=!memAutresOuvert;renderMemoire()};
  const br=document.getElementById('mem-ranger');
  if(br)br.onclick=()=>formQuiEstQui();
  const cj=document.getElementById('mem-jum');
  if(cj)cj.querySelectorAll('[data-jum]').forEach(b=>{b.onclick=()=>{
    if(b.dataset.jum==='oui')fusionnerCat(cj.dataset.garde,cj.dataset.vire);
    else refuserFusion(cj.dataset.cle);
  }});
  zone.querySelectorAll('.todo-item[data-id]').forEach(el=>{
    el.onclick=()=>{persOuverte=el.dataset.id;renderMemoire()};
  });
}

  const faites=visibles.filter(e=>e.faite);

    <p class="discret2">Le livre dont on t'a parlé, ce resto, cette expo… Dépose-le ici avant d'oublier. 🔒 Privé par défaut.</p>
  <div class="carte-solo">

      <div><label>Catégorie</label><select id="env-cat">${ENV_CATS.map(c=>`<option value="${c[0]}">${c[1]} ${c[2]}</option>`).join('')}</select></div>

  ENV_CATS.forEach(([cat,ico,titre])=>{

    if(!liste.length)return;
    h+=`<div class="todo-section"><div class="todo-section-title">${ico} ${titre} (${liste.length})</div>`;
    liste.forEach(e=>{
      const aMoi=(e.email_auteur||'').toLowerCase()===EMAIL_CONNECTE;
      h+=`<div class="todo-item" data-id="${e.id}">
        ${aMoi?`<div class="todo-check" data-act="fait" title="Ça y est, c'est fait !"></div>`:`<div style="flex-shrink:0">${ico}</div>`}
        <div class="todo-corps" style="cursor:default"><div class="todo-text">${echap(e.titre)}</div>
          <div class="todo-date">${e.partagee?'👥 partagée'+(aMoi?'':' par '+echap(e.ajoute_par||'?')):'🔒 privée'}${e.detail?' · '+linkifie(e.detail):''}</div></div>
        ${aMoi?`<div class="todo-actions">
          <button class="todo-act" data-act="basculer" title="${e.partagee?'Repasser en privée':'Partager avec la famille'}">${e.partagee?'🔒':'👥'}</button>
          <button class="todo-act" data-act="suppr" title="Supprimer">🗑️</button></div>`:''}
      </div>`;
    });
    h+='</div>';
  });
  if(faites.length){
    h+=`<div class="todo-section" style="border-top:1px dashed var(--border);padding-top:10px">
      <div class="todo-section-title" style="color:var(--ink-3)">Déjà lu · vu · testé (${faites.length})</div>`;
    faites.forEach(e=>{
      const aMoi=(e.email_auteur||'').toLowerCase()===EMAIL_CONNECTE;
      const ico=(ENV_CATS.find(c=>c[0]===e.categorie)||['','💡'])[1];
      h+=`<div class="todo-item done" data-id="${e.id}">
        <div style="flex-shrink:0">${ico}</div>
        <div class="todo-corps" style="cursor:default"><div class="todo-text">${echap(e.titre)}</div></div>
        ${aMoi?`<div class="todo-actions">
          <button class="todo-act" data-act="restaurer" title="Remettre dans les envies">↩️</button>
          <button class="todo-act" data-act="suppr" title="Supprimer">🗑️</button></div>`:''}
      </div>`;

  brancherOngletsMem(zone);

    const titre=document.getElementById('env-titre').value.trim();
    if(!titre){toast('Dis-moi au moins quoi 🙂');return}
    enregistrerObjet(null,'envies',{categorie:document.getElementById('env-cat').value,titre,
      detail:document.getElementById('env-detail').value.trim()||null,faite:false,
      partagee:document.getElementById('env-partagee').checked,
      email_auteur:EMAIL_CONNECTE,cree_le:new Date().toISOString()});
    toast('Envie gardée ✔');

      else if(act==='basculer'){enregistrerObjet(id,'envies',{partagee:!e.partagee});renderMemoire()}
      else if(act==='suppr'){if(confirm('Supprimer cette envie ?')){supprimerObjet(id);renderMemoire()}}
    });
  });
}

function renderFichePersonne(zone,p){
  const notes=notesVisibles().filter(n=>n.personne_id===p.id).sort((a,b)=>(a.cree_le||'')<(b.cree_le||'')?1:-1);
  const nomCle=p.nom.trim().toLowerCase();
  const bd=lesBdays().find(b=>(b.nom||'').trim().toLowerCase()===nomCle&&b.type!=='evenement');
  const kdo=cadeauxVisibles().filter(c=>!c.offert&&(c.personne||'').trim().toLowerCase()===nomCle);
  // Les petits faits qu'on sait d'elle — jamais un formulaire, jamais un manque
  const faits=[];
  if(bd){
    const auj=new Date();
    let d=new Date(auj.getFullYear(),bd.mois-1,bd.jour);
    if(d<new Date(auj.getFullYear(),auj.getMonth(),auj.getDate()))d=new Date(auj.getFullYear()+1,bd.mois-1,bd.jour);
    const dans=Math.round((d-new Date(auj.getFullYear(),auj.getMonth(),auj.getDate()))/864e5);
    const suite=bd.annee?(d.getFullYear()-bd.annee)+' ans':(dans===0?"c'est aujourd'hui":dans===1?'demain':'dans '+dans+' jours');
    faits.push(`<span class="pp-fait">🎂 ${bd.jour} ${MFR[bd.mois-1].toLowerCase()} · ${echap(suite)}</span>`);
  }
  if(p.allergies)faits.push(`<span class="pp-fait">⚠️ ${echap(p.allergies)}</span>`);
  if(kdo.length)faits.push(`<span class="pp-fait">🎁 ${kdo.length} idée${kdo.length>1?'s':''} gardée${kdo.length>1?'s':''}</span>`);
  const traits=traitementsActifs(p.id);
  const medecins=medecinsDe(p.id);
  const aSante=p.foyer||traits.length||medecins.length||CACHE.suivis.some(x=>x.personne_id===p.id)||p.allergies||p.sante_notes;

  let h=`<button class="btn mini" id="mem-retour" style="margin-bottom:12px">‹ Les gens</button>
  <div class="pp-tete">
    <div class="pp-av">${p.emoji||'🧑'}</div>
    <div style="min-width:0">
      <div class="pp-nom">${echap(p.nom)}</div>
      ${roleAffiche(p)?`<div class="pp-sous">${echap(roleAffiche(p))}</div>`:(p.foyer?`<div class="pp-sous">à la maison</div>`:'')}
    </div>
    <span style="flex:1"></span>
    <button class="todo-act" id="mem-editer" title="Modifier">✏️</button>
  </div>
  ${faits.length?`<div class="pp-faits">${faits.join('')}</div>`:''}
  ${traits.length?`<div class="mem-encart" style="margin-top:12px">
    ${traits.map(t=>`<div class="mem-note-tete"><span>💊 ${echap(t.nom)}</span></div>`).join('')}
  </div>`:''}
  ${aSante?`<div style="margin-top:12px"><button class="btn mini" id="mem-sante">🩺 Sa santé${medecins.length?` <span class="todo-date">· ${echap(medecins.map(m=>m.nom).join(', '))}</span>`:''}</button></div>`:''}

const VAPID_PUBLIC='BJ6JYMZBND83sjrKKG8oUH5u6COjzmuwVPMKp0o0PWl7Myd1OIqNwKozFNLytuZz0V4DF9375pyH78eS8PHClC4';
function b64VersUint8(ch){
  const pad='='.repeat((4-ch.length%4)%4);
  const b=(ch+pad).replace(/-/g,'+').replace(/_/g,'/');
  const brut=atob(b);
  return Uint8Array.from([...brut].map(c=>c.charCodeAt(0)));
}
function pushDispo(){return 'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window}
async function etatPush(){
  if(!pushDispo())return 'indispo';
  if(Notification.permission==='denied')return 'refuse';
  try{
    const reg=await navigator.serviceWorker.getRegistration();
    if(!reg)return 'indispo';
    const sub=await reg.pushManager.getSubscription();
    return sub?'active':'inactive';
  }catch(_){return 'inactive'}
}
async function activerPush(){
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){majCloche();return}
    const reg=await navigator.serviceWorker.getRegistration();
    if(!reg){toast('⚠️ Service worker absent — réessaie après avoir rechargé');return}
    const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64VersUint8(VAPID_PUBLIC)});
    const j=sub.toJSON();
    const {error}=await sb.from('push_subscriptions').upsert({endpoint:sub.endpoint,email:EMAIL_CONNECTE,p256dh:j.keys.p256dh,auth:j.keys.auth});
    if(error){toast('⚠️ Non enregistré : '+error.message);return}
    toast('Notifications activées sur cet appareil 🎉');
  }catch(e){toast('⚠️ Impossible d’activer : '+(e.message||e))}
  majCloche();
}
async function desactiverPush(){
  try{
    const reg=await navigator.serviceWorker.getRegistration();
    const sub=reg&&await reg.pushManager.getSubscription();
    if(sub){
      await sb.from('push_subscriptions').delete().eq('endpoint',sub.endpoint);
      await sub.unsubscribe();
    }
    toast('Notifications désactivées sur cet appareil');
  }catch(e){toast('⚠️ '+(e.message||e))}
  majCloche();
}

/* ---------- ☀️ Ta journée : la carte compacte de l'accueil ----------
   Une seule info utile : la PROCHAINE chose de la journée. Le reste en
   chiffres. Hauteur fixe, même un jour à 12 événements. Tout le détail
   vit dans l'écran du jour (clic n'importe où sur la carte). */
function prochaineChose(){
  const auj=new Date(),sAuj=iso(auj);
  const mnt=auj.getHours()*60+auj.getMinutes();
  const items=[];
  bdaysDuJour(auj).forEach(b=>items.push({h:null,ico:'🎂',txt:b.titre.replace(/^🎂 /,''),det:b.detail||''}));
  evtsDuJour(auj).forEach(e=>items.push({h:e.heure||null,ico:'●',coul:coulEvt(e),txt:e.titre,det:e.qui||''}));
  actsDuJour(auj).filter(a=>!a.annuleeCeJour).forEach(a=>items.push({h:a.hd||null,ico:'🔁',txt:a.titre.split('—')[0].trim(),det:a.qui||''}));
  const taches=toutesTaches().filter(t=>t.ech===sAuj&&!estFaite(t.id));
  const avecH=items.filter(i=>i.h).sort((a,b)=>minutes(a.h)-minutes(b.h));
  const aVenir=avecH.filter(i=>minutes(i.h)>=mnt);
  let vedette=aVenir[0]||null,dansProg=!!vedette;
  if(!vedette){
    const sansH=items.filter(i=>!i.h);
    if(sansH.length){vedette=sansH[0];dansProg=true}
    else if(taches.length){vedette={h:null,ico:'☑️',txt:taches[0].texte,det:taches[0].qui?'👤 '+taches[0].qui:''};dansProg=false}
    else if(avecH.length){vedette={h:null,ico:'🌙',txt:"C'est fini pour aujourd'hui",det:'',fini:true};dansProg=true}
  }
  return {vedette,dansProg,nProg:items.length,nTaches:taches.length};
}
function blocJournee(){
  const auj=new Date();
  const v=enVacances(auj),f=ferie(auj);
  const {vedette,dansProg,nProg,nTaches}=prochaineChose();
  const retard=tachesQuiTePressent().length;
  const dateTxt=`${DFR[jSem(auj)-1].toLowerCase()} ${auj.getDate()} ${MFR[auj.getMonth()].toLowerCase()}`;
  let h=`<div class="jc-h"><b>☀️ Ta journée</b>
    ${f?'<span>🇫🇷 '+echap(f)+'</span>':''}${v&&!f?'<span>'+echap(v.nom)+'</span>':''}
    <span class="jc-d">${dateTxt}</span></div>`;
  if(vedette){
    h+=`<div class="jc-next">${vedette.h?`<span class="jc-heure">${echap(vedette.h)}</span>`:
        `<span class="jc-heure" style="color:var(--ink-3)">${vedette.ico}</span>`}
      <span class="jc-ti">${echap(vedette.txt)}${vedette.det?` <span class="jr-de" style="font-weight:500">· ${echap(vedette.det)}</span>`:''}</span></div>`;
  }else{
    h+=`<div class="jc-next"><span class="jc-ti" style="font-weight:500;color:var(--ink-2)">Rien de prévu aujourd'hui 🌿</span></div>`;
  }
  const autres=Math.max(0,nProg-(dansProg&&vedette&&!vedette.fini?1:0));
  const dosesRestantes=dosesDuJour(auj).filter(x=>!x.faite).length;
  const bouts=[];
  if(autres)bouts.push((vedette&&dansProg?'puis ':'')+autres+' autre'+(autres>1?'s':''));
  if(nTaches)bouts.push(nTaches+' à faire');
  if(dosesRestantes)bouts.push('💊 '+dosesRestantes+' dose'+(dosesRestantes>1?'s':''));
  h+=`<div class="jc-bas"><span style="overflow:hidden;text-overflow:ellipsis">${bouts.length?echap(bouts.join(' · ')):'<span style="color:var(--ink-3)">journée libre</span>'}</span>
    ${retard?`<span class="jc-retard">🚨 ${retard} en retard</span>`:''}
    <span class="jc-lien">tout voir ›</span></div>`;
  return `<div class="journee compacte" id="blocJournee" data-jr="jour">${h}</div>`;
}
function brancherJournee(zone){
  zone.querySelectorAll('[data-jr]').forEach(el=>{
    el.onclick=(ev)=>{

      const q=el.dataset.jr;
      if(q==='jour'){ouvrirJour(new Date());return}
      if(q==='cal'){vuePlanning='mois';setSection('planning');return}
      if(q==='todo'){setSection('todo');return}
    };
  });
}

async function majReglagesNotifs(){
  const el=document.getElementById('p-notif-etat'),btn=document.getElementById('p-notif-btn');
  if(!el||!btn)return;
  const e=await etatPush();
  btn.style.display='none';
  // Un test qui ne passe PAS par le serveur : si celui-ci s'affiche et que
  // les vrais rappels non, le problème est dans la livraison, pas dans le
  // téléphone. S'il ne s'affiche pas non plus, c'est un réglage iOS.
  const bTest=document.getElementById('p-notif-test');
  const diag=document.getElementById('p-notif-diag');
  if(bTest){
    bTest.style.display=(e==='active')?'':'none';
    bTest.onclick=async()=>{
      diag.textContent='';
      try{
        const reg=await navigator.serviceWorker.getRegistration();
        if(!reg){diag.textContent='⚠️ Pas de service worker sur cet appareil.';return}
        await reg.showNotification('🏡 Famille',{body:'Si tu vois ceci, ton téléphone sait afficher mes notifications.',icon:'icon-192.png',badge:'icon-192.png'});
        diag.textContent='Envoyée. Si rien ne s\'affiche : Réglages iOS → Notifications → Famille.';
      }catch(err){diag.textContent='⚠️ '+(err.message||err)}
    };
  }
  if(e==='active'){
    el.textContent='Activées sur cet appareil ✓ — tu es prévenu·e le matin et quand quelqu\'un ajoute un événement.';
    btn.style.display='';btn.textContent='🔕 Couper sur cet appareil';
    btn.onclick=async()=>{await desactiverPush();majReglagesNotifs()};
  }else if(e==='refuse'){
    el.textContent='Bloquées dans les réglages du téléphone (Notifications > Famille). Autorise-les là-bas, puis reviens ici.';
  }else if(e==='inactive'){
    el.textContent='Coupées sur cet appareil.';
    btn.style.display='';btn.textContent='🔔 Activer les notifications';
    btn.onclick=async()=>{await activerPush();majReglagesNotifs()};
  }else{
    el.textContent='Indisponibles ici — installe d\'abord l\'app sur l\'écran d\'accueil.';
  }
}
